# aurum-job: capability=test-unit language=js role=gate
# Portfolio capability: test-unit for one deployable unit's TypeScript source
# (CI_STANDARD Principle 12 — one way per capability). Language tier: vitest is
# TypeScript tooling, not a framework's, so this one job serves a React client
# and an Express server alike — the caller says which by passing `dir`.
#
# The caller owns the job id and needs: wiring (Phase F1); this file owns the
# body. It invokes vitest directly rather than a per-repo `test:unit` script,
# because a script that only forwards a path is repo-specific machinery the
# portfolio should not be carrying (Phase F2).
name: job-test-unit-js-vitest

on:
  workflow_call:
    inputs:
      workdir:
        description: >-
          Directory holding package.json and .node-version, relative to the
          repo root. Defaults to `.`, the repo root, for a repo whose JS
          project *is* the repo; `client` is the other common shape, a React
          app in its own pnpm project inside a Go or PHP tree. Any other path
          is accepted — the catalog standardises the toolchain, not the tree
          (workflows#252). It must be relative, must not escape the root, and
          must contain a package.json; the job fails naming the path if not.
        type: string
        default: "."
      dir:
        description: >-
          Which standard unit to act on: `client`, `server` or `shared`. Not a
          path — the layout is fixed portfolio-wide, and any other value fails.
        type: string
        required: true
      flag:
        description: >-
          DEPRECATED and inert. It named the Codecov flag for this unit's
          upload, and there is no per-unit upload any more — job-coverage-upload
          sends one merged report for the whole run, and a flag is a property of
          an upload. Codecov components (component_management), which slice by
          path, are where a per-unit breakdown comes from now.

          Still declared because deleting an input a caller passes is an
          immediate hard error at workflow startup, and event-manager passes
          `flag: react-unit-tests` today. The caller wave drops it; the release
          after that deletes this.
        type: string
        default: ""

jobs:
  test-unit:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # The job-level permissions block REPLACES the caller's token grant,
      # so packages: read must be explicit or private @aurum-alpha
      # installs 403 (C2 first run).
      packages: read
    steps:
      # The unit is one of three names, portfolio-wide (CI_STANDARD "Standard
      # repository layout"). This input says *which* standard unit, never
      # *where a repo happens to keep it* — a free-form path here would make the
      # catalog accommodate variance instead of removing it.
      - name: Validate unit
        env:
          UNIT: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          case "$UNIT" in
            client|server|shared) ;;
            # `.` is the second repo shape: the JS project lives inside a Go or
            # PHP tree, workdir already points at it, and the project *is* the
            # unit — there is no client/server split within it to scope to.
            .) ;;
            *) echo "::error::dir must be client, server, shared, or '.' when the" \
                    "workdir is itself the unit; got '$UNIT'." \
                    "See CI_STANDARD 'Standard repository layout'."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workdir is DEFAULTED, not restricted. `.` is the common shape --
      # the JS project is the repo -- and `client` is the second, its own pnpm
      # project inside a Go or PHP tree. A repo that keeps its UI anywhere else
      # passes that path and the job runs there.
      #
      # This step used to REJECT anything but those two, on the argument that a
      # third path was variance the catalog exists to remove. That was the
      # wrong variance to remove. What the catalog standardises is the RUNNER
      # -- one pnpm, one TypeScript, one set of steps in one order, so a build
      # is reproducible and a version bump is one wave instead of eleven -- and
      # none of that depends on where the code sits. Restricting the path
      # bought uniformity in the dimension that costs nothing to vary, and cost
      # adoption in the dimension that matters: a repo whose layout did not fit
      # could not call the job at all, and therefore got none of the version
      # standardisation either. The toolchain is dictated; the tree is not.
      #
      # What is still checked is that the path is safe and real. It runs AFTER
      # checkout because the second half needs a tree, and it names the path so
      # a typo fails here rather than six steps later inside pnpm.
      - name: Validate workdir
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          case "$WD" in
            "") echo "::error::workdir is empty; use '.' for the repo root."
                exit 1 ;;
            /*) echo "::error::workdir must be relative to the repo root;" \
                     "got '$WD'."; exit 1 ;;
            ..|../*|*/../*|*/..)
                echo "::error::workdir must not escape the repo root;" \
                     "got '$WD'."; exit 1 ;;
          esac
          if [ ! -f "$WD/package.json" ]; then
            echo "::error::no package.json at workdir '$WD'." \
                 "The workdir names the directory holding package.json and" \
                 ".node-version, relative to the repo root."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
          # The default dest is ~/setup-pnpm, shared by every job on a
          # persistent self-hosted host; two installing pnpm at once race and
          # one dies on ENOTEMPTY. runner.temp is per-job — the same fix as
          # "Isolate Go caches to runner.temp" in the Go jobs. Kept identical
          # to setup/node-pnpm, which is this prelude's other copy.
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      # Phase F3. Splitting the test job per unit made a pre-existing gap
      # visible for the first time: four of six repos have no server tests at
      # all, and hiring-tracker has no client tests. That debt predates the
      # standard, so it warns rather than blocks until F3 closes it.
      #
      # Deliberately NOT continue-on-error, which would swallow real breakage
      # too. This annotates only the specific condition "there is nothing here
      # to run"; a test that exists and fails still fails the job below.
      - name: Warn when the unit has no tests
        id: census
        working-directory: ${{ inputs.workdir }}
        shell: bash
        env:
          WD: ${{ inputs.workdir }}
          UNIT: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          count=$(find "${{ inputs.dir }}" \
            \( -name '*.test.ts'  -o -name '*.test.tsx' \
            -o -name '*.spec.ts'  -o -name '*.spec.tsx' \) \
            -not -path '*/node_modules/*' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

          # The junit filename was computed in two places with two different
          # rules: the vitest invocation substituted `.` -> `root`, and the
          # upload step interpolated inputs.dir raw. For every unit but `.` they
          # agreed, so the mismatch only broke the repo shape where the workdir
          # IS the unit — the upload looked for `test-report-..junit.xml`, which
          # never exists. Computed once here and consumed by name from now on.
          echo "junit=test-report-${UNIT//./root}.junit.xml" >> "$GITHUB_OUTPUT"

          # Artifact names are a namespace shared by every job in the caller's
          # run, so this has to be unique per test job without knowing the
          # caller's job id (a called workflow cannot see it — github.job here
          # reads `test-unit`, the id inside THIS file). workdir and dir are
          # what distinguish the callers, so they are the key. `.` is legal in
          # an artifact name but reads as a typo next to a real directory, so it
          # spells itself out.
          key="${WD}-${UNIT}"
          key="${key//\//-}"
          key="${key//./root}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

          if [ "${count}" -eq 0 ]; then
            echo "::warning title=No tests for ${{ inputs.dir }}::This unit has \
          no test files. CI cannot tell you whether it works. Tracked as \
          CI_STANDARD Phase F3."
          else
            echo "${count} test file(s) under ${{ inputs.dir }}/"
          fi

      # --passWithNoTests is what makes the warning above the *only* signal for
      # an empty unit; without it vitest exits non-zero and the job blocks,
      # which is the F3 decision reversed.
      #
      # Coverage is configured separately from --dir, so the one-box repo's server job
      # printed a table of client/src/lib and shared files. Under the `server`
      # flag that attributes client code to the server and makes every per-unit
      # number a lie.
      #
      # The fix SUBTRACTS the other units rather than redefining the set.
      # Overriding --coverage.include='<dir>/**' also removed the leak, but
      # replaced the repo's curated include (client/src/lib) with every .tsx in
      # client/src — coverage fell from 49% to 4% and turned codecov red. That
      # is not a truer number, just a different question. Excluding siblings
      # keeps the repo's intent and removes only what does not belong.
      - name: Unit tests
        working-directory: ${{ inputs.workdir }}
        env:
          UNIT: ${{ inputs.dir }}
        # No `--` before the flags: pnpm 10 swallows a literal `--`, so vitest
        # would never see them (verified the hard way).
        run: |
          set -euo pipefail
          # The standard unit directories (F0). Everything that is not this unit
          # is excluded from coverage, so a repo conforms to the job rather than
          # the job taking a per-caller input.
          # Subtract the sibling units from coverage rather than redefining the
          # set: --coverage.include replaces the repo's curated list and tanks
          # the baseline (it took wardley-mapper from 49% to 4%). With UNIT="."
          # there are no siblings — the workdir is the whole project.
          #
          # --coverage.exclude REPLACES the config's exclude array rather than
          # extending it, so passing siblings alone silently re-admits
          # node_modules, dist, .d.ts and every *.config.* file to the
          # denominator. hiring-tracker measured vite.config.ts at 0% over 11
          # lines because of exactly that. The defaults are restated here so the
          # flag adds to them instead of standing in for them.
          excludes=(
            --coverage.exclude='**/node_modules/**'
            --coverage.exclude='**/dist/**'
            --coverage.exclude='**/coverage/**'
            --coverage.exclude='**/*.d.ts'
            --coverage.exclude='**/*.config.*'
            --coverage.exclude='**/.{idea,git,cache,output,temp}/**'
          )
          if [ "$UNIT" != "." ]; then
            for u in client server shared; do
              [ "$u" = "$UNIT" ] || excludes+=(--coverage.exclude="$u/**")
            done
          fi
          pnpm exec vitest run \
            --dir "$UNIT" \
            --passWithNoTests \
            --coverage "${excludes[@]}" \
            --reporter=default --reporter=junit \
            --outputFile.junit="${{ steps.census.outputs.junit }}"

      # Handed to job-coverage-upload rather than sent to Codecov from here.
      # This job now answers one question — do the tests pass — and a Codecov
      # outage can no longer skip the caller's image-build by failing it.
      # See job-coverage-upload.yml for why that split exists.
      #
      # No `if: !cancelled()` on this one, so it inherits success(): a unit
      # whose tests failed publishes NO coverage, and the upload job simply
      # finds one fewer artifact. That is the behaviour this replaced (the old
      # coverage step was gated the same way) and it is also what makes the
      # collector countless — there is no expected number to be wrong about.
      - name: Publish coverage for the upload job
        if: steps.census.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-vitest-${{ steps.census.outputs.key }}
          path: ${{ inputs.workdir }}/coverage
          if-no-files-found: error
          retention-days: 1

      # !cancelled(), unlike coverage above: a failed run IS the test-analytics
      # signal, which is why the step this replaces carried the same condition.
      - name: Publish test results for the upload job
        if: ${{ !cancelled() && steps.census.outputs.count != '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testresults-vitest-${{ steps.census.outputs.key }}
          path: ${{ inputs.workdir }}/${{ steps.census.outputs.junit }}
          if-no-files-found: error
          retention-days: 1
