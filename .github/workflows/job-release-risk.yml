# Fleet capability: flag a version change to a pull request reader
# (CI_STANDARD Principle 12 — one way per capability). Single-job reusable
# workflow: the caller owns the job id and needs: wiring; this file owns the
# entire job body.
#
# WHY THIS EXISTS: a version bump is allowed to ride along with the change
# that justifies it — that keeps the semver judgement next to the code that
# motivated it, and adds no friction. The risk is that a reviewer approves a
# feature and cuts a release without noticing. This job makes that
# consequence visible in the place the decision is actually made, rather than
# preventing it.
#
# It never fails the build. Blocking here would be friction for something a
# reviewer is entitled to do deliberately; the job's job is to make sure it
# is deliberate.
name: job-release-risk

on:
  workflow_call:
    inputs:
      version_file:
        description: Path to the committed version file (CI_STANDARD Principle 14).
        type: string
        default: ".version"
      runner:
        description: >-
          Override runs-on. Leave empty for the fleet default. Set to a
          GitHub-hosted label where a repo must not build on the fleet
          (CI_STANDARD Principle 4).
        type: string
        default: ""

jobs:
  release-risk:
    # Only pull requests have somewhere to post.
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # Escalated above the read-only fleet floor: this job's whole purpose is
      # writing a comment. Nothing else in the workflow needs it.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare version file against the base branch
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          set -euo pipefail
          read_at() {
            git show "$1:${VERSION_FILE}" 2>/dev/null | tr -d ' \t\r\n' || true
          }
          before="$(read_at "$BASE_SHA")"
          after=""
          [ -f "$VERSION_FILE" ] && after="$(tr -d ' \t\r\n' < "$VERSION_FILE")"

          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged (${before:-none}); nothing to flag."
            exit 0
          fi

          # A release that also carries code is the case worth naming: the
          # reader came to review a change, not to approve a release.
          code_changed=false
          if git diff --name-only "$BASE_SHA"...HEAD \
              | grep -qvE "^(${VERSION_FILE}|CHANGELOG\.md)$"; then
            code_changed=true
          fi

          major_bump=false
          if [ -n "$before" ] && [ -n "$after" ]; then
            if [ "${before%%.*}" != "${after%%.*}" ]; then
              major_bump=true
            fi
          fi

          {
            echo "changed=true"
            echo "before=${before:-none}"
            echo "after=${after:-none}"
            echo "code_changed=${code_changed}"
            echo "major_bump=${major_bump}"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update the release-risk comment
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          BEFORE: ${{ steps.diff.outputs.before }}
          AFTER: ${{ steps.diff.outputs.after }}
          CODE_CHANGED: ${{ steps.diff.outputs.code_changed }}
          MAJOR_BUMP: ${{ steps.diff.outputs.major_bump }}
          VERSION_FILE: ${{ inputs.version_file }}
        with:
          script: |
            // Stable marker so the comment is updated in place. A new comment
            // on every push would train reviewers to ignore it.
            const MARKER = '<!-- aurum-alpha:release-risk -->';
            const { BEFORE, AFTER, CODE_CHANGED, MAJOR_BUMP, VERSION_FILE } = process.env;

            const lines = [
              MARKER,
              '### This pull request cuts a release',
              '',
              `\`${VERSION_FILE}\`: **${BEFORE} → ${AFTER}**`,
              '',
              'Merging publishes this version. The artifact is the one this run already built and gated — a release renames and distributes it, it does not rebuild it.',
            ];

            if (CODE_CHANGED === 'true') {
              lines.push(
                '',
                'This PR changes code **and** the version, so approving the code also approves the release. That is allowed; it just should not be a surprise.',
              );
            }

            if (MAJOR_BUMP === 'true') {
              lines.push(
                '',
                '**Major bump.** This asserts a breaking change to something outside this repo. No tool can check that claim — it is the reviewer’s to confirm.',
              );
            }

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const existing = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const mine = existing.find((c) => c.body && c.body.includes(MARKER));

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
