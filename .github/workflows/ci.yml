name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback: pull_request events from app-authored branches have been
  # observed not to spawn runs in this repo (see PR #2); dispatching against
  # the branch still lands the ci-ok check on the head commit.
  workflow_dispatch:

# Principle 6, which this repo defines and so had better follow: cancel
# superseded pull-request runs, never the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

      # check-devkit-drift proves each product's rendered copy matches
      # devkit/. Nothing proved devkit/ is a valid nginx configuration, so a
      # typo in edge.conf would reach eight products and first show up as a
      # container that will not start.
      #
      # It runs here rather than in job-ci-conformance because the question is
      # about the SOURCE, and asking it once is enough; a product re-validating
      # a file it is forbidden to edit learns nothing. The nginx is the one the
      # devkit's own compose fragment starts, reached through docker the same
      # way actionlint above is.
      - name: The devkit's nginx config parses
        run: tools/check-devkit-nginx

  conformance:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      # Shallow again. The full history was here for check-standard-ref, which
      # diffed the pull request against its base; that checker is gone with
      # standard_ref, and every step left in this job reads files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check our own ci.yml against CI_STANDARD
        run: tools/check-ci-conformance --repo-root .

      # Charter D10, the writing convention. Warn-only until the documents
      # written before it are under the threshold; the ledger row moves to
      # gated in its own change, and this flag goes with it.
      - name: Measure the documents against the writing convention
        run: tools/check-doc-style --warn-only --summary

      # #126 renamed a checker and left job-ci-conformance.yml invoking the
      # old path, and nothing noticed until a caller hit exit 127. This is the
      # cheapest possible check for that, and it lives here rather than in a
      # checker because it is a question about this repo's own wiring.
      #
      # ONE TREE now. It used to need two: a caller took job-ci-conformance.yml
      # from the tag it pinned and the checkers from a separate clone at
      # standard_ref, so "the checker exists" had to be true in both, and the
      # standard_ref half was the half that reached the portfolio. v2.2.10
      # invoked check-exact-pins and v2.2.11 invoked check-overrides while
      # neither existed at the standard_ref those releases carried -- added and
      # wired in one pull request, with standard_ref at that pull request's
      # base, which predates the file. Nothing went red because no repository
      # had re-pinned yet; the first one to try would have got exit 127.
      #
      # With callers on @main the workflow and its checkers come from the same
      # commit, so a checker added and wired together is coherent by
      # construction and this step is back to what it looks like: does the file
      # this repo ships invoke anything this repo does not have.
      - name: Every checker job-ci-conformance invokes exists
        run: |
          set -euo pipefail
          missing=0
          # A pipe would run this loop in a subshell and throw the flag away,
          # which is how this gate spent its life unable to fail.
          while read -r invoked; do
            name="${invoked##*/}"
            if [ ! -x "tools/$name" ]; then
              echo "::error::job-ci-conformance.yml invokes ${invoked}, but" \
                   "tools/${name} does not exist or is not executable."
              missing=1
            else
              echo "  ok  tools/${name}"
            fi
          done < <(grep -oE '\.aurum-catalog/tools/[a-z0-9-]+' \
                     .github/workflows/job-ci-conformance.yml | sort -u)
          exit $missing

      # The catalog's own CI never RUNS the image jobs — they only execute in
      # caller repos — so a bug in one of their shell loops reaches the portfolio
      # unexamined. This is the one class of that bug cheap enough to check
      # statically: a newline-separated input read without both guards.
      - name: Check the catalog's input loops
        run: tools/check-catalog-loops

      # Same species as the loop check, and here for the same reason: it
      # inspects this repo's own shared jobs, which never run in this repo's
      # CI, so a divergence between them would otherwise reach the portfolio
      # unexamined. Two build systems answering "what version is this build"
      # differently is not a cosmetic drift.
      - name: Check the shared version-stamp block agrees across jobs
        run: tools/check-version-stamp-shared

      # Same reason as the stamp check: the decision is copied into two jobs
      # because a reusable workflow runs in the caller's checkout. A copy that
      # drifts tags a Go release the go command cannot fetch.
      - name: Check the Go module-major block
        run: tools/check-go-module-version

      # The go-caches action runs inside every job-go-*.yml, and those jobs
      # never run here. A break in it would first show up as red or slow Go
      # jobs across the fleet, so its script is tested where it is written.
      - name: Test the go-caches script
        run: tools/test-go-caches

      # setup-builder runs inside every image job, and those jobs never build
      # here. Every decision it makes before creating a builder is held here,
      # each with a time bound; the farm half is setup-builder-farm below.
      - name: Test the setup-builder decisions
        run: tools/test-setup-builder

      # check-dependency-versions runs in every caller's ci-conformance, and
      # raise-dependency-floors rewrites the fleet's record. Neither has a
      # caller here that exercises a failing case, so both are tested here.
      - name: Test the dependency version windows
        run: tools/test-dependency-versions

  # setup-builder against a real BuildKit daemon with mTLS, which
  # tools/test-setup-builder cannot stand up: a throwaway CA, a stand-in farm,
  # and the three answers the action has to give. The job's docker CLI talks
  # to the runner's dind, and the runner shares the dind's network namespace,
  # so a port the stand-in publishes on 127.0.0.1 is reachable as localhost.
  # It shares no filesystem, which is why the certificates go in with docker
  # cp rather than a bind mount.
  setup-builder-farm:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    env:
      # The daemon the farm runs; a stand-in of another version would prove
      # the handshake against a server the fleet does not have.
      BUILDKIT_IMAGE: moby/buildkit:v0.34.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two CAs. The good client certificate chains to the one the stand-in
      # trusts; the foreign one chains to the other, beside the right ca.pem,
      # so the only thing wrong with it is who signed it.
      - name: Make throwaway certificates
        id: pki
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/pki"
          mkdir -p "${d}/server" "${d}/good" "${d}/foreign"
          cd "$d"
          for ca in ca ca2; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=setup-builder test ${ca}" \
              -keyout "${ca}-key.pem" -out "${ca}.pem" 2>/dev/null
          done
          openssl req -newkey rsa:2048 -nodes -subj /CN=localhost \
            -keyout server/server-key.pem -out server.csr 2>/dev/null
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca-key.pem -CAcreateserial -days 1 \
            -extfile server.ext -out server/server.pem 2>/dev/null
          cp ca.pem server/ca.pem
          printf 'extendedKeyUsage=clientAuth\n' > client.ext
          for pair in ca:good ca2:foreign; do
            signer="${pair%%:*}" dir="${pair##*:}"
            openssl req -newkey rsa:2048 -nodes -subj /CN=runner \
              -keyout "${dir}/client-key.pem" -out "${dir}.csr" 2>/dev/null
            openssl x509 -req -in "${dir}.csr" -CA "${signer}.pem" -CAkey "${signer}-key.pem" \
              -CAcreateserial -days 1 -extfile client.ext -out "${dir}/client.pem" 2>/dev/null
            cp ca.pem "${dir}/ca.pem"
          done
          echo "dir=${d}" >> "$GITHUB_OUTPUT"

      - name: Start the stand-in farm
        env:
          PKI: ${{ steps.pki.outputs.dir }}
        run: |
          set -euo pipefail
          docker create --name setup-builder-farm --privileged -p 127.0.0.1:1234:1234 "$BUILDKIT_IMAGE" \
            --addr tcp://0.0.0.0:1234 \
            --tlscacert /certs/ca.pem --tlscert /certs/server.pem --tlskey /certs/server-key.pem >/dev/null
          docker cp "${PKI}/server/." setup-builder-farm:/certs/
          docker start setup-builder-farm >/dev/null
          for _ in $(seq 60); do
            if timeout 1 bash -c 'exec 3<>/dev/tcp/127.0.0.1/1234' 2>/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs setup-builder-farm
          echo "::error::The stand-in farm never listened on 127.0.0.1:1234."
          exit 1

      - id: remote
        uses: ./.github/actions/setup-builder
        with:
          endpoint: tcp://localhost:1234
          servername: localhost
          certs-dir: ${{ steps.pki.outputs.dir }}/good
          platforms: ${{ runner.arch == 'ARM64' && 'linux/arm64' || 'linux/amd64' }}

      - name: Good certificate, a platform it lists → remote
        env:
          MODE: ${{ steps.remote.outputs.mode }}
          REASON: ${{ steps.remote.outputs.reason }}
        run: |
          if [ "$MODE" != remote ]; then
            echo "::error::Expected remote, got ${MODE}: ${REASON}"
            exit 1
          fi

      # The point of a farm: the second build of the same context runs no
      # step. Only the RUN and COPY steps are held to it, because how a FROM
      # step reports a resolved base varies between BuildKit releases.
      - name: Build twice on the stand-in; the second build runs nothing
        run: |
          set -euo pipefail
          ctx="${RUNNER_TEMP}/fixture"
          mkdir -p "$ctx"
          printf 'FROM busybox:1.37.0\nRUN echo built > /built\nCOPY Dockerfile /Dockerfile.copy\n' > "${ctx}/Dockerfile"
          for pass in first second; do
            docker buildx build --builder build-farm --progress plain --output type=cacheonly "$ctx" \
              > "${RUNNER_TEMP}/${pass}.log" 2>&1 || { cat "${RUNNER_TEMP}/${pass}.log"; exit 1; }
          done
          cat "${RUNNER_TEMP}/second.log"
          steps="$(grep -oE '^#[0-9]+ \[[0-9]+/[0-9]+\] (RUN|COPY) ' "${RUNNER_TEMP}/second.log" | awk '{print $1}' | sort -u)"
          if [ -z "$steps" ]; then
            echo "::error::The second build's log names no RUN or COPY step to check."
            exit 1
          fi
          for s in $steps; do
            if ! grep -qx "${s} CACHED" "${RUNNER_TEMP}/second.log"; then
              echo "::error::Step ${s} ran again on the second build."
              exit 1
            fi
          done

      - id: foreign
        uses: ./.github/actions/setup-builder
        with:
          endpoint: tcp://localhost:1234
          servername: localhost
          certs-dir: ${{ steps.pki.outputs.dir }}/foreign

      - name: Client certificate from another CA → local
        env:
          MODE: ${{ steps.foreign.outputs.mode }}
          REASON: ${{ steps.foreign.outputs.reason }}
        run: |
          if [ "$MODE" != local ]; then
            echo "::error::Expected local, got ${MODE}: ${REASON}"
            exit 1
          fi

      # The platform is whichever the stand-in does not list, rather than a
      # fixed arm64: a host with QEMU registered in its kernel makes BuildKit
      # list the emulated platforms too.
      - name: Pick a platform the stand-in has no worker for
        id: absent
        run: |
          set -euo pipefail
          listed="$(docker buildx inspect build-farm | sed -n 's/^Platforms:[[:space:]]*//p' | head -n 1 \
            | tr -d ' ' | tr ',' '\n' | sed 's/\*$//')"
          for p in linux/arm64 linux/riscv64 linux/s390x linux/ppc64le linux/mips64le; do
            if ! printf '%s\n' "$listed" | grep -qxF "$p"; then
              echo "platform=${p}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::The stand-in lists every candidate platform: ${listed}"
          exit 1

      - id: platform
        uses: ./.github/actions/setup-builder
        with:
          endpoint: tcp://localhost:1234
          servername: localhost
          certs-dir: ${{ steps.pki.outputs.dir }}/good
          platforms: ${{ steps.absent.outputs.platform }}

      - name: A platform the farm lacks → local
        env:
          MODE: ${{ steps.platform.outputs.mode }}
          REASON: ${{ steps.platform.outputs.reason }}
        run: |
          if [ "$MODE" != local ]; then
            echo "::error::Expected local, got ${MODE}: ${REASON}"
            exit 1
          fi

      - name: Remove the stand-in farm
        if: always()
        run: docker rm -f setup-builder-farm >/dev/null 2>&1 || true

  contract-conformance:
    uses: ./.github/workflows/job-contract-conformance.yml

  # The catalog eats its own cooking here too, at the local path, so a change
  # to the job or the checker is gated by the run that ships it. The
  # standing-state half blocks from the start: this history holds nothing the
  # config does not already name, the corpus vectors and the devkit's image
  # line, so there is no window to hold open.
  secret-scan:
    uses: ./.github/workflows/job-secret-scan.yml
    with:
      fail_on_existing: true

  version-gate:
    uses: ./.github/workflows/job-version-gate.yml
    permissions:
      contents: read
      pull-requests: write

  version-read:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      version_changed: ${{ steps.stamp.outputs.version_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^ is what the release decision reads. Two commits is all of it.
          fetch-depth: 2
      - id: stamp
        shell: python3 {0}
        env:
          VERSION_FILE: .version
        run: |
          import os, pathlib, subprocess

          vf = pathlib.Path(os.environ["VERSION_FILE"])
          # No version file is a valid answer, not an error: Principle 16 says a
          # repo with nothing deciding from the string has no version at all.
          version = vf.read_text().strip() if vf.is_file() else "dev"
          commit = subprocess.run(["git", "rev-parse", "--short=7", "HEAD"],
                                  capture_output=True, text=True).stdout.strip() or "unknown"

          # --- BEGIN shared: version stamp. KEEP EVERY COPY IDENTICAL.
          # tools/check-version-stamp-shared compares this region across every workflow
          # job that carries it and fails if they diverge, so editing one copy without
          # the others turns this repo red rather than letting two build systems drift
          # into two versioning semantics.
          #
          # It is duplicated rather than extracted because a reusable workflow runs in the
          # CALLER's checkout and cannot reach a catalog composite except by naming the
          # catalog repository. That used to mean a SHA pin, and so a two-commit dance
          # for every edit; since the portfolio moved to @main it does not, and the
          # reason for the duplicate has expired without the duplicate going with it.
          # Extracting it is worth its own change. The checker is what makes it safe
          # meanwhile.
          def resolve_version_stamp(version_file, version, commit):
              """Did THIS commit cut a release, and what should the build stamp?

              Returns (changed, stamp). One answer, so nothing downstream re-derives it.

              A release is a commit that changed the version file. fetch-depth: 2 makes
              HEAD^ available; it resolves on a push (the previous commit) and on a pull
              request (the base branch tip, because the merge ref's first parent is the
              base). A root commit has no parent and is not a release: a repository's
              first commit is not a release event.

              Anything else is a PRE-RELEASE of the next PATCH, which is a floor rather
              than a guess. Whatever the next release turns out to be it is at least
              0.15.1, so the stamp sorts above the last release and below every release
              that could follow:

                  0.15.0  <  0.15.1-dev.abc  <  0.15.1-rc.1  <  0.15.1  <  0.16.0

              Build metadata (0.15.0+dev.abc) would be wrong: SemVer ignores it in
              precedence, so such a build compares EQUAL to the release it is not.
              `dev` and not `beta` or `rc`, which belong to pre-releases a human cuts on
              purpose; ordering is unaffected, since dev < rc by SemVer's ASCII rule.

              Debian is NOT this string. dpkg reads `-` as the separator before the
              debian-revision, so 0.15.1-dev.abc sorts ABOVE 0.15.1 there; a .deb wants
              `~`. That rendering belongs to whichever job packages one.
              """
              import pathlib as _pathlib, re as _re, subprocess as _subprocess

              def _cut_release():
                  if not _pathlib.Path(version_file).is_file():
                      return False
                  if _subprocess.run(["git", "rev-parse", "--verify", "-q", "HEAD^"],
                                     capture_output=True).returncode != 0:
                      print("HEAD has no parent; treating this as not a release.")
                      return False
                  r = _subprocess.run(["git", "diff", "--name-only", "HEAD^", "HEAD"],
                                      capture_output=True, text=True)
                  if r.returncode != 0:
                      # Never guess True. A false positive mints a version; a false
                      # negative only withholds one, and a withheld release is a pull
                      # request someone reopens.
                      print(f"::warning::could not diff HEAD^..HEAD "
                            f"({r.stderr.strip()}); treating this as not a release.")
                      return False
                  return version_file in r.stdout.split()

              changed = _cut_release()
              if changed or version == "dev":
                  return changed, version
              m = _re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not m:
                  # No next patch to be a pre-release of, so say so and order nothing.
                  print(f"::warning::{version_file} reads {version!r}, which is not "
                        "MAJOR.MINOR.PATCH; stamping it unordered.")
                  return changed, f"{version}-dev.{commit}"
              major, minor, patch = (int(g) for g in m.groups())
              return changed, f"{major}.{minor}.{patch + 1}-dev.{commit}"
          # --- END shared: version stamp ---

          changed, stamp = resolve_version_stamp(
              os.environ["VERSION_FILE"], version, commit)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"version_changed={'true' if changed else 'false'}\n")
          print(f"version={version} release={changed} stamp={stamp}")

  version-release:
    # In the rollup, not below it. Needing ci-ok would be a cycle, and a
    # failure after ci-ok had already gone green would block nothing.
    # version-gate is pull-request-only, so on a push it is skipped and that
    # skip is success here. The tag step inside the job still waits for the
    # default branch. ci-ok counts a failure of this job only on that push.
    needs: [lint, conformance, contract-conformance, secret-scan, version-gate, version-read]
    if: >-
      always()
      && needs.version-read.result == 'success'
      && needs.lint.result == 'success'
      && needs.conformance.result == 'success'
      && needs.contract-conformance.result == 'success'
      && needs.secret-scan.result == 'success'
      && (needs.version-gate.result == 'success' || needs.version-gate.result == 'skipped')
    uses: ./.github/workflows/job-version-release.yml
    with:
      version: ${{ needs.version-read.outputs.version }}
      version_changed: ${{ needs.version-read.outputs.version_changed }}
    permissions:
      # The workflow default is contents: read; tagging and releasing need
      # write, and this is the only job in the repo that has it.
      contents: write

  ci-ok:
    # version-read is in here rather than downstream because it is not
    # housekeeping — it is the input the release reads. A version-read that
    # failed while the rollup went green would hand the release an empty
    # version_changed, and the release that did not happen would be reported
    # as fine (rule D6). version-release is in here so a failed tag on the
    # default branch turns this check red. A pull request does not count it.
    needs: [lint, conformance, setup-builder-farm, contract-conformance, secret-scan, version-gate, version-read, version-release]
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      # The catalog eats its own cooking: the local path form, so a change to
      # the action is gated by the same run that ships it. Every other repo
      # pins it at a sha like any other action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-ok
        with:
          needs_json: ${{ toJSON(needs) }}
          main_only_jobs: version-release
          on_default_branch: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
