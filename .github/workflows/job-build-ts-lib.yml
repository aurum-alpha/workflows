# aurum-job: capability=build language=ts role=build
# Portfolio capability: build for a TypeScript library that emits ESM plus
# declarations through tsc (CI_STANDARD Principle 12). LANGUAGE tier: tsc
# exists only for TypeScript, so this is `ts` the way job-typecheck-ts-tsc is,
# not `js`. The tool is tsc; the artifact is a published package, not a Vite
# client and not an esbuild server bundle, which is why those two jobs do not
# cover this case and why a library that named its script `build` failed
# check-package-scripts (workflows#392).
#
# The invocation is fixed, not parameterised. `tsc -b tsconfig.build.json`
# writes `dist/` with `.js` and `.d.ts`. The tsconfig is the convention a
# library meets; an input would be how two libraries ended up with two answers
# to one function.
name: job-build-ts-lib

on:
  workflow_call:
    inputs:
      workdir:
        description: >-
          Directory holding package.json and .node-version, relative to the
          repo root. Defaults to `.`, the repo root, for a repo whose JS
          project *is* the repo. Any other path is accepted — the catalog
          standardises the toolchain, not the tree (workflows#252). It must
          be relative, must not escape the root, and must contain a
          package.json; the job fails naming the path if not.
        type: string
        default: "."
      outdir:
        description: >-
          Built library, relative to workdir. tsc's `outDir` in
          tsconfig.build.json. Defaults to `dist`.
        type: string
        default: dist
      version_file:
        description: >-
          File holding the SemVer this repo releases under (Principle 14 — a
          version is a commit, not a tag), relative to the REPO ROOT and not to
          `workdir`. The version belongs to the repository, not to the JS
          project inside it (Principle 15).

          A repo with nothing deciding from the string has no version file and
          none is required: Principle 16 says such a repo has no version at
          all. `version` then reads `dev`, `version_changed` is `false`, and
          nothing downstream mints anything.
        type: string
        default: .version
    outputs:
      version:
        description: >-
          The version file's contents, verbatim. job-publish-npm-ghp and
          job-version-release mint from it, so it is read once here rather
          than parsed again by everything downstream. `dev` where the repo has
          no version file.

          This is the RELEASE version — what the last release was called, or
          what this commit is about to call one. It is not what a mid-stream
          build calls itself: see `stamp`.
        value: ${{ jobs.build.outputs.version }}
      version_changed:
        description: >-
          `true` when this commit changed the version file, `false` otherwise.

          THIS IS THE RELEASE SWITCH. A version-named emission — a git tag, a
          GitHub release, a versioned package — is produced only where this is
          true. Everything else on main publishes nothing version-named.

          Read it in the caller as
          `needs.<build-job>.outputs.version_changed == 'true'`, and hand it to
          job-publish-npm-ghp and job-version-release, which mint from it and
          never re-derive it.
        value: ${{ jobs.build.outputs.version_changed }}
      stamp:
        description: >-
          The version identity of THIS build: `version` on a release commit,
          and a SemVer pre-release of the next patch — `0.2.1-dev.<sha7>` —
          on every other commit.

          NOTHING IN THIS JOB CONSUMES IT. A tsc emit has no linker to stamp:
          the Go and PlatformIO jobs put this string into the artifact with
          `-X` and a build flag, and this job hands it out instead. It is the
          string a packaging or provenance step renders (Principle 13),
          computed once by the block every build system in the portfolio
          shares, so a library that grows one does not get to invent a second
          answer to what version a mid-stream build is.
        value: ${{ jobs.build.outputs.stamp }}

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.version_changed }}
      stamp: ${{ steps.version.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^ has to exist: the shared block below asks whether THIS commit
          # changed the version file, and the default depth-1 clone has no
          # parent to diff against. Same line, same reason, in job-go-build and
          # job-build-js-vite.
          fetch-depth: 2
      # The workdir is DEFAULTED, not restricted. `.` is the common shape --
      # the JS project is the repo -- and a nested package is the other. What
      # the catalog standardises is the RUNNER, not the tree (workflows#252).
      #
      # What is still checked is that the path is safe and real. It runs AFTER
      # checkout because the second half needs a tree, and it names the path so
      # a typo fails here rather than six steps later inside pnpm.
      - name: Validate workdir
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          case "$WD" in
            "") echo "::error::workdir is empty; use '.' for the repo root."
                exit 1 ;;
            /*) echo "::error::workdir must be relative to the repo root;" \
                     "got '$WD'."; exit 1 ;;
            ..|../*|*/../*|*/..)
                echo "::error::workdir must not escape the repo root;" \
                     "got '$WD'."; exit 1 ;;
          esac
          if [ ! -f "$WD/package.json" ]; then
            echo "::error::no package.json at workdir '$WD'." \
                 "The workdir names the directory holding package.json and" \
                 ".node-version, relative to the repo root."
            exit 1
          fi
      # What version is this build, and did this commit cut a release. One
      # answer, computed here, so nothing downstream re-derives it — the
      # duplication job-version-release was extracted to end, arriving in a
      # fourth build system.
      #
      # NO working-directory, and that is the one place this step deliberately
      # differs from its copy in job-go-build. `git diff --name-only` prints
      # paths from the repo root, and the block matches version_file against
      # that list; running it inside a nested package would compare a
      # root-relative path against a workdir-relative one and answer "not a
      # release" for every release. The version is the repository's
      # (Principle 15), so it is read where it lives.
      #
      # python3, not bash: the block is shared verbatim with the Go, Vite and
      # PlatformIO jobs, and a checker fails this repository if the copies
      # drift. Rewriting it in shell here would be the drift.
      - name: Resolve the version
        id: version
        shell: python3 {0}
        env:
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          import os, pathlib, subprocess

          # No version file is a valid answer, not an error: Principle 16 says a
          # repo with nothing deciding from the string has no version at all.
          vf = pathlib.Path(os.environ["VERSION_FILE"])
          version = vf.read_text().strip() if vf.is_file() else "dev"
          commit = subprocess.run(["git", "rev-parse", "--short=7", "HEAD"],
                                  capture_output=True, text=True).stdout.strip() or "unknown"

          # --- BEGIN shared: version stamp. KEEP EVERY COPY IDENTICAL.
          # tools/check-version-stamp-shared compares this region across every workflow
          # job that carries it and fails if they diverge, so editing one copy without
          # the others turns this repo red rather than letting two build systems drift
          # into two versioning semantics.
          #
          # It is duplicated rather than extracted because a reusable workflow runs in the
          # CALLER's checkout and cannot reach a catalog composite except by naming the
          # catalog repository. That used to mean a SHA pin, and so a two-commit dance
          # for every edit; since the portfolio moved to @main it does not, and the
          # reason for the duplicate has expired without the duplicate going with it.
          # Extracting it is worth its own change. The checker is what makes it safe
          # meanwhile.
          def resolve_version_stamp(version_file, version, commit):
              """Did THIS commit cut a release, and what should the build stamp?

              Returns (changed, stamp). One answer, so nothing downstream re-derives it.

              A release is a commit that changed the version file. fetch-depth: 2 makes
              HEAD^ available; it resolves on a push (the previous commit) and on a pull
              request (the base branch tip, because the merge ref's first parent is the
              base). A root commit has no parent and is not a release: a repository's
              first commit is not a release event.

              Anything else is a PRE-RELEASE of the next PATCH, which is a floor rather
              than a guess. Whatever the next release turns out to be it is at least
              0.15.1, so the stamp sorts above the last release and below every release
              that could follow:

                  0.15.0  <  0.15.1-dev.abc  <  0.15.1-rc.1  <  0.15.1  <  0.16.0

              Build metadata (0.15.0+dev.abc) would be wrong: SemVer ignores it in
              precedence, so such a build compares EQUAL to the release it is not.
              `dev` and not `beta` or `rc`, which belong to pre-releases a human cuts on
              purpose; ordering is unaffected, since dev < rc by SemVer's ASCII rule.

              Debian is NOT this string. dpkg reads `-` as the separator before the
              debian-revision, so 0.15.1-dev.abc sorts ABOVE 0.15.1 there; a .deb wants
              `~`. That rendering belongs to whichever job packages one.
              """
              import pathlib as _pathlib, re as _re, subprocess as _subprocess

              def _cut_release():
                  if not _pathlib.Path(version_file).is_file():
                      return False
                  if _subprocess.run(["git", "rev-parse", "--verify", "-q", "HEAD^"],
                                     capture_output=True).returncode != 0:
                      print("HEAD has no parent; treating this as not a release.")
                      return False
                  r = _subprocess.run(["git", "diff", "--name-only", "HEAD^", "HEAD"],
                                      capture_output=True, text=True)
                  if r.returncode != 0:
                      # Never guess True. A false positive mints a version; a false
                      # negative only withholds one, and a withheld release is a pull
                      # request someone reopens.
                      print(f"::warning::could not diff HEAD^..HEAD "
                            f"({r.stderr.strip()}); treating this as not a release.")
                      return False
                  return version_file in r.stdout.split()

              changed = _cut_release()
              if changed or version == "dev":
                  return changed, version
              m = _re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not m:
                  # No next patch to be a pre-release of, so say so and order nothing.
                  print(f"::warning::{version_file} reads {version!r}, which is not "
                        "MAJOR.MINOR.PATCH; stamping it unordered.")
                  return changed, f"{version}-dev.{commit}"
              major, minor, patch = (int(g) for g in m.groups())
              return changed, f"{major}.{minor}.{patch + 1}-dev.{commit}"
          # --- END shared: version stamp ---

          changed, stamp = resolve_version_stamp(
              os.environ["VERSION_FILE"], version, commit)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"version_changed={'true' if changed else 'false'}\n")
              fh.write(f"stamp={stamp}\n")
          print(f"version={version} stamp={stamp} release={changed} commit={commit}")

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          # Org registry for private @aurum-alpha packages; harmless no-op for
          # repos that don't consume the scope (pnpm 10+ only reads auth from
          # the user-level npmrc this writes).
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
          # The default dest is ~/setup-pnpm, shared by every job on a
          # persistent self-hosted host; two installing pnpm at once race and
          # one dies on ENOTEMPTY. runner.temp is per-job — the same fix as
          # "Isolate Go caches to runner.temp" in the Go jobs. Kept identical
          # to setup/node-pnpm, which is this prelude's other copy.
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      # tsc reads tsconfig.build.json for rootDir, outDir and declaration.
      # Nothing here to parameterise, which is what makes this a catalog job.
      - working-directory: ${{ inputs.workdir }}
        run: pnpm exec tsc -b tsconfig.build.json

      # The emit is ESM plus declarations. A tree of only .js is a bundle
      # somebody pointed at this job; a tree of only .d.ts is a types-only
      # emit that cannot be imported. Both have other jobs.
      - name: The emit is JavaScript plus declarations
        working-directory: ${{ inputs.workdir }}/${{ inputs.outdir }}
        run: |
          set -euo pipefail
          # -print -quit, not `find | head`: pipefail treats SIGPIPE from head
          # as a failure the moment the tree has more than one file.
          if [ -z "$(find . -name '*.js' -print -quit)" ] || \
             [ -z "$(find . -name '*.d.ts' -print -quit)" ]; then
            echo "::error::tsc emit at '${{ inputs.outdir }}' must contain" \
                 "both .js and .d.ts; this job builds a TypeScript library," \
                 "not a bundle and not a types-only emit."
            exit 1
          fi

      # Named dist, not client-dist or server-dist: a library has one artifact
      # and job-publish-npm-ghp restores it as `dist=dist`.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ inputs.workdir }}/${{ inputs.outdir }}
          retention-days: 1
          if-no-files-found: error
