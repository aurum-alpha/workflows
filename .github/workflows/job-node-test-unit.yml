# Fleet capability: test-unit (CI_STANDARD Principle 12 — one way per
# capability). Single-job reusable workflow: the caller owns the job id and
# needs: wiring; this file owns the entire job body. Callers pass
# secrets: inherit; vars.RUNNER resolves in the caller's context.
name: job-node-test-unit

on:
  workflow_call:
    inputs:
      workdir:
        description: Directory containing the Node app (package.json, .node-version)
        type: string
        default: "."

jobs:
  test-unit:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    permissions:
      contents: read
      # The job-level permissions block REPLACES the caller's token grant,
      # so packages: read must be explicit or private @aurum-alpha
      # installs 403 (C2 first run).
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          # Org registry for private @aurum-alpha packages; harmless no-op
          # for repos that don't consume the scope (pnpm 10+ only reads
          # auth from the user-level npmrc this writes).
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      - working-directory: ${{ inputs.workdir }}
        # junit output feeds Codecov Test Analytics (flaky-test detection);
        # the default reporter keeps terminal output readable. No `--`
        # before the flags: pnpm 10 forwards args directly and swallows a
        # literal `--` (verified: with it, vitest never sees the flags).
        run: >
          pnpm run test:unit
          --reporter=default --reporter=junit
          --outputFile.junit=test-report.junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ inputs.workdir }}/coverage
          flags: unittests
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        # Runs on test failure too — failed runs are the analytics signal.
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.workdir }}/test-report.junit.xml
