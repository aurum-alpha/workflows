# aurum-job: capability=image-build language=- role=publish
# Portfolio capability: build the container and stage it in the registry
# (CI_STANDARD Principle 12). First of three — build, starts, publish.
#
# job-image-docker did all three in one job: downloaded artifacts, built,
# logged in, started the container, and pushed. That is four claims in one
# check, and when it went red the checks list said "image" and nothing else.
# Worse, the three have different permission needs and different triggers, so
# the single job took the union: packages: write for a step that only runs on
# main, on every pull request in the portfolio.
#
# What this job claims, and only this: the Dockerfile in the repo assembles,
# from artifacts earlier jobs already built. Nothing here runs the image and
# nothing here publishes it.
name: job-image-build

on:
  workflow_call:
    inputs:
      image_name:
        description: >-
          Image name under ghcr.io/<owner>/. Empty means the repository itself.
          A name UNDER the owner: interpolating it bare used to replace the
          whole path, so `image_name: wardley-mapper` built ghcr.io/wardley-
          mapper with no owner and GHCR answered 400 on the blob HEAD.
        type: string
        default: ""
      dockerfile:
        description: >-
          Path to the Dockerfile, relative to the repo root. The image is the
          Dockerfile in the repo, run as-is — every deployable in this portfolio
          copies artifacts that earlier jobs already built, so there is nothing
          for this job to decide beyond which file and which stage.
        type: string
        default: Dockerfile
      context:
        description: Build context, relative to the repo root.
        type: string
        default: "."
      target:
        description: >-
          Dockerfile stage to build. Empty builds the last stage. Repos with a
          multi-stage file that also carries a builder stage must name the
          runtime stage here, or the build silently ships the builder.
        type: string
        default: ""
      platforms:
        description: >-
          Comma-separated build platforms, e.g. `linux/amd64,linux/arm64`.

          ONE call builds them all. buildx produces a single OCI image index
          carrying every platform under one digest, which is what `digest`
          below returns and what job-image-publish promotes — so a `docker
          pull` resolves to the puller's own architecture with no manifest
          assembly on our side. Do not reach for a matrix here: that would
          produce N single-platform images and N digests, and then need a
          further job to stitch back together what buildx already built.

          What a multi-platform build costs depends on what the stage DOES,
          and the difference is large enough to design around:

            - `FROM` and `COPY --from=` are free. Upstream bases (debian,
              alpine, distroless, static tool images) are multi-arch manifest
              lists, so each leg resolves its own platform automatically and
              nothing executes. A runtime stage built this way costs the same
              on two platforms as on one.
            - `RUN` is not free. It executes inside a target-arch container,
              so a foreign architecture needs emulation, and an emulated
              package install runs minutes rather than seconds — per foreign
              leg, per image.

          Emulation IS set up, conditionally, for exactly that case: the QEMU
          step below runs only when `platforms` names more than one, so a
          single-platform caller pays nothing. v1.27.0 documented no-QEMU as a
          rule and required RUN-free runtime stages; v1.28.0 makes it a
          preference with a stated price, because forcing a distroless
          rewrite (and a third-party dependency for anything apt used to
          supply) onto a repo that just wants arm64 was the worse trade.

          Prefer the RUN-free shape where it is natural — it is materially
          faster and it is why the portfolio's distroless images cost nothing on
          arm64. Reach for `RUN` where the alternative is contorting an image
          around the build system.

          The one thing that cannot resolve itself is OUR artifact: `bin/` is
          files on disk, not a manifest list. Declare `ARG TARGETARCH` in the
          stage and copy the per-arch filename job-go-build produces, e.g.
          `COPY bin/cm-linux-${TARGETARCH} /cm`.

          Default is single-platform on purpose. Most callers ship one
          architecture and should not silently start paying for two; the Go
          repos pass both explicitly, so what an image targets is always
          visible at the call site rather than inherited from this line.
        type: string
        default: linux/amd64
      artifacts:
        description: >-
          Newline-separated `artifact-name=destination` pairs, placed before the
          build. Same idiom as start_services' `hostname=image`.

          This is the whole reason the image job exists downstream of the build
          jobs rather than building anything itself: `client-dist=dist/public`
          says the vite bundle this run already produced goes where the
          Dockerfile expects it. BUILD ONCE (Principle 7) — an image that
          rebuilds its own inputs is testing a build that never ships.

          Everything the run produced is downloaded into a staging directory and
          only the names listed here are placed, so buildx's .dockerbuild record
          and any other incidental artifact are ignored rather than landing in
          the context. Naming an artifact the run did not produce is an error,
          not an empty directory.
        type: string
        default: ""
      executables:
        description: >-
          Newline-separated paths to chmod 755 after placement. Artifact
          upload does not preserve the execute bit, so a Go binary arrives
          unrunnable and the image builds fine and dies on exec. Three repos
          carry this line already; it is not optional knowledge.
        type: string
        default: ""
      build_args:
        description: Newline-separated KEY=value build arguments.
        type: string
        default: ""
      stamp:
        description: >-
          The version identity of THIS build, which becomes the image's
          `org.opencontainers.image.version` label. Pass the build job's
          `stamp` output: `1.0.0` on a release commit, `1.0.1-dev.<sha7>`
          between releases, `dev` where the repo has no version file.

          PASS `stamp`, NOT `version`. They are different answers and only one
          of them is about this build. `version` is the RELEASE version — what
          the last release was called, or what a release commit is about to
          call one — so labelling a mid-stream image with it claims every merge
          is 1.0.0. That is the mutable version Principle 14 puts the version
          in a file to avoid, written into the image instead of into a tag,
          and nothing downstream would catch it: a label is not compared
          against anything.

          THIS JOB DOES NOT DERIVE IT, and must not grow a copy of the shared
          version-stamp block to do so. That block has one copy per BUILD
          system and this job is not one — it packages what a build system
          already produced, and a packaging job renders where a build job
          decides.

          Left unset the label reads `dev`. That is the answer, not a gap in
          one: it is what the shared block itself returns for a repo with no
          version file, it matches no version anyone could have cut, and
          `org.opencontainers.image.revision` carries the commit either way.
          A repo whose only provenance is its commit SHA — client-manager says
          so in as many words — is correctly described by it.
        type: string
        default: dev
      runner:
        description: >-
          Override runs-on. Leave empty for the standard default. Set to a
          GitHub-hosted label where a repo must not build on the runner fleet
          (CI_STANDARD Principle 4 — e.g. the runner controller itself, whose
          image jobs would otherwise build the runner image on runners created
          from the previous runner image).
        type: string
        default: ""
    outputs:
      image:
        description: Canonical image name, without tag or digest.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: >-
          Digest of the staged manifest. The handoff to job-image-starts and
          job-image-publish: both address the image by this, so what is started
          and what is promoted are provably the same bytes.
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Held on pull requests too, and deliberately. The image is staged in the
      # registry by digest on every run so the next job pulls exactly what was
      # built rather than a second local copy of it. Dependabot's token is
      # read-only by default but an explicit permissions block raises it, which
      # is this block.
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: name
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGE_NAME" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          else
            image="ghcr.io/${GITHUB_REPOSITORY}"
          fi
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"
          echo "Staging ${image,,}"

      # Exactly the artifacts the mapping names, into a staging directory.
      #
      # This used to fetch EVERYTHING the run produced, on the reasoning that
      # named downloads need one action invocation per artifact. They do not:
      # `pattern` takes a newline-separated list, so one invocation names them
      # all, and the shell below still does the placement.
      #
      # What "everything" cost: docker/build-push-action uploads a buildx
      # build record (`*.dockerbuild`) whenever it runs, so a caller whose
      # builder image rebuilds has an artifact in the run that this job never
      # wanted. Fetching it failed after five retries and took the step with
      # it — AFTER every artifact this job actually needed had downloaded
      # clean. event-manager#62 hit it three times on one commit; the reason
      # no other repo had seen it is that the build record only appears when
      # something in the image job's file_patterns changed, so every caller
      # was one such change away from the same failure.
      #
      # Fetching only what is mapped also makes the failure legible when a
      # caller names an artifact that does not exist: it fails at the fetch,
      # naming the pattern, instead of at the copy several steps later.
      - name: Artifact names the mapping asks for
        id: wanted
        if: ${{ inputs.artifacts != '' }}
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          # ONE glob, not a list of names.
          #
          # `pattern` reads as if it took a newline-separated list, and this
          # step used to emit one. It does not: download-artifact hands the
          # whole input to a single minimatch, so a two-line value is one
          # pattern containing a newline and matches no artifact name at all.
          # Nothing fails at the fetch — a pattern that matches nothing
          # downloads nothing and exits 0 — so the run died several steps later
          # in the placement loop, reporting the staging directory as empty:
          #
          #   ##[error]No artifact named 'client-dist' in this run. Available:
          #
          # Single-artifact callers were unaffected, which is why every caller
          # that had re-pinned so far passed: one name is a valid glob for
          # itself. Seven of the ten image callers map two or more.
          #
          # Brace alternation is the glob that means "any of these", and
          # minimatch expands braces. One name is emitted bare: `{a}` has no
          # comma, so brace expansion leaves it as the literal four characters.
          #
          # Names are checked rather than trusted, against a whitelist. A `,`
          # or a brace would change what the alternation means, and a glob
          # metacharacter would let one mapping entry match an artifact the
          # caller never named — both silent, and both worse than a mapping
          # that refuses to run. Every artifact name in the portfolio is already
          # within this set, so the whitelist costs nothing and does not have
          # to be right about which characters minimatch treats as special.
          names=()
          while IFS= read -r line; do
            # Same two guards as the placement loop below: skip blanks, and
            # skip comment lines, because a `|` block scalar is literal text
            # and a leading # is a value rather than a comment.
            [ -n "$line" ] || continue
            [ "${line#\#}" = "$line" ] || continue
            name="${line%%=*}"
            case "$name" in
              *[!A-Za-z0-9._-]*|'')
                echo "::error::Artifact name '$name' is not matched literally" \
                     "here — names must be [A-Za-z0-9._-]+ so the download" \
                     "glob cannot mean something other than these names."
                exit 1
                ;;
            esac
            names+=("$name")
          done <<< "$ARTIFACTS"

          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::artifacts input has no entries after blanks and" \
                 "comments. Omit the input instead of passing an empty one."
            exit 1
          elif [ "${#names[@]}" -eq 1 ]; then
            pattern="${names[0]}"
          else
            pattern="$(IFS=,; echo "{${names[*]}}")"
          fi
          echo "Downloading artifacts matching: $pattern"
          echo "pattern=${pattern}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.artifacts != '' }}
        with:
          path: .ci-artifacts
          pattern: ${{ steps.wanted.outputs.pattern }}

      - name: Place artifacts
        if: ${{ inputs.artifacts != '' }}
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          EXECUTABLES: ${{ inputs.executables }}
        run: |
          set -euo pipefail
          # `[ "${line#\#}" = "$line" ]` skips comment lines. A `|` block
          # scalar is literal text, so a leading # is a value, not a comment —
          # and annotating a multi-line input is the obvious thing to try. It
          # cost two failed builds before this was here.
          # How many artifacts this caller asked for. Used only by the
          # single-artifact fallback below.
          requested=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            [ "${line#\#}" = "$line" ] || continue
            requested=$((requested + 1))
          done <<< "$ARTIFACTS"

          while IFS= read -r line; do
            [ -n "$line" ] || continue
            [ "${line#\#}" = "$line" ] || continue
            name="${line%%=*}"; dest="${line#*=}"
            if [ -d ".ci-artifacts/$name" ]; then
              src=".ci-artifacts/$name"
            elif [ "$requested" -eq 1 ] \
              && [ -n "$(ls -A .ci-artifacts 2>/dev/null)" ]; then
              # download-artifact announces "An extra directory with the
              # artifact name will be created for each download" and then does
              # not create one when exactly one artifact is downloaded — it
              # extracts the contents straight into `path`.
              #
              # This used to also require that nothing under .ci-artifacts was
              # a directory, on the reasoning that a flat extraction has no
              # per-artifact layout to be confused with. That guard was written
              # when this job downloaded EVERY artifact in the run, where the
              # distinction mattered — and it silently assumed the one artifact
              # contains only files. event-manager's package-artifacts contains
              # static/, vendor/, ci4/, fusebox/ and more, so the guard failed
              # and the job reported the artifact's own contents as the list of
              # artifacts available:
              #
              #   No artifact named 'package-artifacts' in this run. Available:
              #   static codeigniter vendor defaults.ini phinx.php ci4 ...
              #
              # The guard is gone because the reason for it is gone. Since the
              # download is now filtered by a pattern built from the mapping,
              # everything under .ci-artifacts came from the artifacts this
              # caller asked for — there is no other artifact's layout present
              # to mistake this for, whatever shape the contents have.
              #
              # Still narrow: exactly one artifact requested. With two or more,
              # download-artifact does create the per-artifact directories and
              # the branch above finds them.
              src=".ci-artifacts"
              echo "note: single-artifact run — '$name' was extracted flat" \
                   "into .ci-artifacts rather than .ci-artifacts/$name"
            elif [ -z "$(ls -A .ci-artifacts 2>/dev/null)" ]; then
              # Nothing downloaded at all, which is a different fault from a
              # name that does not match: the pattern matched no artifact in
              # the run, and download-artifact reports that as success. Say
              # which fault it is, because "Available:" followed by nothing
              # reads as a listing that failed rather than an empty run.
              echo "::error::No artifacts were downloaded: nothing in this" \
                   "run matched the names this mapping asks for. Check that" \
                   "the jobs producing them ran, and that they upload under" \
                   "exactly the names the mapping uses ('$name' among them)."
              exit 1
            else
              echo "::error::No artifact named '$name' in this run." \
                   "Available: $(find .ci-artifacts -mindepth 1 -maxdepth 1 -printf '%f ' 2>/dev/null)"
              exit 1
            fi
            mkdir -p "$dest"
            cp -a "$src/." "$dest/"
            echo "Placed $name -> $dest"
          done <<< "$ARTIFACTS"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ "${path#\#}" = "$path" ] || continue
            # Artifact upload drops the execute bit. The image then builds
            # cleanly and the container dies on exec, which reads as a broken
            # image rather than a broken artifact.
            chmod 755 "$path"
            echo "Restored execute bit on $path"
          done <<< "$EXECUTABLES"

      # Emulation for foreign-architecture RUN steps, and ONLY when there is a
      # foreign architecture to emulate. Registering binfmt costs a few seconds
      # and buys nothing for a single-platform build, so the seven callers that
      # ship one architecture skip it entirely.
      #
      # It has to precede setup-buildx-action: binfmt is registered on the host
      # and the builder inherits what is already there.
      #
      # A RUN-free runtime stage never reaches this — an upstream multi-arch
      # base plus COPY --from executes nothing, so there is nothing to emulate.
      # That shape stays much faster and stays preferred; this exists so a stage
      # that genuinely needs a package manager is not forced to choose between
      # arm64 and a Dockerfile rewrite.
      - name: Set up QEMU for cross-platform RUN steps
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Unconditional, unlike the old job's main-gated login: staging happens on
      # every run, so the credential is needed on every run.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An empty `stamp` is a wiring mistake, not a caller who did not care:
      # omitting the input gives `dev` from the default, so the only way to
      # reach this step with nothing is to have passed something that
      # evaluated to nothing — `needs.<job>.outputs.stamp` naming a job that
      # exposes no such output, most likely, which GitHub resolves to the
      # empty string and never mentions. Left alone that ships an image
      # labelled `org.opencontainers.image.version=`, which reads as a broken
      # build rather than an unversioned one and is worse than either answer
      # this input can give.
      - name: The version label must say something
        env:
          STAMP: ${{ inputs.stamp }}
        run: |
          set -euo pipefail
          if [ -z "${STAMP//[[:space:]]/}" ]; then
            echo "::error::stamp is empty. Omit the input to label this image" \
                 "'dev'; pass a build job's \`stamp\` output to label it with" \
                 "the version. An empty value is neither, and usually means" \
                 "the expression named an output the build job does not have."
            exit 1
          fi
          echo "org.opencontainers.image.version=${STAMP}"

      # Labels only. Tags are job-image-publish's business, and push-by-digest
      # below refuses a tagged reference outright.
      #
      # `org.opencontainers.image.version` is stated; every other label is
      # metadata-action's default and correct. Left to the default this one is
      # derived from the tag list, and with no `tags` input that list is the
      # action's own default rules — whose entry on a push to main is
      # `type=ref,event=branch`. So every image the portfolio has published
      # carries `org.opencontainers.image.version=main`: a branch name in the
      # field that names a version, on an image job-image-publish tagged
      # `v0.1.0`. The two disagree and neither is checked against the other.
      # `image.revision` was right throughout, which is why nothing noticed
      # until someone read the labels of an image they had just tagged.
      #
      # It cannot be fixed where it was reported, in job-image-publish. Labels
      # live in the image config and are fixed when the image is built;
      # `imagetools create` writes a manifest pointing at bytes that already
      # exist and changes nothing inside them. This run is the only one that
      # can decide this label, which is also why the version has to arrive as
      # an input rather than be worked out here (see `stamp` above).
      #
      # A custom label of the same key wins over the generated one —
      # metadata-action documents the override, and this is that.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          labels: |
            org.opencontainers.image.version=${{ inputs.stamp }}

      # Pushed by digest, with no tag. The staged manifest is addressable and
      # unlisted: the next two jobs pull it by digest, and nothing appears in
      # the package's tag list until publish promotes it on main.
      #
      # The alternative considered was a `ci-<sha>` staging tag, which works and
      # leaves one dead tag per commit per image, forever, with no TTL in GHCR
      # and no way to tell a stale staging tag from a real one by name alone.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build_args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the staged digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "::error::The build produced no digest, so nothing was staged" \
                 "and the jobs downstream have nothing to pull."
            exit 1
          fi
          echo "Staged ${IMAGE}@${DIGEST}"
          {
            echo "### Image staged"
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
