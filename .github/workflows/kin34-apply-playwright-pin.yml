name: kin34-apply-playwright-pin
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kin34-apply-playwright-pin.yml"
      - ".github/kin34-three.patch"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/kin-34-e2e-playwright-job-e350
          fetch-depth: 0
      - name: Restore and patch three files
        run: |
          set -euo pipefail
          git config user.name "j27-aurum"
          git config user.email "216346573+j27-aurum@users.noreply.github.com"
          git show e59a4ae:dependency-versions.json > dependency-versions.json
          git show e59a4ae:standards/010-ci.md > standards/010-ci.md
          git show e59a4ae:tools/check-ci-conformance > tools/check-ci-conformance
          git apply .github/kin34-three.patch
          chmod +x tools/check-ci-conformance
          git add dependency-versions.json standards/010-ci.md tools/check-ci-conformance
          git commit -m "KIN-34: pin @playwright/test and document job-test-e2e-playwright"
          git push origin HEAD:cursor/kin-34-e2e-playwright-job-e350
