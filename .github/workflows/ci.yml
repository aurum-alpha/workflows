name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback: pull_request events from app-authored branches have been
  # observed not to spawn runs in this repo (see PR #2); dispatching against
  # the branch still lands the ci-ok check on the head commit.
  workflow_dispatch:

# Principle 6, which this repo defines and so had better follow: cancel
# superseded pull-request runs, never the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # This repo is the fleet's CI definition, so its gate is workflow
  # correctness: actionlint over every workflow file, including the shared
  # job-*.yml bodies every caller runs. The image tag is pinned for the same
  # reason the fleet pins action SHAs; bump it deliberately, not implicitly.
  lint:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

  # This repo defines the standard, so it is the first thing the standard has
  # to hold against. Run from the working tree, not a pinned release: a rule
  # added in a pull request must gate that same pull request, or the checker
  # and the document can disagree for as long as it takes someone to notice.
  conformance:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-standard-ref diffs this pull request against its base, so the
          # base commit has to be in the clone. A shallow checkout has only the
          # merge commit and the diff fails with "bad object".
          fetch-depth: 0
      - name: Check our own ci.yml against CI_STANDARD
        run: tools/check-ci-conformance --repo-root .

      # #126 renamed a checker and left job-ci-conformance.yml invoking the
      # old path. It stayed invisible because standard_ref lags by design: the
      # callers were still reading a tree where the old name existed, so the
      # break was scheduled for whenever standard_ref next moved. This is the
      # cheapest possible check for that, and it is here rather than in a
      # checker because it is a question about this repo's own wiring.
      - name: Every checker job-ci-conformance invokes exists
        run: |
          set -euo pipefail
          missing=0
          grep -oE '\.aurum-standard/tools/[a-z0-9-]+' \
            .github/workflows/job-ci-conformance.yml | sort -u |
          while read -r ref; do
            path="tools/${ref##*/}"
            if [ ! -x "$path" ]; then
              echo "::error::job-ci-conformance.yml invokes ${ref}, but ${path}" \
                   "does not exist or is not executable. A rename that misses this" \
                   "file breaks every caller the moment standard_ref moves past it."
              missing=1
            fi
            echo "  ok  ${path}"
          done
          exit $missing

      # The catalog's own CI never RUNS the image jobs — they only execute in
      # caller repos — so a bug in one of their shell loops reaches the fleet
      # unexamined. This is the one class of that bug cheap enough to check
      # statically: a newline-separated input read without both guards.
      - name: Check the catalog's input loops
        run: tools/check-catalog-loops

      # Same species as the loop check, and here for the same reason: it
      # inspects this repo's own shared jobs, which never run in this repo's
      # CI, so a divergence between them would otherwise reach the fleet
      # unexamined. Two build systems answering "what version is this build"
      # differently is not a cosmetic drift.
      - name: Check the shared version-stamp block agrees across jobs
        run: tools/check-version-stamp-shared

      # job-ci-conformance selects its checkers by SHA, and that SHA cannot be
      # derived — GitHub gives a called workflow no handle on its own commit,
      # so it is written down, and the writing down is what gets forgotten. It
      # was forgotten three times; the third cost lid-firmware's first
      # conformance run three findings that were all false, because the ref
      # predated both the jobs it called and the allow-list entry it relied on.
      #
      # fetch-depth 0 above so the base commit is present to diff against.
      - name: Check standard_ref moved with the checkers
        run: tools/check-standard-ref --base "${{ github.event.pull_request.base.sha }}"

  # The catalog eats its own cooking, the local path form — same reasoning as
  # the ci-ok action below it. A version rule this repo ships to eleven callers
  # and does not run on itself is a rule nobody has tested.
  #
  # It is also the rule this repo needed most. Five of the twenty merges before
  # this one left .version untouched, and every one of them still reached the
  # release job below, read a version whose tag already existed, and failed —
  # after ci-ok had gone green — for the crime of being a documentation change.
  version-gate:
    uses: ./.github/workflows/job-version-gate.yml
    permissions:
      contents: read
      pull-requests: write

  # Housekeeping, downstream of the rollup — rule D6's declared exemption, the
  # same shape as job-image-prune. Nothing gates on a tag existing; the tag is
  # a human and machine index created after the fact, which is the direction
  # Principle 14 requires: file -> build -> tag, never tag -> build.
  #
  # This exists because the fleet had no way to say "adopt the current
  # catalog". Callers SHA-pin, correctly, but Dependabot cannot compute what is
  # newer than a bare SHA — so nothing ever proposed a re-pin and the fleet
  # drifted onto nine different commits without one instrument noticing. A real
  # tag gives Dependabot something to resolve, and the re-pin PRs then arrive
  # by themselves in every repo whose dependabot.yml already covers
  # github-actions, which is all of them.
  #
  # Created once and never moved, and now only where a release was actually
  # cut. This job used to run its tagging step on EVERY merge to main, which
  # was wrong in both directions at once: a merge that did not touch .version
  # found the tag already sitting on an earlier commit and failed the run —
  # after ci-ok had gone green — and the only thing standing between a merge
  # that did touch it and a silently re-pointed tag was that same collision
  # check. Five of the twenty merges before this one took the first path.
  #
  # So the switch is now what it always should have been: did THIS commit
  # change .version. The collision check stays underneath it as a backstop,
  # not as the mechanism — job-version-gate rejects a backward or repeated
  # version on the pull request, and if one ever reaches main anyway the
  # existing tag wins and the step says so rather than repointing what eleven
  # repos may already have pinned.
  release:
    # always() IS LOAD-BEARING, and its absence silently killed this job.
    #
    # GitHub skips a job when ANY job in its `needs` closure was skipped, and
    # `always()` rescues only the job that carries it. ci-ok carries one, so it
    # survives version-gate skipping on a push; this job did not, so it
    # inherited the skip through ci-ok and never ran. The 2673932 merge is the
    # evidence: lint, conformance and ci-ok all green, release skipped with no
    # steps at all.
    #
    # version-gate skips on EVERY push to main — it is pull_request-only, since
    # only a pull request has a base to compare against — so this was not a
    # one-merge accident. It would have skipped on a release merge too, and the
    # first anyone would have known is a release that produced no tag, which is
    # the failure this whole standard exists to stop: something that did not
    # happen, reported as fine.
    #
    # needs.ci-ok.result is then checked explicitly, because always() also
    # disarms the implicit "only if my dependencies succeeded". Without that
    # clause this job would tag a commit whose CI had failed.
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.ci-ok.result == 'success'
    needs: [ci-ok]
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    permissions:
      # The workflow default is contents: read; tagging needs write, and this
      # is the only job in the repo that has it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are what this job reads to decide whether to act.
          fetch-tags: true
          fetch-depth: 0
      - name: Tag this commit with .version
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # THE RELEASE SWITCH. A version-named emission — this tag, a
          # v<version> image tag, a release, a versioned package — is produced
          # only by a commit that changed the version file. Everything else on
          # main is still built, still gated and still reachable by SHA; it is
          # simply not minted.
          #
          # -F, because `.version` as a regex matches any character where the
          # dot is: a file called `aversion` would satisfy `grep -qx '.version'`
          # and mint a release nobody asked for.
          if ! git diff --name-only HEAD^ HEAD | grep -qxF '.version'; then
            echo "This commit did not change .version; nothing to mint."
            exit 0
          fi

          version="$(tr -d ' \t\r\n' < .version)"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.version reads '$version'; expected MAJOR.MINOR.PATCH"
               exit 1 ;;
          esac
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n1 "${tag}")"
            if [ "${existing}" = "${GITHUB_SHA}" ]; then
              echo "${tag} already points at ${GITHUB_SHA}; nothing to do."
              exit 0
            fi
            echo "::error::${tag} already exists at ${existing} and this commit is" \
                 "${GITHUB_SHA}. Tags are immutable here — callers may already pin" \
                 "${tag}. Bump .version instead of moving it."
            exit 1
          fi
          git tag -a "${tag}" -m "workflows ${tag}" "${GITHUB_SHA}"
          git push origin "${tag}"
          echo "tagged ${tag} at ${GITHUB_SHA}"
          { echo "### Released \`${tag}\`"
            echo
            echo "Dependabot will open re-pin pull requests across the fleet."
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    needs: [lint, conformance, version-gate]
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      # The catalog eats its own cooking: the local path form, so a change to
      # the action is gated by the same run that ships it. Every other repo
      # pins it at a sha like any other action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-ok
        with:
          needs_json: ${{ toJSON(needs) }}
