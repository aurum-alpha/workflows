# Portfolio Node toolchain setup (CI_STANDARD C3): Node from the workdir's
# .node-version, org registry for private @aurum-alpha packages, pnpm from
# packageManager, shared store cache, optional frozen-lockfile install.
#
# Consumers: bespoke caller-side jobs that cannot be capability stubs —
# client-manager's prettier, golden-corpus and go-ts-contract gates today,
# future one-offs after them. Reference as
# aurum-alpha/workflows/setup/node-pnpm@<sha>, at the same commit as every
# other aurum-alpha/workflows pin in that repo (rule LOCK).
#
# The shared job-node-* workflows deliberately keep this prelude inline
# instead of calling the composite: they execute in the caller's checkout, so
# a self-reference would need its own SHA pin and every prelude change would
# take two commits (chicken-and-egg). One definition per audience — but the
# two definitions must stay step-for-step identical, because the moment they
# diverge the portfolio has two answers to one question and the composite is
# worth less than the inline copy it was meant to retire. They had already
# diverged when this file was first consumed: #123 re-pinned all ten inline
# preludes and left this one on pnpm/action-setup v4.3.0 and
# actions/cache v4.3.0, because nothing watched it (see dependabot.yml).
name: node-pnpm
description: Node + pnpm toolchain setup the portfolio way
inputs:
  workdir:
    description: Directory containing package.json and .node-version
    required: false
    default: "."
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # Node before pnpm: a self-hosted runner's bundled externals/node24 npm
    # is sometimes broken, and setup-node puts a real Node and npm on PATH
    # before anything needs one.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.workdir }}/.node-version
        registry-url: https://npm.pkg.github.com
        scope: "@aurum-alpha"
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: ${{ inputs.workdir }}/package.json
        # The default dest is ~/setup-pnpm, which is shared by every job on a
        # persistent self-hosted host; two of them installing pnpm at once
        # race and one dies on ENOTEMPTY. runner.temp is per-job. Same
        # reasoning, same fix as "Isolate Go caches to runner.temp" in the Go
        # jobs, and standalone keeps the install self-contained rather than
        # reaching through whichever npm the host happens to have.
        standalone: true
        dest: ${{ runner.temp }}/setup-pnpm
    - name: Get pnpm store directory
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: pnpm install --frozen-lockfile
