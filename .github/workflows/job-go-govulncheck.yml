# Fleet capability: govulncheck (CI_STANDARD Principle 12 — one way per
# capability). Single-job reusable workflow: the caller owns the job id and
# needs: wiring; this file owns the entire job body.
#
# Lifted out of client-manager, which was the only Go repo running it, behind a
# repo-local tools/checks/govulncheck script. A vulnerability scan is not a
# client-manager concern — the other two Go repos were simply not doing it
# (CI_STANDARD Principle 19: a repo-local job is a gap in the catalog).
name: job-go-govulncheck

on:
  workflow_call:
    inputs:
      workdir:
        description: Directory containing go.mod
        type: string
        default: "."
      runner:
        description: >-
          Override runs-on. Leave empty for the fleet default. Set to a
          GitHub-hosted label where a repo must not build on the fleet
          (CI_STANDARD Principle 4 — e.g. the runner controller itself).
        type: string
        default: ""
      version:
        description: >-
          govulncheck version, pinned. `go run` fetches it against the repo's
          own toolchain, so nothing is installed into the image and the
          scanner tracks the Go version the code actually builds with.
        type: string
        default: "v1.6.0"
      allow:
        description: >-
          Newline-separated GO-YYYY-NNNN advisory ids to accept, each with a
          reason in a comment at the call site. Deliberately an id list and not
          a warn_only flag: warn_only silences the next finding too, and the
          next one might be exploitable here. An allowed id stops blocking;
          anything not on the list still fails the job.
        type: string
        default: ""

jobs:
  govulncheck:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.workdir }}/go.mod
          cache: false
      - name: Isolate Go caches to runner.temp
        shell: bash
        run: |
          set -euo pipefail
          mod="${RUNNER_TEMP}/go-mod"
          build="${RUNNER_TEMP}/go-build"
          mkdir -p "${mod}" "${build}"
          {
            echo "GOMODCACHE=${mod}"
            echo "GOCACHE=${build}"
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ runner.os }}-${{ hashFiles(format('{0}/go.sum', inputs.workdir)) }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-${{ runner.os }}-${{ hashFiles(format('{0}/go.sum', inputs.workdir)) }}
          restore-keys: |
            go-build-${{ runner.os }}-
      # `go run` rather than a preinstalled binary: the scanner has to analyse
      # against the same toolchain the code builds with, and this repo's go.mod
      # is what setup-go just resolved.
      # -format json so the allow-list can key on advisory ids. The text
      # output cannot be filtered without parsing prose, and a scan whose
      # exemptions are a grep over English is not an exemption anyone can audit.
      #
      # Only symbol-level findings count: govulncheck emits a finding per trace,
      # and the ones with a function in trace[0] are the calls it actually
      # reached. Module-level findings mean "you require this, you do not call
      # it", which is not a reason to fail a build.
      - name: govulncheck
        working-directory: ${{ inputs.workdir }}
        env:
          ALLOW: ${{ inputs.allow }}
        run: |
          set -euo pipefail
          go run golang.org/x/vuln/cmd/govulncheck@${{ inputs.version }} \
            -format json ./... > govulncheck.json || true

          python3 - <<'PY'
          import json, os, sys

          allow = {l.strip() for l in os.environ.get("ALLOW", "").splitlines() if l.strip()}
          called, summaries = {}, {}

          # A stream of concatenated JSON objects, not a JSON array.
          dec = json.JSONDecoder()
          raw = open("govulncheck.json").read()
          i = 0
          while i < len(raw):
              while i < len(raw) and raw[i].isspace():
                  i += 1
              if i >= len(raw):
                  break
              obj, i = dec.raw_decode(raw, i)
              if "osv" in obj and isinstance(obj["osv"], dict):
                  o = obj["osv"]
                  summaries[o["id"]] = o.get("summary", "").strip()
              elif "finding" in obj:
                  f = obj["finding"]
                  trace = f.get("trace") or [{}]
                  if trace[0].get("function"):
                      called.setdefault(f["osv"], trace[0])

          blocking = sorted(set(called) - allow)
          for vid in sorted(called):
              where = called[vid]
              at = f"{where.get('module','')}.{where.get('function','')}"
              mark = "allowed" if vid in allow else "BLOCKING"
              print(f"{mark}: {vid} {summaries.get(vid,'')} (reached at {at})")

          for vid in sorted(allow - set(called)):
              print(f"stale: {vid} is allowed but no longer reported — drop it from allow:")

          if blocking:
              print(f"::error::{len(blocking)} vulnerability(ies) reachable and not allowed: "
                    + ", ".join(blocking))
              sys.exit(1)
          print("ok - no reachable vulnerabilities outside the allow list")
          PY
