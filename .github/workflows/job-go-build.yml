# Portfolio capability: build for a Go deployable unit (CI_STANDARD Principle 12 —
# one way per capability). The catalog had job-go-mod, fmt, vet, lint,
# test-unit and govulncheck but no build, so the one job the standard insists
# comes FIRST was the one every Go repo hand-rolled: gofast behind
# scripts/build.sh, gha-runner-controller behind `make build-linux`,
# client-manager behind tools/checks/build. Three wrappers around the same two
# commands, which is the same shape job-go-vet already retired.
#
# It stamps provenance itself rather than calling a repo script or Makefile
# (Principle 13). That is the point of hoisting it: two of the three repos got
# no commit or timestamp into their binaries at all, and the third could only
# get one by keeping its CI coupled to its Makefile.
#
# WHERE it stamps is not configurable. Every Go repo in the portfolio exposes
# `<module>/internal/version` with Version, Build, Commit and BuiltAt, and the
# module path comes from go.mod, so there is nothing for a caller to pass and
# nothing for two repos to disagree about. Which package a Go program keeps its
# build identity in has no operational consequence whatsoever, and a portfolio
# standard that lets it vary is decorating a preference as a decision.
name: job-go-build

on:
  workflow_call:
    inputs:
      workdir:
        description: Directory containing go.mod
        type: string
        default: "."
      binaries:
        description: >-
          JSON array of commands to link. An entry is either a NAME, built from
          ./cmd/<name> — e.g. '["fastgen","fastproxy"]' — or an OBJECT naming
          its own path, '[{"name":"gen-headers","path":"./tools/gen-headers"}]'.

          ./cmd/<name> is the house convention and every deployable follows it
          today, but that is a fact about today and it was hardcoded as though
          it were a property. client-manager already keeps real commands in
          ./tools, so the first repo that needs one built would have had to go
          back to a wrapper script — which is the thing hoisting this job
          exists to end. A convention is worth defaulting to and not worth
          being unable to express an exception to.

          JSON and not a newline list on purpose: a newline input means a shell
          loop over caller data, and that is the bug class that broke
          job-image-starts for every caller. Empty array compiles the packages
          and links nothing, which is the right answer for a repo whose binary
          is built into an image.
        type: string
        default: "[]"
      version_file:
        description: >-
          File holding the SemVer to stamp (Principle 14 — a version is a
          commit, not a tag). A repo with no consumer deciding from the string
          has no version file and none is required: the stamp then says `dev`,
          and commit and builtAt still answer "what is this" exactly.
        type: string
        default: .version
      goos:
        description: >-
          Target OS. Empty builds for the runner's own platform, and is only
          correct for a repo that ships no cross-compiled artifact: the binary
          is then named plainly, with nothing recording what it was built for.
          Set it alongside `goarches` for anything published.
        type: string
        default: ""
      goarches:
        description: >-
          JSON array of target architectures, e.g. '["amd64","arm64"]'. Each
          becomes one leg of this job's matrix, so one call produces every
          architecture the caller ships and the caller stays a single block.

          JSON and not a newline list for the same reason `binaries` is JSON:
          it goes straight into the matrix via fromJSON, so there is no shell
          loop over caller data and no empty-line guard to get wrong.

          Was a singular `goarch` until v1.27.0. One call per architecture
          meant the cross-compiling repo carried two near-identical job blocks
          differing in one field, and the two repos that shipped one
          architecture each reached that by saying nothing rather than by
          deciding.
        type: string
        default: '["amd64"]'
      artifact_name:
        description: >-
          Artifact to upload the linked binaries as. Empty skips the upload.

          This is a PREFIX, not the final name: each matrix leg appends its own
          architecture, so `server-go-bin` uploads `server-go-bin-amd64` and
          `server-go-bin-arm64`. That is not a convenience — actions/upload-artifact
          refuses a duplicate name, so two legs sharing one would fail the
          second, and the catalog owning the suffix is what keeps three repos
          from inventing three naming conventions for the same thing.
        type: string
        default: ""
      needs_artifact:
        description: >-
          Artifact to download before building, for repos that embed generated
          assets the packages will not compile without. Empty to skip.
        type: string
        default: ""
      artifact_path:
        description: Destination path for needs_artifact.
        type: string
        default: ""
      runner:
        description: >-
          Override runs-on. Leave empty for the standard default. Set to a
          GitHub-hosted label where a repo must not build on the portfolio
          (CI_STANDARD Principle 4 — e.g. the runner controller itself).
        type: string
        default: ""
    outputs:
      version:
        description: >-
          The version file's contents, verbatim. The image jobs tag with it and
          a release job cuts a tag from it, so it is read once here rather than
          parsed again by everything downstream. `dev` where the repo has no
          version file.

          This is the RELEASE version — what the last release was called, or
          what this commit is about to call one. It is not necessarily what the
          binary says: see `stamp`.
        value: ${{ jobs.build.outputs.version }}
      version_changed:
        description: >-
          `true` when this commit changed the version file, `false` otherwise.

          THIS IS THE RELEASE SWITCH. A version-named emission — a git tag, a
          v<version> image tag, a GitHub release, a versioned package — is
          produced only where this is true. Everything else on main publishes
          under sha-<short> and latest, which name a commit rather than a
          claim.

          Read it in the caller as
          `needs.<build-job>.outputs.version_changed == 'true'`, alongside the
          main-branch condition. Without it, a v<version> tag is re-applied on
          every merge and silently re-points at new bytes — a mutable version,
          which is the exact thing Principle 14 puts the version in a file to
          avoid.
        value: ${{ jobs.build.outputs.version_changed }}
      stamp:
        description: >-
          What actually went into the binary's Version field. Equals `version`
          on a release commit. Otherwise it is a SemVer PRE-RELEASE of the next
          patch — `0.15.0` in the file becomes `0.15.1-dev.<sha7>` — which
          sorts above the last release and below every release that could come
          next, so a build taken off a mid-stream run is both self-describing
          and correctly ordered against a version nobody has chosen yet.
        value: ${{ jobs.build.outputs.stamp }}

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # One architecture failing to build should not hide whether the others
      # do. Cross-compilation breaks on things that are invisible on the host
      # — a cgo dependency, an unsafe size assumption, a syscall that exists
      # on one arch — and an arch that breaks only on arm64 is exactly what
      # this matrix exists to catch.
      fail-fast: false
      matrix:
        goarch: ${{ fromJSON(inputs.goarches) }}
    outputs:
      # LAST WRITER WINS. A matrixed job exposes one outputs map and every leg
      # overwrites it, so the surviving value is whichever leg finished last.
      # That is harmless for `version` and only for `version`: every leg reads
      # the same version_file, so all legs write the same string and which one
      # lands cannot matter. Nothing per-leg may be added here — a digest or a
      # path would be silently nondeterministic. Per-leg results leave this job
      # as artifacts, which are named per leg and cannot collide.
      version: ${{ steps.stamp.outputs.version }}
      version_changed: ${{ steps.stamp.outputs.version_changed }}
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits, so the stamp step can ask whether THIS commit changed
          # the version file. On a push that is HEAD against its parent; on a
          # pull request actions/checkout gives the merge ref, whose first
          # parent is the base branch tip, so the same diff is the pull
          # request's own changes. One depth answers both.
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.workdir }}/go.mod
          cache: false
      - name: Isolate Go caches to runner.temp
        shell: bash
        run: |
          set -euo pipefail
          mod="${RUNNER_TEMP}/go-mod"
          build="${RUNNER_TEMP}/go-build"
          mkdir -p "${mod}" "${build}"
          {
            echo "GOMODCACHE=${mod}"
            echo "GOCACHE=${build}"
          } >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOMODCACHE }}
          key: go-mod-${{ runner.os }}-${{ hashFiles(format('{0}/go.sum', inputs.workdir)) }}
          restore-keys: |
            go-mod-${{ runner.os }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          # Scoped by target arch: the compiled objects in GOCACHE are for the
          # architecture they were built for, so an arm64 leg restoring an
          # amd64 leg's cache gets nothing it can use and evicts what it could.
          key: go-build-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles(format('{0}/go.sum', inputs.workdir)) }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ matrix.goarch }}-
      - name: Download embedded assets
        if: inputs.needs_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.needs_artifact }}
          path: ${{ inputs.artifact_path }}

      # ONE `go build` per binary per architecture, and nothing else. There
      # used to be a `go build ./...` above this, named "Compile all packages",
      # which made the pair read as a compile step and a link step. It never
      # was: `go build -o <out> ./cmd/<name>` compiles AND links in one
      # command, and that command is this step.
      #
      # What the extra build actually did was compile every package in the
      # module, including ones no binary imports. That is not what this job is
      # for. The job's promise is that every production artifact compiles, and
      # each artifact's own build proves exactly that for the dependencies it
      # actually has — a package only fastproxy imports fails fastproxy's
      # build, which is where anyone would look for it. Nothing was gained by
      # also failing fastgen's.
      #
      # It was not free either. It ran with no GOOS/GOARCH/CGO_ENABLED and no
      # -trimpath, so on a cross-compiling leg it built for the RUNNER's
      # platform — re-checking amd64 on the arm64 leg, identical to what the
      # amd64 leg had already done — and every one of those four mismatches
      # meant its compiled objects could not be reused by the build below.
      # Measured on gofast: 29s of whole-module compile that left the real
      # build still taking its full 23s.
      #
      # python3, not bash: the binaries list is JSON and the ldflags are
      # assembled from four inputs. A shell loop over caller-supplied data is
      # the bug class check-catalog-loops exists to catch, so there isn't one.
      - name: Build binaries and stamp provenance
        id: stamp
        shell: python3 {0}
        working-directory: ${{ inputs.workdir }}
        env:
          BINARIES: ${{ inputs.binaries }}
          VERSION_FILE: ${{ inputs.version_file }}
          GOOS_IN: ${{ inputs.goos }}
          GOARCH_IN: ${{ matrix.goarch }}
        run: |
          import json, os, pathlib, re, subprocess, sys
          from datetime import datetime, timezone

          # An entry is a bare name or an object carrying its own path. Both
          # normalise to (name, path) here so nothing downstream has to care,
          # and anything else is rejected by name rather than failing later as
          # a confusing `go build` error about a directory nobody typed.
          def normalise(entry):
              if isinstance(entry, str):
                  return entry, f"./cmd/{entry}"
              if isinstance(entry, dict):
                  extra = set(entry) - {"name", "path"}
                  if extra:
                      sys.exit(f"binaries entry {entry!r} has unknown "
                               f"key(s): {', '.join(sorted(extra))}")
                  name = entry.get("name")
                  if not name:
                      sys.exit(f"binaries entry {entry!r} has no name")
                  return name, entry.get("path") or f"./cmd/{name}"
              sys.exit(f"binaries entry {entry!r} is neither a name nor an "
                       "object with name and path")

          entries = [normalise(e) for e in json.loads(os.environ["BINARIES"] or "[]")]
          names = [n for n, _ in entries]
          goos, goarch = os.environ["GOOS_IN"].strip(), os.environ["GOARCH_IN"].strip()

          # The stamp target is derived, never passed: go.mod names the module,
          # and the Aurum Alpha standard puts build identity in internal/version.
          module = None
          for line in pathlib.Path("go.mod").read_text().splitlines():
              m = re.match(r"\s*module\s+(\S+)", line)
              if m:
                  module = m.group(1)
                  break
          if not module:
              sys.exit("go.mod has no module line")
          pkg = f"{module}/internal/version"

          # `go build -X` on a symbol that does not exist is SILENTLY IGNORED —
          # no error, no warning, and a binary that reports nothing. A stamp
          # that cannot fail is a stamp nobody can trust, so the package has to
          # be there and this says so plainly when it is not.
          STAMPED = ("Version", "Build", "Commit", "BuiltAt")
          pkgdir = pathlib.Path("internal/version")
          if names:
              if not pkgdir.is_dir():
                  sys.exit(
                      "internal/version/ not found. Every Go repo in the portfolio "
                      "stamps build identity there (CI_STANDARD Principle 13); "
                      "the linker ignores -X for a package that does not exist, "
                      "so this fails loudly rather than shipping an unstamped "
                      "binary.")
              # Same silent failure one level down: -X names a SYMBOL, and a
              # missing var is ignored exactly as quietly as a missing package.
              # gofast had Build, Commit and BuiltAt but no Version, so three
              # stamps would have landed and the fourth would have vanished.
              src = "\n".join(f.read_text() for f in pkgdir.glob("*.go"))
              missing = [v for v in STAMPED
                         if not re.search(rf"^\s*{v}\s*(=|\bstring\b)", src, re.M)]
              if missing:
                  sys.exit(
                      f"internal/version declares no {', '.join(missing)} — "
                      "-X would be silently ignored for each. The portfolio stamps "
                      f"{', '.join(STAMPED)}; add the missing var(s) as a "
                      "package-level string.")

          vf = pathlib.Path(os.environ["VERSION_FILE"])
          # No version file is a valid answer, not an error: Principle 16 says a
          # repo with nothing deciding from the string has no version at all.
          # Build, Commit and BuiltAt still say what this binary is.
          version = vf.read_text().strip() if vf.is_file() else "dev"
          build = os.environ.get("GITHUB_RUN_NUMBER", "local")
          commit = subprocess.run(["git", "rev-parse", "--short=7", "HEAD"],
                                  capture_output=True, text=True).stdout.strip() or "unknown"
          built = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          # --- BEGIN shared: version stamp. KEEP EVERY COPY IDENTICAL.
          # tools/check-version-stamp-shared compares this region across every catalog
          # job that carries it and fails if they diverge, so editing one copy without
          # the others turns this repo red rather than letting two build systems drift
          # into two versioning semantics.
          #
          # It is duplicated rather than extracted because a reusable workflow runs in
          # the CALLER's checkout: it cannot reference a catalog composite without its
          # own SHA pin, which makes every change a two-commit dance. setup/node-pnpm's
          # header records the portfolio making the same trade for the same reason. The
          # checker is what makes the duplicate safe.
          def resolve_version_stamp(version_file, version, commit):
              """Did THIS commit cut a release, and what should the build stamp?

              Returns (changed, stamp). One answer, so nothing downstream re-derives it.

              A release is a commit that changed the version file. fetch-depth: 2 makes
              HEAD^ available; it resolves on a push (the previous commit) and on a pull
              request (the base branch tip, because the merge ref's first parent is the
              base). A root commit has no parent and is not a release: a repository's
              first commit is not a release event.

              Anything else is a PRE-RELEASE of the next PATCH, which is a floor rather
              than a guess. Whatever the next release turns out to be it is at least
              0.15.1, so the stamp sorts above the last release and below every release
              that could follow:

                  0.15.0  <  0.15.1-dev.abc  <  0.15.1-rc.1  <  0.15.1  <  0.16.0

              Build metadata (0.15.0+dev.abc) would be wrong: SemVer ignores it in
              precedence, so such a build compares EQUAL to the release it is not.
              `dev` and not `beta` or `rc`, which belong to pre-releases a human cuts on
              purpose; ordering is unaffected, since dev < rc by SemVer's ASCII rule.

              Debian is NOT this string. dpkg reads `-` as the separator before the
              debian-revision, so 0.15.1-dev.abc sorts ABOVE 0.15.1 there; a .deb wants
              `~`. That rendering belongs to whichever job packages one.
              """
              import pathlib as _pathlib, re as _re, subprocess as _subprocess

              def _cut_release():
                  if not _pathlib.Path(version_file).is_file():
                      return False
                  if _subprocess.run(["git", "rev-parse", "--verify", "-q", "HEAD^"],
                                     capture_output=True).returncode != 0:
                      print("HEAD has no parent; treating this as not a release.")
                      return False
                  r = _subprocess.run(["git", "diff", "--name-only", "HEAD^", "HEAD"],
                                      capture_output=True, text=True)
                  if r.returncode != 0:
                      # Never guess True. A false positive mints a version; a false
                      # negative only withholds one, and a withheld release is a pull
                      # request someone reopens.
                      print(f"::warning::could not diff HEAD^..HEAD "
                            f"({r.stderr.strip()}); treating this as not a release.")
                      return False
                  return version_file in r.stdout.split()

              changed = _cut_release()
              if changed or version == "dev":
                  return changed, version
              m = _re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not m:
                  # No next patch to be a pre-release of, so say so and order nothing.
                  print(f"::warning::{version_file} reads {version!r}, which is not "
                        "MAJOR.MINOR.PATCH; stamping it unordered.")
                  return changed, f"{version}-dev.{commit}"
              major, minor, patch = (int(g) for g in m.groups())
              return changed, f"{major}.{minor}.{patch + 1}-dev.{commit}"
          # --- END shared: version stamp ---

          changed, stamp = resolve_version_stamp(
              os.environ["VERSION_FILE"], version, commit)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"version_changed={'true' if changed else 'false'}\n")
              fh.write(f"stamp={stamp}\n")
          print(f"version={version} stamp={stamp} release={changed} "
                f"build={build} commit={commit} builtAt={built}")

          ldflags = ["-s", "-w"] + [
              f"-X {pkg}.{var}={val}"
              for var, val in (("Version", stamp), ("Build", build),
                               ("Commit", commit), ("BuiltAt", built))
          ]

          if not names:
              print("No binaries requested; compile-only.")
              sys.exit(0)

          env = dict(os.environ, CGO_ENABLED="0")
          if goos:
              env["GOOS"] = goos
          if goarch:
              env["GOARCH"] = goarch

          # A named target needs BOTH halves, and the old logic let either
          # stand alone with results nobody wanted. goarch without goos gave
          # the literal string `native` in a shipped filename
          # (bin/cm-native-arm64); goos without goarch gave a trailing hyphen
          # (bin/cm-linux-) on a binary that was silently built for whatever
          # the runner happened to be. Both are the same defect this repo
          # keeps finding — something that did not happen, reported as fine —
          # so they fail here instead of shipping.
          if bool(goos) != bool(goarch):
              have, missing = ("goos", "goarches") if goos else ("goarches", "goos")
              sys.exit(
                  f"{have} is set but {missing} is not. A cross-compiled "
                  "binary is named <name>-<goos>-<goarch>, so half a target "
                  "produces either the literal 'native' or a trailing hyphen "
                  "in the filename, over a binary built for the runner's own "
                  "platform. Set both, or neither.")
          suffix = f"-{goos}-{goarch}" if goos else ""

          os.makedirs("bin", exist_ok=True)
          for name, path in entries:
              out = f"bin/{name}{suffix}"
              print(f"linking {out} from {path}")
              subprocess.run(
                  ["go", "build", "-trimpath", "-ldflags", " ".join(ldflags),
                   "-o", out, path],
                  check=True, env=env)
              os.chmod(out, 0o755)

      # The arch suffix is the catalog's, not the caller's. upload-artifact
      # refuses a duplicate name, so without it two matrix legs would race and
      # the second would fail; with it, one `artifact_name: server-go-bin`
      # yields server-go-bin-amd64 and server-go-bin-arm64 and every repo in
      # the portfolio names the same thing the same way.
      - name: Upload binaries
        if: inputs.artifact_name != '' && inputs.binaries != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.goarch }}
          path: ${{ inputs.workdir }}/bin/
          if-no-files-found: error
          retention-days: 1
