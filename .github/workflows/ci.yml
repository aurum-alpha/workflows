name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback: pull_request events from app-authored branches have been
  # observed not to spawn runs in this repo (see PR #2); dispatching against
  # the branch still lands the ci-ok check on the head commit.
  workflow_dispatch:

# Principle 6, which this repo defines and so had better follow: cancel
# superseded pull-request runs, never the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: >
          docker run --rm -v "$PWD:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color

  conformance:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      # Shallow again. The full history was here for check-standard-ref, which
      # diffed the pull request against its base; that checker is gone with
      # standard_ref, and every step left in this job reads files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check our own ci.yml against CI_STANDARD
        run: tools/check-ci-conformance --repo-root .

      # Charter D10, the writing convention. Warn-only until the documents
      # written before it are under the threshold; the ledger row moves to
      # gated in its own change, and this flag goes with it.
      - name: Measure the documents against the writing convention
        run: tools/check-doc-style --warn-only --summary

      # #126 renamed a checker and left job-ci-conformance.yml invoking the
      # old path, and nothing noticed until a caller hit exit 127. This is the
      # cheapest possible check for that, and it lives here rather than in a
      # checker because it is a question about this repo's own wiring.
      #
      # ONE TREE now. It used to need two: a caller took job-ci-conformance.yml
      # from the tag it pinned and the checkers from a separate clone at
      # standard_ref, so "the checker exists" had to be true in both, and the
      # standard_ref half was the half that reached the portfolio. v2.2.10
      # invoked check-exact-pins and v2.2.11 invoked check-overrides while
      # neither existed at the standard_ref those releases carried -- added and
      # wired in one pull request, with standard_ref at that pull request's
      # base, which predates the file. Nothing went red because no repository
      # had re-pinned yet; the first one to try would have got exit 127.
      #
      # With callers on @main the workflow and its checkers come from the same
      # commit, so a checker added and wired together is coherent by
      # construction and this step is back to what it looks like: does the file
      # this repo ships invoke anything this repo does not have.
      - name: Every checker job-ci-conformance invokes exists
        run: |
          set -euo pipefail
          missing=0
          # A pipe would run this loop in a subshell and throw the flag away,
          # which is how this gate spent its life unable to fail.
          while read -r invoked; do
            name="${invoked##*/}"
            if [ ! -x "tools/$name" ]; then
              echo "::error::job-ci-conformance.yml invokes ${invoked}, but" \
                   "tools/${name} does not exist or is not executable."
              missing=1
            else
              echo "  ok  tools/${name}"
            fi
          done < <(grep -oE '\.aurum-catalog/tools/[a-z0-9-]+' \
                     .github/workflows/job-ci-conformance.yml | sort -u)
          exit $missing

      # The catalog's own CI never RUNS the image jobs — they only execute in
      # caller repos — so a bug in one of their shell loops reaches the portfolio
      # unexamined. This is the one class of that bug cheap enough to check
      # statically: a newline-separated input read without both guards.
      - name: Check the catalog's input loops
        run: tools/check-catalog-loops

      # Same species as the loop check, and here for the same reason: it
      # inspects this repo's own shared jobs, which never run in this repo's
      # CI, so a divergence between them would otherwise reach the portfolio
      # unexamined. Two build systems answering "what version is this build"
      # differently is not a cosmetic drift.
      - name: Check the shared version-stamp block agrees across jobs
        run: tools/check-version-stamp-shared

  version-gate:
    uses: ./.github/workflows/job-version-gate.yml
    permissions:
      contents: read
      pull-requests: write

  version-read:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      version_changed: ${{ steps.stamp.outputs.version_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # HEAD^ is what the release decision reads. Two commits is all of it.
          fetch-depth: 2
      - id: stamp
        shell: python3 {0}
        env:
          VERSION_FILE: .version
        run: |
          import os, pathlib, subprocess

          vf = pathlib.Path(os.environ["VERSION_FILE"])
          # No version file is a valid answer, not an error: Principle 16 says a
          # repo with nothing deciding from the string has no version at all.
          version = vf.read_text().strip() if vf.is_file() else "dev"
          commit = subprocess.run(["git", "rev-parse", "--short=7", "HEAD"],
                                  capture_output=True, text=True).stdout.strip() or "unknown"

          # --- BEGIN shared: version stamp. KEEP EVERY COPY IDENTICAL.
          # tools/check-version-stamp-shared compares this region across every workflow
          # job that carries it and fails if they diverge, so editing one copy without
          # the others turns this repo red rather than letting two build systems drift
          # into two versioning semantics.
          #
          # It is duplicated rather than extracted because a reusable workflow runs in the
          # CALLER's checkout and cannot reach a catalog composite except by naming the
          # catalog repository. That used to mean a SHA pin, and so a two-commit dance
          # for every edit; since the portfolio moved to @main it does not, and the
          # reason for the duplicate has expired without the duplicate going with it.
          # Extracting it is worth its own change. The checker is what makes it safe
          # meanwhile.
          def resolve_version_stamp(version_file, version, commit):
              """Did THIS commit cut a release, and what should the build stamp?

              Returns (changed, stamp). One answer, so nothing downstream re-derives it.

              A release is a commit that changed the version file. fetch-depth: 2 makes
              HEAD^ available; it resolves on a push (the previous commit) and on a pull
              request (the base branch tip, because the merge ref's first parent is the
              base). A root commit has no parent and is not a release: a repository's
              first commit is not a release event.

              Anything else is a PRE-RELEASE of the next PATCH, which is a floor rather
              than a guess. Whatever the next release turns out to be it is at least
              0.15.1, so the stamp sorts above the last release and below every release
              that could follow:

                  0.15.0  <  0.15.1-dev.abc  <  0.15.1-rc.1  <  0.15.1  <  0.16.0

              Build metadata (0.15.0+dev.abc) would be wrong: SemVer ignores it in
              precedence, so such a build compares EQUAL to the release it is not.
              `dev` and not `beta` or `rc`, which belong to pre-releases a human cuts on
              purpose; ordering is unaffected, since dev < rc by SemVer's ASCII rule.

              Debian is NOT this string. dpkg reads `-` as the separator before the
              debian-revision, so 0.15.1-dev.abc sorts ABOVE 0.15.1 there; a .deb wants
              `~`. That rendering belongs to whichever job packages one.
              """
              import pathlib as _pathlib, re as _re, subprocess as _subprocess

              def _cut_release():
                  if not _pathlib.Path(version_file).is_file():
                      return False
                  if _subprocess.run(["git", "rev-parse", "--verify", "-q", "HEAD^"],
                                     capture_output=True).returncode != 0:
                      print("HEAD has no parent; treating this as not a release.")
                      return False
                  r = _subprocess.run(["git", "diff", "--name-only", "HEAD^", "HEAD"],
                                      capture_output=True, text=True)
                  if r.returncode != 0:
                      # Never guess True. A false positive mints a version; a false
                      # negative only withholds one, and a withheld release is a pull
                      # request someone reopens.
                      print(f"::warning::could not diff HEAD^..HEAD "
                            f"({r.stderr.strip()}); treating this as not a release.")
                      return False
                  return version_file in r.stdout.split()

              changed = _cut_release()
              if changed or version == "dev":
                  return changed, version
              m = _re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not m:
                  # No next patch to be a pre-release of, so say so and order nothing.
                  print(f"::warning::{version_file} reads {version!r}, which is not "
                        "MAJOR.MINOR.PATCH; stamping it unordered.")
                  return changed, f"{version}-dev.{commit}"
              major, minor, patch = (int(g) for g in m.groups())
              return changed, f"{major}.{minor}.{patch + 1}-dev.{commit}"
          # --- END shared: version stamp ---

          changed, stamp = resolve_version_stamp(
              os.environ["VERSION_FILE"], version, commit)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"version_changed={'true' if changed else 'false'}\n")
          print(f"version={version} release={changed} stamp={stamp}")

  version-release:
    needs: [ci-ok, version-read]
    if: >-
      always()
      && needs.ci-ok.result == 'success'
    uses: ./.github/workflows/job-version-release.yml
    with:
      version: ${{ needs.version-read.outputs.version }}
      version_changed: ${{ needs.version-read.outputs.version_changed }}
    permissions:
      # The workflow default is contents: read; tagging and releasing need
      # write, and this is the only job in the repo that has it.
      contents: write

  ci-ok:
    # version-read is in here rather than downstream because it is not
    # housekeeping — it is the input housekeeping reads. A version-read that
    # failed while the rollup went green would hand `release` an empty
    # `version_changed`, and the release that did not happen would be
    # reported as fine (rule D6).
    needs: [lint, conformance, version-gate, version-read]
    if: always()
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      # The catalog eats its own cooking: the local path form, so a change to
      # the action is gated by the same run that ships it. Every other repo
      # pins it at a sha like any other action.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-ok
        with:
          needs_json: ${{ toJSON(needs) }}
