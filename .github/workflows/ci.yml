name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback: pull_request events from app-authored branches have been
  # observed not to spawn runs in this repo (see PR #2); dispatching against
  # the branch still lands the ci-ok check on the head commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Docs-only repo today, so there are no gates yet. The rollup exists so the
  # fleet-wide required check (ci-ok) can be enforced here like everywhere
  # else; real gates (actionlint over the shared workflows) arrive with
  # Phase C extraction.
  ci-ok:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    steps:
      - name: OK
        run: exit 0
