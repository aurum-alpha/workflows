# Portfolio capability: find declared-but-unused dependencies for one
# deployable unit's JS/TS project.
#
# Nothing in the portfolio detected this class of defect before. Every instance
# found so far -- lodash, eslint-plugin-import, eslint-plugin-react,
# @tailwindcss/vite, and an entire unused session and auth stack across three
# repos -- was found by hand, during a survey looking for something else. That
# is not a detection method; it is luck, and it has already failed once: an
# issue was filed proposing that `@types/ws` be CONVERGED across the fleet
# before anyone checked that `ws` itself is imported nowhere in any of the five
# repos declaring it (workflows#287, withdrawn).
#
# The cost is not abstract. All of it sat in `dependencies` rather than
# `devDependencies`, so the production images shipped an authentication stack
# for code that never called it.
#
# knip rather than depcheck: it understands vite/vitest config and dynamic
# imports, which this portfolio needs because the Replit plugins are reached
# through conditional dynamic imports in the dev-only branch of vite.config.ts.
# Trialled against credit-watch before being proposed, where it reproduced the
# entire hand-built finding with no configuration, and added the `ws` pair the
# hand survey had missed.
#
# THERE IS NO `--production` LANE, and there was going to be one. The plan was
# to block on unused `dependencies` alone -- a runtime package nothing reaches
# ships in the image for nothing, which is a defect rather than debt -- and run
# the fuller check warn-only. `knip --production` is how that would be
# expressed, since `devDependencies` is not one of knip's issue types and the
# obvious `--exclude devDependencies` silently excludes a type that does not
# exist.
#
# Measured against wardley-mapper, production mode reports `express` as an
# unused dependency of an express server. It is imported by server/index.ts,
# and in the same run knip does NOT report server/index.ts as an unused file --
# so the entry point is reachable and the dependency is still flagged. Default
# mode gets it right. The gap is not small either: 54 findings in production
# mode against 40 in default, on a tree where the difference is false.
#
# A gate whose findings cannot be trusted is worse than no gate, because
# someone will eventually delete a package it named. So the accurate lane is
# the only lane, and the two-lane design is abandoned rather than shipped
# looking rigorous. Verified across all nine Node units: no ERROR anywhere, and
# `express` flagged nowhere.
name: job-depcheck-js-knip

on:
  workflow_call:
    inputs:
      workdir:
        description: >-
          Directory holding package.json and .node-version, relative to the
          repo root. Defaults to `.`, the repo root, for a repo whose JS
          project *is* the repo; `client` is the other common shape. Same
          contract, same validation, as job-lint-js-oxlint's input of the same
          name — the catalog standardises the toolchain, not the tree.
        type: string
        default: "."
      warn_only:
        description: >-
          Report findings without failing the job — a documented stabilization
          window (CI_STANDARD Principle 3), not a permanent mode. Same contract
          as job-lint-js-oxlint's and job-go-lint's inputs of the same name.

          This covers FINDINGS only. A knip that could not complete its
          analysis still fails the job, hard, in every mode. See the two steps
          at the bottom for why that separation is the point.
        type: boolean
        default: false
      entry:
        description: >-
          knip `entry` patterns for this unit, one per line or comma-separated,
          relative to the workdir. REPLACES the portfolio default rather than
          adding to it — unlike `ignore_dependencies`, which adds. The two
          differ on purpose: an ignore list is cumulative because every entry
          on it names a real cause that still applies, while an entry list
          describes ONE tree's shape and a pattern from a different shape is
          not a harmless extra. knip reports each non-matching pattern as a
          "Refine entry pattern (no matches)" hint, so carrying the defaults
          into a repo they do not fit buys nothing and prints noise.

          The default suits the eight units on the Replit-derived layout and
          the two client-only ones. Set it where the tree differs, and say at
          the call site what the entries are.

          WHY THIS IS AN INPUT AT ALL: the value was hardcoded, and on
          event-manager it produced a WRONG ANSWER WITH NO ERROR. That repo
          builds four React apps whose vite.config.ts declares its inputs as
          `path.resolve(reactRoot, 'org-admin.html')` — computed paths knip's
          vite plugin cannot fully resolve statically. None of the three
          hardcoded patterns matched either, so knip fell back to the partial
          set the plugin did resolve, pruned the org-admin app as unreachable,
          and reported `react-hook-form` and `@mui/x-date-pickers` as unused.
          Both are imported by that app. 20 findings against the 17 the correct
          entries give.

          That is the same failure this job has now hit three times — a config
          that resolves to less than intended, producing a plausible list
          nothing flags as suspect. It is survivable while every caller is
          `warn_only`; it is a package deletion once one is not.
        type: string
        default: "server/index.ts, client/src/main.tsx, src/main.tsx"
      ignore_dependencies:
        description: >-
          Extra package names for knip's `ignoreDependencies`, one per line or
          comma-separated, ADDED to the portfolio baseline below rather than
          replacing it. For a package this job cannot see is used and which the
          repo genuinely needs — with a comment at the call site saying why.
        type: string
        default: ""

jobs:
  depcheck:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same validation, same wording, as job-lint-js-oxlint. It runs after
      # checkout because the package.json half needs a tree, and it names the
      # path so a typo fails here rather than six steps later inside pnpm.
      - name: Validate workdir
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          case "$WD" in
            "") echo "::error::workdir is empty; use '.' for the repo root."
                exit 1 ;;
            /*) echo "::error::workdir must be relative to the repo root;" \
                     "got '$WD'."; exit 1 ;;
            ..|../*|*/../*|*/..)
                echo "::error::workdir must not escape the repo root;" \
                     "got '$WD'."; exit 1 ;;
          esac
          if [ ! -f "$WD/package.json" ]; then
            echo "::error::no package.json at workdir '$WD'." \
                 "The workdir names the directory holding package.json and" \
                 ".node-version, relative to the repo root."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
          # Per-job dest: the default ~/setup-pnpm is shared by every job on a
          # persistent self-hosted host, and two installing at once race and
          # one dies on ENOTEMPTY. Identical to every other Node job's prelude.
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      # The config is GENERATED here rather than committed to each repo, and
      # that is Principle 1 applied to the one input nobody thinks of as an
      # input. knip has no CLI flag for `ignoreDependencies` -- confirmed
      # against `knip --help`, it is a config-file setting only -- so the
      # alternative was a knip.json in all eleven repos. Eleven copies of one
      # baseline is precisely the failure AGENTS.md is written to prevent:
      # nothing announces that a second copy exists, and nothing fails when
      # they disagree. One generated file, one place to change it.
      #
      # Two entries, each earning its place:
      #
      # `oxlint` and `oxlint-tsgolint` are reported unused and are not. They
      # are invoked by job-lint-js-oxlint, which lives in THIS repository, so
      # nothing inside the package tells knip they are used. That is a
      # structural consequence of the catalog design rather than a knip bug,
      # and it applies to every tool the shared jobs run without a matching
      # package.json script -- so the list belongs here, next to the jobs that
      # cause it, and not in eleven repos that cannot see the cause.
      #
      # `drizzle: false` disables knip's drizzle plugin, which tries to LOAD
      # drizzle.config.ts and dies without a live DATABASE_URL that no
      # lint-shaped job has:
      #
      #   ERROR: Error loading drizzle.config.ts (DATABASE_URL, ensure the
      #   database is provisioned)
      #
      # Disabling it costs nothing measurable: drizzle-kit is still detected as
      # used, because knip reads the `db:push` package.json script that invokes
      # it. Verified against credit-watch -- with the plugin off, no drizzle
      # package is reported unused. Note that knip's `ignore` does NOT fix this;
      # plugin configs are loaded before `ignore` is applied, so the error
      # survives it. The plugin switch is the only thing that works.
      # THE CONFIG MUST LIVE INSIDE THE WORKDIR, and that is not a tidiness
      # preference. knip resolves the relative paths inside a config against
      # the CONFIG FILE's directory, not the project's. Generated into
      # runner.temp, every `entry` path below resolved to a file that does not
      # exist, knip silently found no entry points, pruned the entire server
      # tree as unreachable, and reported `express` as an unused dependency of
      # an express server. No error, no warning -- just a plausible, wrong
      # answer. Caught by noticing that `express` was on wardley-mapper's list.
      - name: Generate knip config
        env:
          EXTRA: ${{ inputs.ignore_dependencies }}
          ENTRY: ${{ inputs.entry }}
          CONFIG: ${{ inputs.workdir }}/.knip.generated.json
        run: |
          set -euo pipefail
          # Both lists are built by the same loop, and the trailing newline
          # in `printf '%s\n'` is load-bearing in both: `while read` drops a
          # final line that has none, so `printf '%s'` here silently discarded
          # the LAST entry of every list -- a one-item list produced no entries
          # at all. Caught by testing the generator against a one-item and a
          # multi-item value; both were wrong.
          #
          # `entry` REPLACES the default (see the input's description) while
          # the ignore list ADDS to the baseline, which is why one loop starts
          # from an empty array and the other from two seeded names.
          emit_list() {
            local first=1 item
            printf '%s\n' "$1" | tr ',' '\n' | while IFS= read -r item; do
              item="$(printf '%s' "$item" | tr -d '[:space:]')"
              [ -n "$item" ] || continue
              if [ "$first" -eq 1 ]; then first=0; else printf ', '; fi
              printf '"%s"' "$item"
            done
          }
          {
            printf '{\n'
            printf '  "drizzle": false,\n'
            printf '  "entry": ['
            emit_list "$ENTRY"
            printf '],\n'
            printf '  "ignoreDependencies": ["oxlint", "oxlint-tsgolint"'
            printf '%s\n' "$EXTRA" | tr ',' '\n' | while IFS= read -r pkg; do
              pkg="$(printf '%s' "$pkg" | tr -d '[:space:]')"
              [ -n "$pkg" ] || continue
              printf ', "%s"' "$pkg"
            done
            printf ']\n}\n'
          } > "$CONFIG"
          echo "Generated knip config:"
          cat "$CONFIG"

          # An empty entry list is the failure this input exists to prevent,
          # arriving through the input itself: knip with no entry points prunes
          # the whole tree as unreachable and reports every dependency unused,
          # with no error. That reads as a catastrophic finding rather than as
          # a broken config, and under warn_only it reads as nothing at all.
          # Fail here, where the cause is one line up.
          if grep -q '"entry": \[\]' "$CONFIG"; then
            echo "::error::the 'entry' input resolved to no patterns." \
                 "knip with no entry points reports every dependency unused." \
                 "Give at least one pattern, relative to the workdir."
            exit 1
          fi

      # knip is run through `pnpm dlx` at a pinned version rather than declared
      # as a devDependency in each repo, and the pin is here for the same
      # reason the config is: one source of truth. It also avoids a genuinely
      # circular problem -- knip added to a repo's devDependencies is a binary
      # invoked from a workflow with no matching package.json script, which is
      # exactly the shape this job reports as unused. It would flag itself.
      #
      # The run is split across THREE steps on purpose, because there are two
      # different ways this can fail and only one of them is debt.
      #
      # knip's exit code tracks FINDINGS ONLY. An error does not affect it:
      # confirmed directly against credit-watch, where a config it could not
      # load printed two ERROR lines and the process still exited 0. So a job
      # that runs knip and trusts `$?` reports success having analysed nothing
      # -- a gate that can be silently skipped, which is the one failure mode
      # this repository's standards exist to prevent. The error check is
      # therefore its own step, and it is NEVER under warn_only: a stabilization
      # window is a decision to tolerate known debt, not a decision to tolerate
      # a broken analysis.
      - name: Run knip
        working-directory: ${{ inputs.workdir }}
        env:
          KNIP_VERSION: "6.34.0"
          CONFIG: .knip.generated.json
          OUT: ${{ runner.temp }}/knip-output.txt
        run: |
          set -uo pipefail
          # `|| rc=$?` rather than a bare call followed by `rc=$?`, and the
          # difference is the whole job. GitHub runs `run:` blocks under
          # `bash -e`, which `set -uo pipefail` does NOT clear -- it adds
          # options, it does not remove `-e`. So a bare call aborted the step
          # the instant knip exited 1, which is what knip does whenever it
          # finds anything: `rc=$?` never ran, KNIP_RC was never written, and
          # neither the error check nor the warn_only report step below ever
          # executed. The job hard-failed on findings in every mode,
          # warn_only included.
          #
          # A command whose failure is handled by `||` is exempt from `-e`, so
          # this form captures the code instead of dying on it.
          #
          # This shipped and had to be found in CI, because the first caller
          # was chosen for being CLEAN: knip exited 0 there, the bug never
          # fired, and a green canary said the job worked. It did not. A gate
          # is only proven by a run that FAILS the way it is supposed to.
          rc=0
          pnpm dlx knip@"$KNIP_VERSION" -c "$CONFIG" --dependencies >"$OUT" 2>&1 || rc=$?
          cat "$OUT"
          echo "KNIP_RC=$rc" >> "$GITHUB_ENV"

      - name: Fail if knip could not complete its analysis
        env:
          OUT: ${{ runner.temp }}/knip-output.txt
        run: |
          set -euo pipefail
          if grep -q '^ERROR' "$OUT"; then
            echo "::error::knip reported an error and could not analyse this" \
                 "project fully. Its exit code tracks findings only, so this" \
                 "would otherwise have passed green having checked nothing." \
                 "Fix the error, or extend the generated config in" \
                 "job-depcheck-js-knip.yml if it is a plugin that cannot run in CI."
            exit 1
          fi
          # A non-zero exit with no findings summary is not debt -- it is knip
          # never having run. `pnpm dlx` failing to fetch the pinned version is
          # the realistic case, and without this it would surface through the
          # next step as "unused dependencies found", naming a cause that did
          # not happen and sending whoever reads it to the wrong place.
          if [ "${KNIP_RC:-0}" -ne 0 ] && ! grep -q '^Unused ' "$OUT"; then
            echo "::error::knip exited ${KNIP_RC} without reporting any" \
                 "findings, which means it did not run. Check the 'Run knip'" \
                 "step output — a failure to fetch the pinned version is the" \
                 "usual cause."
            exit 1
          fi
          echo "knip completed its analysis with no errors."

      - name: Report unused dependencies
        continue-on-error: ${{ inputs.warn_only }}
        run: |
          set -euo pipefail
          if [ "${KNIP_RC:-0}" -ne 0 ]; then
            echo "::error::knip found unused dependencies. See the 'Run knip'" \
                 "step above for the list. Remove them, or add a justified" \
                 "entry to ignore_dependencies at the call site."
            exit 1
          fi
          echo "No unused dependencies."
