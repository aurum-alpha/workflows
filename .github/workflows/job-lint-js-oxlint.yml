# Fleet capability: lint for one deployable unit's JS/TS source, oxlint flavour
# (CI_STANDARD Principle 12 — one way per capability, and this is the second
# way, deliberately).
#
# oxlint and eslint are not interchangeable. oxlint is Rust, runs ~50-100x
# faster, and implements a subset of the rules: no eslint plugins, and no
# type-aware linting at all — the @typescript-eslint rules that need the type
# checker do not exist there. So it is a fast first pass, not a replacement,
# and a repo on oxlint is getting less checking than one on eslint, not
# different checking.
#
# Both jobs exist so no repo is blocked on a linter migration it did not ask
# for. gofast is the only oxlint caller today; the fleet target is one linter,
# and until that is decided this file is the honest way to say "we run two".
name: job-lint-js-oxlint

on:
  workflow_call:
    inputs:
      workdir:
        description: >-
          Directory holding package.json and .node-version. Empty (the repo
          root) for a repo whose JS project *is* the repo; `client` for a repo
          where the React app is its own pnpm project inside a Go or PHP tree.
          Those are two real shapes and this input distinguishes them — it is
          not a per-repo path setting, and no caller should pass anything else.
        type: string
        default: "."
      dir:
        description: >-
          Which standard unit to act on: `client`, `server` or `shared`. Not a
          path — the layout is fixed fleet-wide, and any other value fails.
        type: string
        required: true
      warn_only:
        description: >-
          Report findings without failing the job. This is a documented
          stabilization window (CI_STANDARD Principle 3), not a permanent mode:
          a repo adopting --max-warnings 0 against existing debt runs warn-only
          while the debt burns down, then flips to a hard gate. Findings stay
          visible in the step log and the step is marked failed-but-continued.
          Same contract as job-go-lint's input of the same name.
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # Two repo shapes, and this input distinguishes them: `.` where the JS
      # project is the repo, `client` where it is its own pnpm project inside a
      # Go or PHP tree. Anything else is a repo putting its UI somewhere of its
      # own choosing, which is the variance the catalog exists to remove
      # (CI_STANDARD "Standard repository layout").
      - name: Validate workdir
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          case "$WD" in
            .|client) ;;
            *) echo "::error::workdir must be '.' or 'client'; got '$WD'." \
                    "See CI_STANDARD 'Standard repository layout'."; exit 1 ;;
          esac

      # The unit is one of three names, fleet-wide (CI_STANDARD "Standard
      # repository layout"). This input says *which* standard unit, never
      # *where a repo happens to keep it* — a free-form path here would make the
      # catalog accommodate variance instead of removing it.
      - name: Validate unit
        env:
          UNIT: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          case "$UNIT" in
            client|server|shared) ;;
            # The workdir is itself the unit — see job-test-unit-js-vitest.
            .) ;;
            *) echo "::error::dir must be client, server, shared or '.'; got '$UNIT'." \
                    "See CI_STANDARD 'Standard repository layout'."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          # Org registry for private @aurum-alpha packages; harmless no-op for
          # repos that don't consume the scope (pnpm 10+ only reads auth from
          # the user-level npmrc this writes).
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      # oxlint invoked directly, not via a `lint` script whose only content is a
      # path (Phase F2). --deny-warnings because a warning nobody must fix is a
      # warning nobody reads.
      - name: Lint ${{ inputs.dir }}
        working-directory: ${{ inputs.workdir }}
        continue-on-error: ${{ inputs.warn_only }}
        run: pnpm exec oxlint ${{ inputs.dir }} --deny-warnings
