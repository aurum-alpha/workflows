# aurum-job: capability=deploy-pin language=- role=publish
# Portfolio capability: record a product's published image in the deploy
# repository, which is what runs it (CI_STANDARD Principle 17). Single-job
# reusable workflow: the caller owns the job id and the needs: wiring; this
# file owns the entire job body.
#
# WHY IT EXISTS. A product's image is published by job-image-publish and then
# runs nowhere until the deploy repository names it. That repository is the
# record of what runs in each environment, and a deployer polls it. Moving a
# pin there by hand after every merge is the step this job removes: every
# merge to main opens, or brings up to date, the pull request that moves the
# product's staging pin, and every release opens the one that would move its
# production pin. A person merges both. Nothing here writes to the deploy
# repository's main branch, so nothing here deploys anything.
#
# IT DECIDES NOTHING ABOUT THE FORMAT. The deploy repository's own tools/pin
# validates the pin, writes it and renders what follows from it. This job
# supplies the tag and the digest and never edits a file itself, so the
# repository that owns the files owns their rules.
#
# IT DECIDES NOTHING ABOUT THE VERSION EITHER. `version` and `version_changed`
# are inputs, read from whichever build job carries the shared version-stamp
# block. A release is a commit that changed the version file, and a
# production pull request is opened only for one.
#
# THE CREDENTIAL. A GitHub App installed on the deploy repository alone, its id
# and private key held as the organisation secrets DEPLOY_BOT_APP_ID and
# DEPLOY_BOT_PRIVATE_KEY. The token it mints lasts an hour and reaches that
# one repository. Until the App exists the job says so and moves nothing, so a
# caller can adopt it first.
#
# ONE PULL REQUEST PER STACK AND ENVIRONMENT. The staging branch is
# pin/staging-<stack>, rebuilt from main on every merge and force-pushed, so
# the one open staging pull request always carries the newest build. A
# release's branch is pin/<stack>-v<version>.
#
# A PRODUCTION-ONLY STACK GETS NO STAGING PULL REQUEST. Whether a stack has
# a staging environment is the deploy repository's fact, read from its tree:
# environments/staging/<stack>/ exists or it does not. A stack with none
# (gha-runner-controller: one controller per GitHub organisation, so a
# staging twin would need a second GitHub App and scale set) skips the
# staging pin, and the summary says so rather than passing in silence. Its
# release pins production as any other does; the deploy repository creates
# such a stack's production directory by hand, since there is no staging
# twin to derive it from.
#
# WHAT A PRODUCT'S OWN PULL REQUEST GETS. The images it would pin and the tag
# it would pin them at, printed. Nothing is pushed (Principle 17, rule D5).
#
# WHERE THE CALLER PUTS IT. Below `ci-ok`, so a commit whose CI failed pins
# nothing:
#
#   deploy-pin:
#     needs: [ci-ok, <the job that resolved the version>]
#     if: >-
#       always()
#       && needs.ci-ok.result == 'success'
#     permissions:
#       contents: read
#       packages: read
#     uses: aurum-alpha/workflows/.github/workflows/job-deploy-pin.yml@main
#     with:
#       stack: <repo>
#       images: |
#         server=ghcr.io/aurum-alpha/<repo>
#       version: ${{ needs.<build-job>.outputs.version }}
#       version_changed: ${{ needs.<build-job>.outputs.version_changed }}
#     secrets: inherit
name: job-deploy-pin

on:
  workflow_call:
    inputs:
      stack:
        description: >-
          The stack in the deploy repository: environments/<env>/<stack>. It
          is the product repository's name.
        type: string
        required: true
      images:
        description: >-
          One line per service the stack runs, SERVICE=IMAGE with no tag:
          `server=ghcr.io/aurum-alpha/<repo>`. The staging tag is this
          commit's sha-<short>; the production reference is the release's
          v<version> resolved to its digest. Blank lines and lines starting
          with # are skipped.
        type: string
        required: true
      version:
        description: >-
          The version the build job resolved. Read only when version_changed
          is true.
        type: string
        default: ""
      version_changed:
        description: >-
          Whether this commit changed the version file, from the build job.
          True opens the production pull request.
        type: string
        default: "false"
      deploy_repository:
        description: >-
          owner/name of the deploy repository the App is installed on.
        type: string
        default: aurum-alpha/deploy
      runner:
        description: >-
          Override runs-on. Leave empty for the standard default, which resolves
          vars.RUNNER. Set a literal label only where that one job has a reason to
          bypass the standard runner, and say the reason in a comment beside it
          (CI_STANDARD Principle 4).
        type: string
        default: ""

jobs:
  deploy-pin:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # Escalated above the read-only portfolio floor: a release's digest is
      # read from ghcr before the production pin names it.
      packages: read
    steps:
      - name: What would move, and whether it may
        id: plan
        env:
          APP_ID: ${{ secrets.DEPLOY_BOT_APP_ID }}
          APP_KEY: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          STACK: ${{ inputs.stack }}
          IMAGES: ${{ inputs.images }}
          VERSION: ${{ inputs.version }}
          VERSION_CHANGED: ${{ inputs.version_changed }}
          DEPLOY_REPOSITORY: ${{ inputs.deploy_repository }}
        run: |
          set -euo pipefail
          if ! [[ "$STACK" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::stack '${STACK}' is not a repository name"
            exit 1
          fi
          if ! [[ "$DEPLOY_REPOSITORY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::deploy_repository '${DEPLOY_REPOSITORY}' is not owner/name"
            exit 1
          fi
          short="${GITHUB_SHA::7}"
          count=0
          {
            echo "### Deploy pin: ${STACK}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            [ "${line#\#}" = "$line" ] || continue
            if ! [[ "$line" =~ ^[a-z][a-z0-9_-]*=ghcr\.io/[a-z0-9-]+/[a-z0-9][a-z0-9/-]*$ ]]; then
              echo "::error::images: '${line}' is not SERVICE=ghcr.io/<owner>/<image> with no tag"
              exit 1
            fi
            echo "- staging: \`${line}:sha-${short}\`, as a pull request where the stack has a staging environment" >> "$GITHUB_STEP_SUMMARY"
            count=$((count + 1))
          done <<< "$IMAGES"
          if [ "$count" -eq 0 ]; then
            echo "::error::images names no service"
            exit 1
          fi

          release=false
          if [ "$VERSION_CHANGED" = "true" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version_changed is true but version '${VERSION}' is not MAJOR.MINOR.PATCH"
              exit 1
            fi
            release=true
            echo "- production: \`v${VERSION}\`, by digest, as a pull request" >> "$GITHUB_STEP_SUMMARY"
          fi

          main=false
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            main=true
          fi
          app=false
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            app=true
          fi
          move=false
          if [ "$main" = "true" ] && [ "$app" = "true" ]; then
            move=true
          elif [ "$main" = "true" ]; then
            echo "::notice::DEPLOY_BOT_APP_ID and DEPLOY_BOT_PRIVATE_KEY are not set, so nothing was pinned in ${DEPLOY_REPOSITORY}. Create the App and the two organisation secrets."
          else
            echo "::notice::Not a push to main: the pins above are what a merge would move."
          fi

          {
            echo "short=${short}"
            echo "release=${release}"
            echo "move=${move}"
            echo "owner=${DEPLOY_REPOSITORY%%/*}"
            echo "name=${DEPLOY_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"

      - name: A token for the deploy repository alone
        id: token
        if: steps.plan.outputs.move == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPLOY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: ${{ steps.plan.outputs.owner }}
          repositories: ${{ steps.plan.outputs.name }}

      - name: Check out the deploy repository
        if: steps.plan.outputs.move == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.deploy_repository }}
          token: ${{ steps.token.outputs.token }}
          path: deploy
          fetch-depth: 0

      - name: Log in to ghcr to read the release's digest
        if: steps.plan.outputs.move == 'true' && steps.plan.outputs.release == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Open the pin pull requests
        if: steps.plan.outputs.move == 'true'
        working-directory: deploy
        env:
          STACK: ${{ inputs.stack }}
          IMAGES: ${{ inputs.images }}
          SHORT: ${{ steps.plan.outputs.short }}
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ inputs.version }}
          OWNER: ${{ steps.plan.outputs.owner }}
          NAME: ${{ steps.plan.outputs.name }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"
          api="${GITHUB_API_URL}/repos/${OWNER}/${NAME}"

          # One branch per stack and environment, rebuilt from main on every
          # call, and one pull request on it. A newer build replaces what the
          # branch carries, so a stack never has two pin pull requests open
          # for one environment and merging always takes the newest.
          # $1 environment, $2 branch, $3 title, $4 body, then the pins.
          open_pin_pr() {
            local env="$1" branch="$2" title="$3" body="$4"
            shift 4
            git fetch --quiet origin main
            git checkout --quiet -B "$branch" origin/main
            if [ "$env" = "production" ]; then
              python3 tools/pin production "$STACK" --version "$VERSION" "$@"
            else
              python3 tools/pin staging "$STACK" "$@"
            fi
            if [ -z "$(git status --porcelain)" ]; then
              echo "::notice::${env} already runs what this build would pin for ${STACK}"
              return 0
            fi
            git add -A
            git commit --quiet -m "$title" -m "$body"
            git push --quiet --force origin "HEAD:refs/heads/${branch}"
            local payload status
            payload="$(python3 -c 'import json,sys; print(json.dumps({"title": sys.argv[1], "head": sys.argv[2], "base": "main", "body": sys.argv[3]}))' \
              "$title" "$branch" "$body")"
            status="$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${api}/pulls" -d "$payload")"
            case "$status" in
              201)
                echo "- ${env}: opened $(python3 -c 'import json; print(json.load(open("response.json"))["html_url"])')" >> "$GITHUB_STEP_SUMMARY"
                ;;
              422)
                # Already open on this branch: the push above moved it, and
                # the title and body now name this build.
                curl -sS -o response.json -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  "${api}/pulls?state=open&head=${OWNER}:${branch}"
                local number
                number="$(python3 -c 'import json; r=json.load(open("response.json")); print(r[0]["number"] if r else "")')"
                if [ -z "$number" ]; then
                  echo "::error::opening the ${env} pull request answered 422 and none is open on ${branch}"
                  cat response.json
                  return 1
                fi
                payload="$(python3 -c 'import json,sys; print(json.dumps({"title": sys.argv[1], "body": sys.argv[2]}))' "$title" "$body")"
                status="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
                  -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  "${api}/pulls/${number}" -d "$payload")"
                [ "$status" = "200" ] || { echo "::error::updating pull request #${number} answered ${status}"; return 1; }
                echo "- ${env}: updated ${GITHUB_SERVER_URL}/${OWNER}/${NAME}/pull/${number}" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "::error::opening the ${env} pull request answered ${status}"
                cat response.json
                return 1
                ;;
            esac
            rm -f response.json
          }

          staging=()
          production=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            [ "${line#\#}" = "$line" ] || continue
            staging+=("${line}:sha-${SHORT}")
            if [ "$RELEASE" = "true" ]; then
              image="${line#*=}"
              digest="$(docker buildx imagetools inspect "${image}:v${VERSION}" --format '{{json .Manifest}}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
              production+=("${line}@${digest}")
            fi
          done <<< "$IMAGES"

          commit="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          if [ -d "environments/staging/${STACK}" ]; then
            open_pin_pr staging "pin/staging-${STACK}" \
              "Pin ${STACK} staging to ${GITHUB_REPOSITORY#*/}@${SHORT}" \
              "Built from ${commit} and published as sha-${SHORT}. Merging this deploys it to staging." \
              "${staging[@]}"
          else
            # A production-only stack: nothing to pin until a release.
            echo "::notice::${STACK} has no staging environment (environments/staging/${STACK} does not exist in ${OWNER}/${NAME}), so no staging pull request was opened."
            echo "- staging: none; ${STACK} is production-only, and a release pins production" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$RELEASE" = "true" ]; then
            release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
            open_pin_pr production "pin/${STACK}-v${VERSION}" \
              "Pin ${STACK} production to v${VERSION}" \
              "Release ${release_url}, pinned by digest. Merge the staging pull request first, so production takes what staging ran. Merging this deploys it to production." \
              "${production[@]}"
          fi
