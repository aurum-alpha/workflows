name: ci-conformance

# Asserts the calling repo's ci.yml obeys CI_STANDARD, inside that repo's own
# CI, gated by its own ci-ok. This is the difference between a standard and a
# document: every principle it checks was written down first and violated
# afterwards, in a repo whose CI was green the whole time.
#
# It reads the caller's workflow file and nothing else — no build, no network
# beyond two checkouts, a few seconds. It is a gate, so it belongs in ci-ok
# like any other.

on:
  workflow_call:
    inputs:
      runner:
        description: Override the runner (Principle 4 escape hatch).
        type: string
        required: false
        default: ""
      standard_ref:
        description: >-
          Commit of aurum-alpha/workflows to take the checker from. A caller
          pinning this workflow by SHA gets a fixed checker too, which is the
          point — but only if this default moves in the same commit as the
          checker. GitHub gives a called workflow no handle on its own SHA, so
          there is nothing to derive it from and it has to be written down.

          It was not, for twenty commits: this default sat on 81b6b62 while
          tools/check-ci-conformance changed twenty times, so a caller would
          have run a checker with none of the rules added since — including the
          one that would have caught the drift that made this obvious. Nothing
          reported it because no repo calls this workflow at all (issue #79).
        type: string
        required: false
        default: 08e5c1a80cb4fcc97863e90eadd680c98acb0a9c

jobs:
  ci-conformance:
    name: ci-conformance
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the repo under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # aurum-alpha/workflows is public, so this needs no token — which is the
      # whole reason the check can live inside each repo instead of in a
      # fleet-wide sweep that only ever ran when someone remembered to run it.
      - name: Checkout the standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurum-alpha/workflows
          ref: ${{ inputs.standard_ref }}
          path: .aurum-standard
          persist-credentials: false

      - name: Check ci.yml against CI_STANDARD
        run: .aurum-standard/tools/check-ci-conformance --repo-root .
