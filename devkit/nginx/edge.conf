# The edge for __REPO__, at port offset +0.
#
# This is the one address a person types, and the one routing table in front of
# everything else (016-local-development.md LD4). oauth2-proxy answers the
# auth_request subrequest and hands back the provider's ID token; every
# authenticated location forwards that token and nothing else
# (060-auth.md AU1, AU2 form (a)).
#
# Rendered by textual substitution. devkit/README.md carries the table.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream server {
    server server:__SERVER_PORT__;
}

upstream client {
    server client:5173;
}

upstream authproxy {
    server oauth2-proxy:4180;
}

server {
    listen 80;
    server_name _;

    # nginx drops every inherited proxy_set_header in a location that declares
    # one of its own. So each location below repeats the whole block, and the
    # Authorization line is in every one of them. That line is what strips an
    # inbound Authorization header: whatever a client sent, an upstream sees
    # only what this file put there.

    # The edge's own liveness, for the compose healthcheck. It answers before
    # any upstream exists, so a failing probe names the edge and not the API.
    location = /edge-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # The relying party's own endpoints. Never behind auth_request: this is
    # where an unauthenticated person is sent to authenticate.
    # ---------------------------------------------------------------------
    location /oauth2/ {
        proxy_pass                         http://authproxy;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Authorization     "";
    }

    # The auth_request subrequest. It inherits the client's request headers,
    # so the inbound Authorization is cleared here too: a client must not be
    # able to present its own bearer to the relying party.
    location = /oauth2/auth {
        internal;
        proxy_pass                         http://authproxy;
        proxy_pass_request_body            off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Authorization     "";
    }

    # RP-initiated logout (AU5): end the proxy session, then the provider's.
    # Stopping after the first hop leaves the provider session alive, and the
    # next click on sign-in signs the person straight back in.
    location = /logout {
        return 302 /oauth2/sign_out?rd=http%3A%2F%2Flocalhost%3A__PORT_IDP__%2Frealms%2F__REPO__%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3D__REPO__%26post_logout_redirect_uri%3Dhttp%3A%2F%2Flocalhost%3A__PORT_EDGE__%2F;
    }

    # ---------------------------------------------------------------------
    # The skip list. These paths carry no auth_request, because each is
    # defined by a standard as answerable before anyone is known:
    #   /healthz, /readyz                 030-service.md SC1
    #   /config.json                      090-web-client.md WC2
    #   /.well-known/security.txt         085-security-baseline.md SB7
    #   /api/client-errors                090-web-client.md WC5
    # ---------------------------------------------------------------------
    location = /healthz {
        proxy_pass                         http://server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
    }

    location = /readyz {
        proxy_pass                         http://server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
    }

    # The bootstrap document is rendered from the serving process's own
    # environment, so it comes from the API and never from the dev server.
    location = /config.json {
        proxy_pass                         http://server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
    }

    location = /.well-known/security.txt {
        proxy_pass                         http://server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
    }

    # A page that fails before a session exists still has to be able to say so.
    location = /api/client-errors {
        proxy_pass                         http://server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
    }

    # ---------------------------------------------------------------------
    # Everything else is authenticated.
    # ---------------------------------------------------------------------

    # The API answers 401 rather than redirecting. A redirect to a login page
    # reaches a fetch() as an opaque failure against the wrong origin.
    location /api/ {
        auth_request     /oauth2/auth;
        auth_request_set $token $upstream_http_authorization;

        proxy_pass                         http://server;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $token;
    }

    # The pages, and the client dev server's hot-reload socket behind them.
    location / {
        auth_request     /oauth2/auth;
        auth_request_set $token $upstream_http_authorization;
        error_page 401 = @sign_in;

        proxy_http_version                 1.1;
        proxy_pass                         http://client;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $token;
    }

    location @sign_in {
        return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
    }
}
