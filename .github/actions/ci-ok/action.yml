# Portfolio capability: the DAG rollup (CI_STANDARD Principle 12 — one way per
# capability). Every repo ends its DAG with a `ci-ok` job that fails if any
# dependency did; this is that job's body, defined once.
#
# A composite action rather than a reusable workflow, on purpose. A called
# workflow reports as `<caller job> / <callee job>`, so `ci-ok` would become
# `ci-ok / ok` in the checks list and every repo's branch-protection required
# check would stop reporting — a rename this repo cannot fix, in eleven places
# at once. A composite action runs inside the caller's job, so the check keeps
# its name and only the body is shared.
#
# What it does not take over: the `needs:` list and `if: always()`. Those are
# the repo's own DAG and belong in the repo. This is the fifteen lines that had
# no business differing, and by the time it was written they differed three
# ways across eleven repos.
#
# CALLERS NEED NO CHECKOUT, and should not have one. This action reads
# inputs.needs_json and touches no repository file, and the runner fetches an
# `owner/repo/path@ref` action by itself. A caller that checks out anyway is
# doing nothing useful and acquiring a dependency on a token: with the correct
# `permissions: {}` the job holds none, so the checkout fails outright against a
# private repository. It did, on gha-runner-controller, with "Repository not
# found" — while the identical line passed on gofast, which is public. The
# grant a caller needs for this job is nothing:
#
#   ci-ok:
#     needs: [...]
#     if: always()
#     permissions: {}
#     steps:
#       - uses: aurum-alpha/workflows/.github/actions/ci-ok@<sha>  # vX.Y.Z
#         with:
#           needs_json: the caller's toJSON(needs), in an expression
name: ci-ok
description: Fail the run if any dependency failed or was cancelled.

inputs:
  needs_json:
    description: >-
      The caller's `needs` context, passed as toJSON(needs) in an expression.
      Written without the double-brace delimiters on purpose. GitHub evaluates
      expressions throughout an action manifest, an input description included,
      and `needs` does not exist in a composite action's context — so writing
      the example out in full here fails the manifest at load time with
      "Unrecognized named-value: 'needs'", before a single step runs. It did:
      that was this file's first CI run.

      Not toJSON(needs.*.result): that flattens to a bare list of verdicts, so a
      failing run could say only that something failed and never which job. The
      full object is keyed by job id, which is the one thing a reader of a red
      ci-ok actually needs.
    required: true
  main_only_jobs:
    description: >-
      Job ids, separated by commas or spaces, whose failure counts only on a
      push to the default branch. A pull request still runs those jobs. Their
      result does not turn this rollup red. Empty counts every dependency.
    required: false
    default: ""
  on_default_branch:
    description: >-
      Pass the expression that is true on a push to the repository's default
      branch. When it is not true, main_only_jobs are left out of the failure
      count. The default is true, so a caller that names no main_only_jobs
      counts every dependency, which is the previous behaviour.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Fail on failed or cancelled dependencies
      shell: bash
      env:
        NEEDS: ${{ inputs.needs_json }}
        MAIN_ONLY_JOBS: ${{ inputs.main_only_jobs }}
        ON_DEFAULT_BRANCH: ${{ inputs.on_default_branch }}
      run: |
        set -euo pipefail

        # Printed unconditionally. On a green run it is the record of what
        # actually gated the merge; on a red one it is the diagnosis.
        printf '%s\n' "$NEEDS"

        # python3, not grep: a job id has to be dropped from the object before
        # the count, and a regex over the whole blob cannot tell one job's
        # result from another's. Cancelled stays separate from failure. A
        # failure is a verdict about the code. A cancellation is almost always
        # the concurrency group superseding an older run, or a runner going
        # away.
        python3 - << 'PY'
        import json, os, sys

        needs = json.loads(os.environ["NEEDS"])
        main_only = {
            part
            for part in os.environ.get("MAIN_ONLY_JOBS", "").replace(",", " ").split()
            if part
        }
        on_default = os.environ.get("ON_DEFAULT_BRANCH", "true") == "true"
        ignored = []
        if not on_default:
            for job in sorted(main_only):
                if job in needs:
                    ignored.append(job)
                    del needs[job]
        if ignored:
            print("Not counted on this run (pull request): " + ", ".join(ignored))

        def ids(result):
            return [
                job for job, info in needs.items()
                if isinstance(info, dict) and info.get("result") == result
            ]

        failed, cancelled = ids("failure"), ids("cancelled")
        if failed:
            print(f"::error::{len(failed)} dependency job(s) failed: {', '.join(failed)}")
            sys.exit(1)
        if cancelled:
            print(
                f"::error::{len(cancelled)} dependency job(s) were cancelled: "
                f"{', '.join(cancelled)}. Nothing was proved about this commit; "
                "re-run if the cancellation was not deliberate."
            )
            sys.exit(1)
        print("All dependencies succeeded.")
        PY
