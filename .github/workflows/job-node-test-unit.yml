# Fleet capability: test-unit (CI_STANDARD Principle 12 — one way per
# capability). Single-job reusable workflow: the caller owns the job id and
# needs: wiring; this file owns the entire job body. Callers pass
# secrets: inherit; vars.RUNNER resolves in the caller's context.
name: job-node-test-unit

on:
  workflow_call:
    inputs:
      workdir:
        description: Directory containing the Node app (package.json, .node-version)
        type: string
        default: "."

jobs:
  test-unit:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # The job-level permissions block REPLACES the caller's token grant,
      # so packages: read must be explicit or private @aurum-alpha
      # installs 403 (C2 first run).
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          # Org registry for private @aurum-alpha packages; harmless no-op
          # for repos that don't consume the scope (pnpm 10+ only reads
          # auth from the user-level npmrc this writes).
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      - working-directory: ${{ inputs.workdir }}
        # junit output feeds Codecov Test Analytics (flaky-test detection);
        # the default reporter keeps terminal output readable. No `--`
        # before the flags: pnpm 10 forwards args directly and swallows a
        # literal `--` (verified: with it, vitest never sees the flags).
        run: >
          pnpm run test:unit
          --reporter=default --reporter=junit
          --outputFile.junit=test-report.junit.xml
      # Artifact names are a namespace shared by every job in the caller's run,
      # and a called workflow cannot see the caller's job id (github.job reads
      # `test-unit`, the id inside this file). workdir is the only thing that
      # distinguishes two callers of this job, so it is the key.
      #
      # !cancelled(), because the test-results upload below runs on a failed
      # run and reads this output. Inheriting success() meant a failing unit
      # skipped this step, rendered the artifact name as a bare
      # `testresults-node-`, and two failing units in one repo then collided
      # on that name. job-test-unit-js-vitest avoids this a different way —
      # its census step runs BEFORE the tests, so its output is already set
      # when they fail. Either shape works; what does not is a naming step
      # after the tests with nothing to keep it alive.
      - name: Name this unit's artifacts
        id: key
        if: ${{ !cancelled() }}
        shell: bash
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          key="${WD//\//-}"
          key="${key//./root}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      # Handed to job-coverage-upload rather than sent to Codecov from here, so
      # this job answers only "do the tests pass" and a Codecov outage cannot
      # skip the caller's image-build. See job-coverage-upload.yml.
      #
      # Inherits success() deliberately: a failed unit publishes no coverage,
      # exactly as the codecov step it replaces was gated.
      - name: Publish coverage for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-node-${{ steps.key.outputs.key }}
          path: ${{ inputs.workdir }}/coverage
          if-no-files-found: error
          retention-days: 1

      # !cancelled(), unlike coverage: a failed run IS the test-analytics
      # signal, which is why the step this replaces carried the same condition.
      - name: Publish test results for the upload job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testresults-node-${{ steps.key.outputs.key }}
          path: ${{ inputs.workdir }}/test-report.junit.xml
          if-no-files-found: error
          retention-days: 1
