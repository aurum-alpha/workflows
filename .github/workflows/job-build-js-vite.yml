# aurum-job: capability=build language=js role=build
# Portfolio capability: build for a Vite-built client (CI_STANDARD Principle 12).
# FRAMEWORK tier — React owns its build tool, so the shared job owns the command
# rather than a contract. That is the test for admitting a framework job: name
# the single command it would run. Here it is `vite build`.
name: job-build-js-vite

on:
  workflow_call:
    inputs:
      workdir:
        description: >-
          Directory holding package.json and .node-version, relative to the
          repo root. Defaults to `.`, the repo root, for a repo whose JS
          project *is* the repo; `client` is the other common shape, a React
          app in its own pnpm project inside a Go or PHP tree. Any other path
          is accepted — the catalog standardises the toolchain, not the tree
          (workflows#252). It must be relative, must not escape the root, and
          must contain a package.json; the job fails naming the path if not.
        type: string
        default: "."
      outdir:
        description: Built client, relative to workdir. Vite's configured target.
        type: string
        default: dist/public

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workdir is DEFAULTED, not restricted. `.` is the common shape --
      # the JS project is the repo -- and `client` is the second, its own pnpm
      # project inside a Go or PHP tree. A repo that keeps its UI anywhere else
      # passes that path and the job runs there.
      #
      # This step used to REJECT anything but those two, on the argument that a
      # third path was variance the catalog exists to remove. That was the
      # wrong variance to remove. What the catalog standardises is the RUNNER
      # -- one pnpm, one TypeScript, one set of steps in one order, so a build
      # is reproducible and a version bump is one wave instead of eleven -- and
      # none of that depends on where the code sits. Restricting the path
      # bought uniformity in the dimension that costs nothing to vary, and cost
      # adoption in the dimension that matters: a repo whose layout did not fit
      # could not call the job at all, and therefore got none of the version
      # standardisation either. The toolchain is dictated; the tree is not.
      #
      # What is still checked is that the path is safe and real. It runs AFTER
      # checkout because the second half needs a tree, and it names the path so
      # a typo fails here rather than six steps later inside pnpm.
      - name: Validate workdir
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          case "$WD" in
            "") echo "::error::workdir is empty; use '.' for the repo root."
                exit 1 ;;
            /*) echo "::error::workdir must be relative to the repo root;" \
                     "got '$WD'."; exit 1 ;;
            ..|../*|*/../*|*/..)
                echo "::error::workdir must not escape the repo root;" \
                     "got '$WD'."; exit 1 ;;
          esac
          if [ ! -f "$WD/package.json" ]; then
            echo "::error::no package.json at workdir '$WD'." \
                 "The workdir names the directory holding package.json and" \
                 ".node-version, relative to the repo root."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          # Org registry for private @aurum-alpha packages; harmless no-op for
          # repos that don't consume the scope (pnpm 10+ only reads auth from
          # the user-level npmrc this writes).
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
          # The default dest is ~/setup-pnpm, shared by every job on a
          # persistent self-hosted host; two installing pnpm at once race and
          # one dies on ENOTEMPTY. runner.temp is per-job — the same fix as
          # "Isolate Go caches to runner.temp" in the Go jobs. Kept identical
          # to setup/node-pnpm, which is this prelude's other copy.
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      # vite reads vite.config.ts for root and outDir; nothing here to
      # parameterise, which is what makes this a framework job.
      - working-directory: ${{ inputs.workdir }}
        run: pnpm exec vite build

      # Named client-dist, not dist: the server bundle is a separate artifact
      # from a separate job, and the image job downloads both. One artifact
      # called dist would have them overwrite each other.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-dist
          path: ${{ inputs.workdir }}/${{ inputs.outdir }}
          retention-days: 1
          if-no-files-found: error
