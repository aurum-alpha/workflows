# aurum-job: capability=image-publish language=- role=publish
# Portfolio capability: promote the staged image to its published tags
# (CI_STANDARD Principle 17). Third of three — build, starts, publish.
#
# Release is promotion, not production. This job builds nothing. It takes the
# digest job-image-build staged, the one job-image-starts just proved boots,
# and points tags at it. `imagetools create` is a registry-side manifest
# operation: no layers move, and there is no second build that could differ
# from the one that was tested.
#
# It runs on pull requests with only the final promotion suppressed, so the
# publish path is exercised on every change and not first attempted on main
# (Principle 17, rule D5). The main check goes on the step, never on the job:
# a job-level `if` makes the check disappear from pull requests entirely, and a
# check nobody sees is not a gate.
name: job-image-publish

on:
  workflow_call:
    inputs:
      image:
        description: Canonical image name, from job-image-build's `image` output.
        type: string
        required: true
      digest:
        description: >-
          Manifest digest, from job-image-build's `digest` output — the same
          value job-image-starts pulled. Promoting by digest rather than
          rebuilding is the whole point: what ships is the artifact that was
          gated, not another one built from the same source.
        type: string
        required: true
      version_changed:
        description: >-
          From the build job's `version_changed` output (`true` when this commit
          changed `.version`). Gates the `latest` tag with the same rule as
          `v<semver>` in `extra_tags`.
        type: string
        default: "false"
      extra_tags:
        description: >-
          Newline-separated additional docker/metadata-action tag rules, on top
          of the portfolio defaults (`dev` on the default branch, `latest` on a
          release commit, `sha-<short>`, and the branch name). For a repo that
          publishes a version from a file or a build number.

          It may not produce `latest` or `dev`. The default rules already do,
          and this input is the one way a caller could route around those gates.
          Rejected by name below, and the computed tag list is checked again
          afterwards in case a rule produces them by some other spelling.
        type: string
        default: ""
      runner:
        description: >-
          Override runs-on. Leave empty for the standard default, which resolves
          vars.RUNNER. Set a literal label only where that one job has a reason to
          bypass the standard runner, and say the reason in a comment beside it
          (CI_STANDARD Principle 4).
        type: string
        default: ""

jobs:
  publish:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # The only job in the three that needs write for its actual purpose. The
      # build job holds it to stage a digest; this one holds it to promote.
      packages: write
    steps:
      # `dev` is main's rolling tag; `latest` is the latest release only. A pull
      # request that could claim either would silently redirect deployments.
      - name: extra_tags may not claim dev or latest
        if: ${{ inputs.extra_tags != '' }}
        env:
          EXTRA: ${{ inputs.extra_tags }}
        run: |
          set -euo pipefail
          if printf '%s' "$EXTRA" | grep -qiE '(value|suffix|prefix)=latest\b|^\s*latest\s*$'; then
            echo "::error::extra_tags may not produce 'latest'." \
                 "The default rule emits it, gated on version_changed;" \
                 "this input is the only way to route around that gate."
            exit 1
          fi
          if printf '%s' "$EXTRA" | grep -qiE '(value|suffix|prefix)=dev\b|^\s*dev\s*$'; then
            echo "::error::extra_tags may not produce 'dev'." \
                 "The default rule emits it, gated on the default branch;" \
                 "this input is the only way to route around that gate."
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ inputs.version_changed == 'true' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            ${{ inputs.extra_tags }}

      - name: What would be promoted
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "Source:  $REF"
          echo "Tags:"
          printf '%s\n' "$TAGS" | sed 's/^/  /'

          # Belt and braces, evaluated on every run including pull requests.
          # The Promote step below is main-gated, so a stray tag on a branch
          # could not actually ship — but being quietly saved by a second gate
          # is not the same as being correct, and this is the run where someone
          # can still see it. `dev` is main's rolling tag; `latest` is release
          # only and may appear on a release pull request preview.
          #
          # REF, not event. A workflow_dispatch on main computes `dev` because
          # metadata-action's {{is_default_branch}} is true — and it is right.
          # The run simply is not the one that promotes, which the Promote step
          # below already decides on its own.
          #
          # A pull_request still fails for `dev` off main, and that is the case
          # worth keeping: its GITHUB_REF is refs/pull/N/merge on a feature
          # branch, so a stray `dev` is caught where a human is looking.
          if printf '%s\n' "$TAGS" | grep -qE ':dev$'; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::The computed tags include ':dev' on ${GITHUB_REF}." \
                   "dev is main's rolling tag, and only main's."
              exit 1
            fi
          fi
          if printf '%s\n' "$TAGS" | grep -qE ':latest$'; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::The computed tags include ':latest' on ${GITHUB_REF}." \
                   "latest is a release tag; it must not appear off main."
              exit 1
            fi
          fi

          # Say why nothing will ship, on the run where someone is watching.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "This run promotes: push to main."
          else
            echo "::notice title=Nothing will be promoted::This is \
          ${GITHUB_EVENT_NAME} on ${GITHUB_REF}. Promotion is restricted to a \
          push to main, so the tags above were computed and checked but no tag \
          will move. The image itself was built and started by the two jobs \
          before this one; only the final manifest write is suppressed."
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(-t "$t")
          done <<< "$TAGS"
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::metadata-action produced no tags, so there is nothing to promote."
            exit 1
          fi
          docker buildx imagetools create "${args[@]}" "$REF"
          docker buildx imagetools inspect "${args[0]#-t }" >/dev/null 2>&1 || true
          echo "Promoted $REF"
