# Fleet Node toolchain setup (CI_STANDARD C3): Node from the workdir's
# .node-version, org registry for private @aurum-alpha packages, pnpm from
# packageManager, shared store cache, optional frozen-lockfile install.
#
# Consumers: bespoke caller-side jobs that cannot be capability stubs
# (client-manager's prettier/golden-corpus/contract, future one-offs) —
# reference as aurum-alpha/workflows/setup/node-pnpm@<sha>. The shared
# job-node-* workflows deliberately keep this prelude inline instead of
# calling the composite: they execute in the caller's checkout, so a
# self-reference would need its own SHA pin and every prelude change would
# take two commits (chicken-and-egg). One definition per audience.
name: node-pnpm
description: Node + pnpm toolchain setup the fleet way
inputs:
  workdir:
    description: Directory containing package.json and .node-version
    required: false
    default: "."
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.workdir }}/.node-version
        registry-url: https://npm.pkg.github.com
        scope: "@aurum-alpha"
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        package_json_file: ${{ inputs.workdir }}/package.json
    - name: Get pnpm store directory
      shell: bash
      working-directory: ${{ inputs.workdir }}
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: pnpm install --frozen-lockfile
