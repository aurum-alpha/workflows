# aurum-job: capability=secret-scan language=- role=policy
name: job-secret-scan

# 032 SE4: no secret value enters the repository, at any point in its history,
# and a scanner runs on every push and blocks it. This is that scanner, in two
# halves, because the standard asks two different questions:
#
#   gitleaks                 known credential shapes and high-entropy strings, in
#                            every commit this event judges. Decides by what a
#                            value LOOKS like.
#   check-secret-locations   a variable that is a secret by its NAME (SE3's
#                            closed kind suffix) holds a placeholder in
#                            .env.example, never a value in a Dockerfile layer,
#                            and never a credential to a host the compose
#                            project does not start; .env and .env.* are not
#                            tracked. Decides by name and place, and needs no
#                            opinion about the value. SMTP_PASSWORD=hunter2 is
#                            the corpus's verified detector: an entropy scanner
#                            passes it, this half does not.
#
# Split by event, the way job-osv-scan is. A pull request or a merge group is
# judged on what it introduces: the commits between its base and its head, and
# the tracked files it changed. A push to the default branch, a schedule or a
# dispatch is judged on everything: every commit in the history and every
# tracked file. fail_on_new (default true) blocks the first; fail_on_existing
# (default false) blocks the second, which is Principle 3's window applied to
# the half that has a backlog by construction: a secret already in history is
# leaked, stays in history (SE8), and is answered by rotation, not by a rewrite
# that would turn this job green.
#
# One allow-list, and it is the catalog's: config/gitleaks.toml, path-scoped to
# the files the devkit renders and the compose files that start the development
# backing services, AND value-scoped to the devkit's credential family. That is
# SE4's one admitted reason, SE9's development credential, written once. The
# job passes it with --config, which makes a repository's .gitleaks.toml inert;
# --ignore-gitleaks-allow makes inline markers inert; a .gitleaksignore is
# deleted from the checkout before the scan, because gitleaks reads the one in
# the tree it scans whatever --gitleaks-ignore-path says. The index still lists
# it, so check-secret-locations reports all three and nobody keeps one
# believing it works.
#
# The scanner is proven before it judges: every case of the secrets corpus's
# forbidden_locations part is materialised into a throwaway repository and both
# halves must reach the case's own verdict, with the config the scan is about to
# use. A gitleaks release that stops catching a case fails here, in every
# caller, rather than passing quietly.
#
# gitleaks runs from its published image, pinned by digest with the version in
# band, the rule 085 SB1 applies to every FROM line. The release tarball's
# checksum file is a separate artifact, and an image digest is one pin that
# covers the binary and the git it runs; the job pulls it and puts a one-line
# shim on PATH so the checker's proof and the scan call the same gitleaks. A
# GitHub Action exists upstream and needs a licence key for an organisation, and
# a Go toolchain in every caller to build it is the cost the osv wrapper
# already refused.
#
# GitHub's own push protection is an organisation setting and not a workflow:
# an organisation owner enables it under the organisation's code security
# settings, and it refuses the push before this job sees it. This job is the
# gate either way, because push protection covers the shapes GitHub knows and
# nothing about names or places.

on:
  workflow_call:
    inputs:
      runner:
        description: Override the runner (Principle 4 escape hatch).
        type: string
        required: false
        default: ""
      fail_on_new:
        description: >-
          Block a pull request or merge group on what it introduces: a secret in
          one of its commits, or a name or a place 032 forbids in a file it
          touched. Default true, and it stays true. Set false only with a
          reason at the call site.
        type: boolean
        default: true
      fail_on_existing:
        description: >-
          Block a push to the default branch, a schedule or a dispatch on the
          standing state: every commit in the history and every tracked file.
          Default FALSE, the Principle 3 stabilization window, held per
          repository while its history is answered (rotate, per 032 SE8) and
          its tree is cleaned, then flipped. The test for whether a repository
          still deserves it is whether its count is falling. Findings stay in
          the step log and the step is marked failed-but-continued.
        type: boolean
        default: false

jobs:
  secret-scan:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - name: Resolve the repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      # The whole history, because history is the subject (SE4). A pull request
      # still needs its base commit reachable for the range below.
      - name: Checkout the repo under test, with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-root/${{ steps.repo.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      # The checker, the config and the corpus come from the catalog at its
      # default branch, the same way job-ci-conformance takes its checkers.
      # When the repo under test IS the catalog, its own tree is used instead,
      # so a change to the checker is judged by the run that ships it.
      - name: Checkout the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurum-alpha/workflows
          path: .aurum-catalog
          persist-credentials: false

      - name: Decide which tree carries the scanner
        id: catalog
        env:
          REPO: ${{ steps.repo.outputs.name }}
        run: |
          if [ -x ".ci-root/$REPO/tools/check-secret-locations" ] && [ -f ".ci-root/$REPO/config/gitleaks.toml" ]; then
            echo "dir=.ci-root/$REPO" >> "$GITHUB_OUTPUT"
          else
            echo "dir=.aurum-catalog" >> "$GITHUB_OUTPUT"
          fi

      # The runner image has python3 and no pip, the finding job-ci-conformance
      # records. setup-python brings its own interpreter with pip.
      - name: A Python with pip
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the checker's one dependency
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python -c 'import yaml; print("PyYAML", yaml.__version__)'

      # The shim runs the pinned image as the runner's own user, so git inside
      # it owns what it reads, with the scanned directory at /scan and the
      # catalog's config directory at /config. Every gitleaks call below, the
      # proof's included, goes through it, so the proof and the scan cannot
      # run two different scanners.
      - name: Put the pinned gitleaks on PATH
        env:
          CATALOG: ${{ steps.catalog.outputs.dir }}
        run: |
          docker pull --quiet "$GITLEAKS_IMAGE"
          mkdir -p "$RUNNER_TEMP/bin"
          config_dir="$(realpath "$CATALOG/config")"
          cat > "$RUNNER_TEMP/bin/gitleaks" <<SHIM
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "\${1:-}" = "version" ]; then exec docker run --rm "$GITLEAKS_IMAGE" version; fi
          sub="\$1"; dir="\$(realpath "\$2")"; shift 2
          exec docker run --rm --user "\$(id -u):\$(id -g)" -e HOME=/tmp \\
            -v "\$dir:/scan" -v "$config_dir:/config:ro" \\
            "$GITLEAKS_IMAGE" "\$sub" /scan "\$@"
          SHIM
          chmod +x "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # Both halves against the standard's own cases, with the config the scan
      # is about to use. The self-test covers the grammar decisions the corpus
      # does not reach. Neither is warn-only: a scanner that fails its proof
      # judges nothing.
      - name: The scanner holds against the secrets corpus
        env:
          CATALOG: ${{ steps.catalog.outputs.dir }}
        run: |
          "$CATALOG/tools/check-secret-locations" --self-test
          "$CATALOG/tools/check-secret-locations" --corpus "$CATALOG/contracts/secrets/corpus.json" \
            --gitleaks-config /config/gitleaks.toml

      # A pull request and a merge group are judged on what they introduce, from
      # the base the event names. Everything else is judged whole. Which of the
      # two inputs blocks follows from the same split.
      - name: Decide what this event judges
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          FAIL_ON_NEW: ${{ inputs.fail_on_new }}
          FAIL_ON_EXISTING: ${{ inputs.fail_on_existing }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE"; blocking="$FAIL_ON_NEW" ;;
            merge_group)  base="$MG_BASE"; blocking="$FAIL_ON_NEW" ;;
            *)            base="";         blocking="$FAIL_ON_EXISTING" ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ]; then
            echo "judging what $GITHUB_EVENT_NAME introduces since ${base:0:12}; blocking=$blocking"
          else
            echo "judging the whole history and tree on $GITHUB_EVENT_NAME; blocking=$blocking"
          fi

      # --redact keeps every value out of the log (SE5); -v prints the file, the
      # line, the rule and the commit of each finding, which is what a person
      # needs to rotate it. A repository's own .gitleaks.toml and inline allow
      # markers are inert here, by --config and by --ignore-gitleaks-allow. A
      # .gitleaksignore is removed from the checkout first: gitleaks reads the
      # one in the tree it scans whatever ignore path it is given. The index
      # still lists it, and the step below reports it.
      - name: Known credential shapes and high-entropy strings, in every commit this event judges
        continue-on-error: ${{ steps.scope.outputs.blocking != 'true' }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          rm -f ".ci-root/$REPO/.gitleaksignore"
          if [ -n "$BASE" ]; then
            gitleaks git ".ci-root/$REPO" --redact --no-banner --no-color -v \
              --config /config/gitleaks.toml --ignore-gitleaks-allow \
              --log-opts "$BASE..HEAD"
          else
            gitleaks git ".ci-root/$REPO" --redact --no-banner --no-color -v \
              --config /config/gitleaks.toml --ignore-gitleaks-allow
          fi

      - name: Names, placeholders and places 032 forbids, in every tracked file this event judges
        if: ${{ !cancelled() }}
        continue-on-error: ${{ steps.scope.outputs.blocking != 'true' }}
        env:
          CATALOG: ${{ steps.catalog.outputs.dir }}
          REPO: ${{ steps.repo.outputs.name }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          if [ -n "$BASE" ]; then
            "$CATALOG/tools/check-secret-locations" --repo-root ".ci-root/$REPO" --changed-only "$BASE"
          else
            "$CATALOG/tools/check-secret-locations" --repo-root ".ci-root/$REPO"
          fi
