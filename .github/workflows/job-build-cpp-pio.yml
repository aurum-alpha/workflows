# aurum-job: capability=build language=cpp role=build
# Portfolio capability: build for a PlatformIO C/C++ firmware unit (CI_STANDARD
# Principle 12 — one way per capability). Tool tier: `pio` is PlatformIO's CLI,
# not one board's or one framework's, so this job serves any PlatformIO project
# — the caller says which environments to build.
#
# Variants are environments. A firmware project expresses DEBUG / STAGING /
# PRODUCTION as PlatformIO environments in platformio.ini, so the matrix is
# over `envs` and nothing here knows what any particular environment means.
#
# The caller owns the job id and needs: wiring; this file owns the body.
name: job-build-cpp-pio

on:
  workflow_call:
    inputs:
      envs:
        description: >-
          JSON array of PlatformIO environment names to build, e.g.
          '["lid-dev","lid-staging","lid-prod"]'. JSON and not a newline list
          deliberately: it goes straight into the matrix via fromJSON, so there
          is no shell loop to read it and no empty-line guard to get wrong.
        type: string
        required: true
      platform_slug:
        description: >-
          Identifies the pinned PlatformIO platform in the cache key, e.g.
          `tasmota-2023.06.02`. Change it in the same commit as the pin.
        type: string
        required: true
      artifact_glob:
        description: >-
          Glob for the built binaries to hand downstream, relative to the repo
          root. Missing files fail the job: an empty artifact is how a
          downstream packaging step comes to publish nothing and report success.
        type: string
        required: true
      artifact_prefix:
        description: >-
          Artifact name prefix; the environment name is appended, so
          `firmware-` yields `firmware-lid-prod`. Downstream jobs collect them
          with `pattern: <prefix>*`.
        type: string
        required: false
        default: firmware-
      python_version:
        description: Python for the pio CLI itself, not for the firmware.
        type: string
        required: false
        default: "3.11"
      retention_days:
        description: >-
          Retention for the per-environment binaries. These are a hand-off to
          the next job in the same run, not a deliverable — the durable upload
          is the packaging job's business.
        type: number
        required: false
        default: 1
      runner:
        description: Override the runner (Principle 4 escape hatch).
        type: string
        required: false
        default: ""
      version_file:
        description: >-
          File holding the SemVer this build stamps (Principle 14). A repo with
          no version file is fine and none is required: the stamp then says
          `dev`, and the commit still says what the artifact is.
        type: string
        required: false
        default: ".version"
    outputs:
      version:
        description: The version file's contents, verbatim. `dev` if absent.
        value: ${{ jobs.build.outputs.version }}
      version_changed:
        description: >-
          `true` when this commit changed the version file. THE RELEASE SWITCH:
          a version-named emission — a tag, a release, a versioned package — is
          produced only where this is true. Read it as
          `needs.<build-job>.outputs.version_changed == 'true'` alongside the
          main-branch condition.
        value: ${{ jobs.build.outputs.version_changed }}
      stamp:
        description: >-
          What the build stamps. Equals `version` on a release commit;
          otherwise a SemVer pre-release of the next patch
          (`0.43.1-dev.<sha7>`), so a firmware image taken off a mid-stream run
          cannot be mistaken for the release it is not.
        value: ${{ jobs.build.outputs.stamp }}

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # One environment failing to compile should not hide whether the others
      # do. A firmware project's environments differ in flags, and a flag that
      # breaks only PRODUCTION is exactly what this matrix exists to catch.
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.envs) }}
    outputs:
      # LAST WRITER WINS, and that is harmless for these three and only these
      # three: every matrix leg reads the same version_file at the same commit,
      # so all legs write the same strings and which leg lands cannot matter.
      # Nothing per-leg may be added here — a path or a digest would be
      # silently nondeterministic. Per-leg results leave as artifacts, which
      # are named per leg and cannot collide.
      version: ${{ steps.stamp.outputs.version }}
      version_changed: ${{ steps.stamp.outputs.version_changed }}
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits, so the stamp step can ask whether THIS commit changed
          # the version file. Resolves on a push (the previous commit) and on a
          # pull request (the base branch tip, because the checked-out merge
          # ref's first parent is the base).
          fetch-depth: 2

      # The same question job-go-build answers for Go repos, answered the same
      # way for PlatformIO ones, so a firmware repo does not invent its own
      # versioning semantics. AURUM_VERSION_STAMP goes into the environment as
      # well as the outputs, because a PlatformIO build reads its version
      # through an extra_script rather than through a linker flag the caller
      # could pass.
      - name: Resolve the version stamp
        id: stamp
        shell: python3 {0}
        env:
          VERSION_FILE: ${{ inputs.version_file }}
        run: |
          import os, pathlib, subprocess

          # --- BEGIN shared: version stamp. KEEP EVERY COPY IDENTICAL.
          # tools/check-version-stamp-shared compares this region across every catalog
          # job that carries it and fails if they diverge, so editing one copy without
          # the others turns this repo red rather than letting two build systems drift
          # into two versioning semantics.
          #
          # It is duplicated rather than extracted because a reusable workflow runs in
          # the CALLER's checkout: it cannot reference a catalog composite without its
          # own SHA pin, which makes every change a two-commit dance. setup/node-pnpm's
          # header records the portfolio making the same trade for the same reason. The
          # checker is what makes the duplicate safe.
          def resolve_version_stamp(version_file, version, commit):
              """Did THIS commit cut a release, and what should the build stamp?

              Returns (changed, stamp). One answer, so nothing downstream re-derives it.

              A release is a commit that changed the version file. fetch-depth: 2 makes
              HEAD^ available; it resolves on a push (the previous commit) and on a pull
              request (the base branch tip, because the merge ref's first parent is the
              base). A root commit has no parent and is not a release: a repository's
              first commit is not a release event.

              Anything else is a PRE-RELEASE of the next PATCH, which is a floor rather
              than a guess. Whatever the next release turns out to be it is at least
              0.15.1, so the stamp sorts above the last release and below every release
              that could follow:

                  0.15.0  <  0.15.1-dev.abc  <  0.15.1-rc.1  <  0.15.1  <  0.16.0

              Build metadata (0.15.0+dev.abc) would be wrong: SemVer ignores it in
              precedence, so such a build compares EQUAL to the release it is not.
              `dev` and not `beta` or `rc`, which belong to pre-releases a human cuts on
              purpose; ordering is unaffected, since dev < rc by SemVer's ASCII rule.

              Debian is NOT this string. dpkg reads `-` as the separator before the
              debian-revision, so 0.15.1-dev.abc sorts ABOVE 0.15.1 there; a .deb wants
              `~`. That rendering belongs to whichever job packages one.
              """
              import pathlib as _pathlib, re as _re, subprocess as _subprocess

              def _cut_release():
                  if not _pathlib.Path(version_file).is_file():
                      return False
                  if _subprocess.run(["git", "rev-parse", "--verify", "-q", "HEAD^"],
                                     capture_output=True).returncode != 0:
                      print("HEAD has no parent; treating this as not a release.")
                      return False
                  r = _subprocess.run(["git", "diff", "--name-only", "HEAD^", "HEAD"],
                                      capture_output=True, text=True)
                  if r.returncode != 0:
                      # Never guess True. A false positive mints a version; a false
                      # negative only withholds one, and a withheld release is a pull
                      # request someone reopens.
                      print(f"::warning::could not diff HEAD^..HEAD "
                            f"({r.stderr.strip()}); treating this as not a release.")
                      return False
                  return version_file in r.stdout.split()

              changed = _cut_release()
              if changed or version == "dev":
                  return changed, version
              m = _re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
              if not m:
                  # No next patch to be a pre-release of, so say so and order nothing.
                  print(f"::warning::{version_file} reads {version!r}, which is not "
                        "MAJOR.MINOR.PATCH; stamping it unordered.")
                  return changed, f"{version}-dev.{commit}"
              major, minor, patch = (int(g) for g in m.groups())
              return changed, f"{major}.{minor}.{patch + 1}-dev.{commit}"
          # --- END shared: version stamp ---

          vf = pathlib.Path(os.environ["VERSION_FILE"])
          # No version file is a valid answer, not an error: Principle 16 says
          # a repo with nothing deciding from the string has no version at all.
          version = vf.read_text().strip() if vf.is_file() else "dev"
          commit = subprocess.run(["git", "rev-parse", "--short=7", "HEAD"],
                                  capture_output=True, text=True).stdout.strip() or "unknown"

          changed, stamp = resolve_version_stamp(
              os.environ["VERSION_FILE"], version, commit)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"version_changed={'true' if changed else 'false'}\n")
              fh.write(f"stamp={stamp}\n")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"AURUM_VERSION_STAMP={stamp}\n")
          print(f"version={version} stamp={stamp} release={changed} commit={commit}")

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      # Deliberately no restore-keys. A partial hit from a cache written before
      # the platform pin breaks the pinned platform's package postinstall, and
      # the failure surfaces as a compile error in the firmware rather than as
      # a bad cache — the worst place for it to surface. Exact key or cold.
      #
      # This block is repeated in job-test-unit-cpp-pio.yml. That is the
      # catalog's existing shape, not an oversight: ten job-*.yml files inline
      # the pnpm setup the same way. Hoisting it into a composite action would
      # need either a `./` path whose resolution inside a called workflow is
      # not something to guess at, or a pin of this repo to itself. If shared
      # setup is ever worth it, it is worth it for all twelve at once.
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ inputs.platform_slug }}-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Retain built binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}${{ matrix.env }}
          path: ${{ inputs.artifact_glob }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
