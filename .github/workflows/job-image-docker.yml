# Fleet capability: build and publish the container (CI_STANDARD Principle 12).
# System tier — docker is neither a language nor a framework.
#
# Replaces job-docker-image, which downloaded a single artifact named `dist`.
# That assumed one build job per repo; Phase F1 splits the build per deployable
# unit, so there are now two artifacts and they must land where the Dockerfile
# expects them. The layout is fixed by F0 rather than passed in: dist/public
# from vite, dist/index.js from esbuild.
name: job-image-docker

on:
  workflow_call:
    inputs:
      workdir:
        type: string
        default: "."
      image_name:
        description: Image name under ghcr.io/<owner>/. Defaults to the repo.
        type: string
        default: ""

jobs:
  image:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two artifacts, two destinations. Named downloads rather than "everything
      # in the run": an unnamed download also pulls buildx's .dockerbuild build
      # record, whose failure took out a release once already.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-dist
          path: ${{ inputs.workdir }}/dist/public
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-dist
          path: ${{ inputs.workdir }}/dist

      - name: Verify the image inputs
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          test -f dist/index.js
          test -d dist/public
          ls -la dist dist/public

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ inputs.image_name || github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      # Built on every pull request, pushed only from main: the publish path is
      # exercised on each PR with just the final push suppressed (Principle 17).
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.workdir }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
