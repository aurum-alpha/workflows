# The edge for __REPO__, at port offset +0.
#
# This is the one address a person types, and the one routing table in front of
# everything else (016-local-development.md LD4).
#
# THIS FILE HOLDS THE AUTHENTICATION TIER'S OWN PLUMBING AND NOTHING ELSE.
# The edge's hops for the product's paths are rendered from devkit.json into
# the block near the bottom. The gateway names hops; what is behind a hop is
# the product's business, and it may be one process or a dozen.
#
# Rendered by textual substitution. devkit/README.md carries the table.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

__UPSTREAMS__
upstream authproxy {
    server oauth2-proxy:4180;
}

server {
    listen 80;
    server_name _;

    # A `return 302 /path` below is emitted as the relative Location it was
    # written as. nginx otherwise makes it absolute from its own listen port,
    # which is 80 inside the container and not the block's +0 on the host, so
    # the sign-in redirect would send a browser to a port nothing publishes.
    absolute_redirect off;

    # nginx drops every inherited proxy_set_header in a location that declares
    # one of its own, so each location below repeats the whole block.
    #
    # An Authorization line set to "" strips whatever the client sent. That is
    # right for the relying party's own endpoints, and for a location whose
    # session this tier established. It is WRONG for a route the gateway hands
    # straight to a service, because the credential the service is meant to
    # check arrives in that header. Those locations set no Authorization line
    # at all and nginx forwards what came in.

    # The edge's own liveness, for the compose healthcheck. It answers before
    # any upstream exists, so a failing probe names the edge and not the API.
    location = /edge-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # The relying party's own endpoints. Never behind auth_request: this is
    # where an unauthenticated person is sent to authenticate.
    # ---------------------------------------------------------------------
    location /oauth2/ {
        proxy_pass                         http://authproxy;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Authorization     "";
    }

    # The auth_request subrequest. It inherits the client's request headers,
    # so the inbound Authorization is cleared here too: a client must not be
    # able to present its own bearer to the relying party.
    location = /oauth2/auth {
        internal;
        proxy_pass                         http://authproxy;
        proxy_pass_request_body            off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Authorization     "";
    }

    # RP-initiated logout (AU5): end the proxy session, then the provider's.
    # Stopping after the first hop leaves the provider session alive, and the
    # next click on sign-in signs the person straight back in.
    location = /logout {
        return 302 /oauth2/sign_out?rd=http%3A%2F%2Flocalhost%3A__PORT_IDP__%2Frealms%2F__REPO__%2Fprotocol%2Fopenid-connect%2Flogout%3Fclient_id%3D__REPO__%26post_logout_redirect_uri%3Dhttp%3A%2F%2Flocalhost%3A__PORT_EDGE__%2F;
    }

    # ---------------------------------------------------------------------
    # The edge's hops for the product's paths, rendered from devkit.json. A
    # route whose next hop is `auth` runs the auth_request subrequest and
    # forwards the access token the relying party returns, as
    # `Authorization: Bearer` (060-auth.md AU2). Every other route is handed
    # to the named service with its headers untouched, and that service
    # authenticates it if it needs to (060-auth.md AU9). The application
    # registers these same paths in its own source; this table decides the
    # hop and nothing else.
    # ---------------------------------------------------------------------
    __ROUTES__
    location @sign_in {
        return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
    }
}
