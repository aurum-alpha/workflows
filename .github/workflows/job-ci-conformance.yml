name: ci-conformance

# Asserts the calling repo obeys CI_STANDARD, inside that repo's own CI, gated
# by its own ci-ok. This is the difference between a standard and a document:
# every principle it checks was written down first and violated afterwards, in
# a repo whose CI was green the whole time.
#
# It runs every caller-side checker in tools/. They were all written to be run
# from a workstation with eleven clones side by side, which is why none of them
# had ever run in CI and why check-fleet-versions' repo map could go stale for
# two renames without anything noticing. A check that only runs when someone
# remembers to run it is not a gate.
#
# check-catalog-loops is deliberately absent: it inspects this repo's own shared
# jobs, so it belongs in this repo's CI and nowhere else. check-standard-ref is
# absent for the same reason.
#
# The list is described rather than counted on purpose. It used to say "the four
# caller-side checkers" and "the fifth checker", which meant adding one made two
# sentences wrong — a small instance of exactly what this job exists to catch.
#
# Each checker gets its own step, and every step after the first runs even if an
# earlier one failed. A repo adopting this wants all its findings in one run,
# not one finding per push.
#
# No build, no network beyond two checkouts, a few seconds. It is a gate, so it
# belongs in ci-ok like any other.

on:
  workflow_call:
    inputs:
      runner:
        description: Override the runner (Principle 4 escape hatch).
        type: string
        required: false
        default: ""
      warn_only:
        description: >-
          Report findings without failing the job. The stabilization window of
          Principle 3, same contract as job-lint-js-eslint's input of the same
          name: a repo adopting conformance against existing debt runs
          warn-only while the debt burns down, then flips to a hard gate.

          It exists because the alternative is worse in both directions. A repo
          with debt either adopts the job and blocks every merge until the debt
          is paid, or does not adopt it and nobody sees the debt at all —
          which is how event-manager and client-manager, the two most
          complicated pipelines in the fleet, ended up being the two nobody
          checked.

          Findings stay in the step log and the step is marked
          failed-but-continued. Not a mode: a repo that leaves this true while
          its count does not fall is not stabilizing, it is hiding.
        type: boolean
        default: false
      standard_ref:
        description: >-
          Commit of aurum-alpha/workflows to take the checkers from. A caller
          pinning this workflow by SHA gets fixed checkers too, which is the
          point — but only if this default moves in the same commit as the
          checkers. GitHub gives a called workflow no handle on its own SHA, so
          there is nothing to derive it from and it has to be written down.

          It was not, for twenty commits: this default sat on 81b6b62 while
          tools/check-ci-conformance changed twenty times, so a caller would
          have run a checker with none of the rules added since — including the
          one that would have caught the drift that made this obvious. Nothing
          reported it because no repo called this workflow at all (issue #79).

          One commit of lag is inherent and not a bug to chase: this default
          can never name the commit that sets it. It points at the previous
          main, so a caller gets every rule up to the change that shipped it.
          What must not happen again is twenty.

          The lag is harmless for a rule change and fatal for a NEW CATALOG
          FILE, because rule CAT and the permissions checker read the catalog
          listing out of this same clone. job-go-build.yml landed in #97 with
          this default one commit behind it, so gofast — the first repo to
          call it — was told the job "does not exist in the catalog", by a
          checker looking at a tree from before it did. The job was there; the
          instrument could not see it and reported that as absence. Move this
          default in the same wave that adds a catalog file, not the one after.
        type: string
        required: false
        default: 4dc0c27ab6905c9c0cf331306793fdbc688b220a

jobs:
  ci-conformance:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # check-caller-permissions and check-fleet-versions
      # all address a repo by name under a root holding one clone per repo, so
      # the repo under test is checked out at the path its own name implies
      # rather than at the workspace root. Taken from GITHUB_REPOSITORY, not the
      # event payload, so it does not depend on which event triggered the CI.
      - name: Resolve the repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout the repo under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-root/${{ steps.repo.outputs.name }}

      # aurum-alpha/workflows is public, so this needs no token — which is the
      # whole reason the check can live inside each repo instead of in a
      # fleet-wide sweep that only ever ran when someone remembered to run it.
      - name: Checkout the standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurum-alpha/workflows
          ref: ${{ inputs.standard_ref }}
          path: .aurum-standard
          persist-credentials: false

      # The CHECKERS come from standard_ref, pinned; the CATALOG LISTING comes
      # from the default branch, current. They are different questions and were
      # sharing one clone.
      #
      # "Which rules apply to me" should be reproducible, so pinning it is
      # right. "Does job-go-build.yml exist in the catalog" is a question about
      # the catalog as it is NOW — and standard_ref can never name the commit
      # that sets it, so it is permanently at least one commit behind. Rules CAT
      # and check-caller-permissions read the listing, so on the day a new
      # shared job lands, the first repo to call it is told the job does not
      # exist, by a checker looking at a tree from before it was added. gofast
      # was that repo; the finding even suggested a wrong fix.
      #
      # A caller pinning this workflow still gets fixed RULES. What it stops
      # getting is a stale answer to a question that has no business being
      # pinned.
      - name: Checkout the catalog listing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurum-alpha/workflows
          path: .aurum-catalog
          persist-credentials: false

      # check-caller-permissions is the one checker that parses YAML properly
      # rather than by pattern — it has to resolve job-level blocks against
      # workflow-level ones, and a regex that got that wrong would report the
      # opposite of the truth about a token grant. PyYAML is therefore a real
      # dependency, and the runner image does not carry it.
      #
      # It has no pip either: the first attempt at this installed PyYAML with
      # `python3 -m pip` and got "No module named pip" from the system
      # interpreter. setup-python brings its own Python with pip, which
      # lid-firmware already relies on for exactly this, on these runners.
      - name: A Python with pip
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Verified after installing, not assumed. An install that half-works and
      # a checker that cannot see produce the same silence, and this job exists
      # because checks that could not see had been reporting nothing for months.
      - name: Install the checkers' one dependency
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: ci.yml conforms to CI_STANDARD
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-standard/tools/check-ci-conformance --repo-root ".ci-root/$REPO"
        continue-on-error: ${{ inputs.warn_only }}


      - name: The caller grants what the shared jobs request
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-standard/tools/check-caller-permissions --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      - name: Toolchain versions match the fleet
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-standard/tools/check-fleet-versions --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # The shared eslint config says, in its own header, that a byte-identity
      # checker fails the build if one repo edits it. No such checker existed;
      # six repos matched by luck and the sentence was decoration. This is it.
      - name: The shared eslint config is unedited
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-standard/tools/check-eslint-config --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # AGENTS.md says there is one source of agent guidance and only one. What
      # it could not say, until this step existed, is what happens when a repo
      # has seven. Nothing happened: the trees sat there agreeing by luck, and
      # the one that had drifted was the one carrying content the others lacked.
      #
      # A repo not yet in the checker's ADOPTED list still gets every finding
      # printed here — it just does not fail on them. That is the same contract
      # check-ci-conformance gives an UNCONVERTED repo, and it exists so an
      # unadopted repo is visibly a known gap rather than silently unchecked.
      - name: One source of agent guidance
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-standard/tools/check-agent-docs --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}
