name: kin34-apply-playwright-pin
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kin34-apply-playwright-pin.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/kin-34-e2e-playwright-job-e350
          fetch-depth: 0
      - name: Restore and patch three files
        run: |
          set -euo pipefail
          git config user.name "j27-aurum"
          git config user.email "216346573+j27-aurum@users.noreply.github.com"
          # Restore dependency-versions.json from the yml-only commit, then apply the three-file patch
          git show e59a4ae:dependency-versions.json > dependency-versions.json
          git show e59a4ae:standards/010-ci.md > standards/010-ci.md
          git show e59a4ae:tools/check-ci-conformance > tools/check-ci-conformance
          git apply <<'PATCH'
diff --git a/dependency-versions.json b/dependency-versions.json
index c1c7d10..5cf4a0f 100644
--- a/dependency-versions.json
+++ b/dependency-versions.json
@@ -332,9 +332,15 @@
     "drizzle-kit latest 0.31.x). Vitest 5, pnpm 12, concurrently 10 and",
     "React 19.3 stay deferred. postcss and autoprefixer stay asserted even",
     "though no unit declares them today, so the next adopter is held to the",
-    "new line from the first commit."
+    "new line from the first commit.",
+    "",
+    "@playwright/test is asserted where present for job-test-e2e-playwright.",
+    "The job runs the suite inside the Playwright Docker image at the same",
+    "version, pinned by digest in the workflow. Bump the package here and the",
+    "image pin in the job together."
   ],
   "devDependencies": {
+    "@playwright/test": "1.64.1",
     "@tailwindcss/typography": "0.5.20",
     "@tailwindcss/vite": "4.3.3",
     "@types/memoizee": "0.4.12",
diff --git a/standards/010-ci.md b/standards/010-ci.md
index 2695fb5..214cec9 100644
--- a/standards/010-ci.md
+++ b/standards/010-ci.md
@@ -1598,6 +1598,10 @@ files on disk:
 - `job-typecheck-ts-tsc`: `tsc -b --noEmit`.
 - `job-test-unit-js-vitest`: `vitest run --coverage`, publishes `coverage-*`
   and `testresults-*` artifacts (1-day).
+- `job-test-e2e-playwright`: compose stack from staged image digests, never a
+  rebuild; `pnpm test:e2e` at the edge (LD4). Failure uploads the Playwright
+  HTML report and traces. Browsers are the Playwright Docker image, pinned by
+  digest; `@playwright/test` is pinned in `dependency-versions.json`.
 - `job-depcheck-js-knip`: `knip --dependencies`, unused packages per unit.
 - `job-publish-npm-ghp`: `pnpm pack` then `pnpm publish` to GitHub Packages,
   under the `@aurum-alpha` scope, gated on `version_changed`. The one job here
@@ -2335,6 +2339,7 @@ job-go-build           job-go-fmt             job-go-vet            job-go-lint
 job-go-test-unit       job-go-govulncheck     job-go-mod
 job-build-js-vite      job-build-js-esbuild   job-build-ts-lib      job-lint-js-oxlint
 job-fmt-js-prettier    job-typecheck-ts-tsc   job-test-unit-js-vitest
+job-test-e2e-playwright
 job-depcheck-js-knip   job-build-cpp-pio      job-test-unit-cpp-pio
 ```
 
diff --git a/tools/check-ci-conformance b/tools/check-ci-conformance
index c1cc38e..c161fea 100755
--- a/tools/check-ci-conformance
+++ b/tools/check-ci-conformance
@@ -372,6 +372,8 @@ CALLEE_NEEDS = {
     "job-image-starts": {"packages": "read"},
     "job-image-publish": {"packages": "write"},
     "job-image-prune": {"packages": "write"},
+    # Staged digests from ghcr, and private @aurum-alpha packages at install.
+    "job-test-e2e-playwright": {"packages": "read"},
     "job-version-gate": {"pull-requests": "write"},
     # Creating the tag and the release writes to the repository. The grant is
     # reached only on the main-push path inside the job; the caller still has
PATCH
          git add dependency-versions.json standards/010-ci.md tools/check-ci-conformance
          git commit -m "KIN-34: pin @playwright/test and document job-test-e2e-playwright"
          git push origin HEAD:cursor/kin-34-e2e-playwright-job-e350
