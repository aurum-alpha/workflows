# oauth2-proxy for __REPO__: the OpenID Connect relying party behind nginx's
# auth_request (060-auth.md AU1, AU7 topology A, solutions/060-auth.md).
#
# Rendered by textual substitution. devkit/README.md carries the table.

http_address = "0.0.0.0:4180"
reverse_proxy = true

# In auth_request mode nothing is proxied through here, so the upstream is a
# fixed 202. nginx owns the routing table.
upstreams = ["static://202"]

provider = "oidc"
provider_display_name = "Keycloak"
client_id = "__REPO__"
client_secret = "devkit-local-only-__REPO__"

# No redirect_url. The relying party derives the callback from the host the
# browser is on, so a login begun on northwind.localhost lands its callback,
# and therefore its cookie, on northwind.localhost. A fixed value would land
# every tenant host's session on the apex. The realm's redirect list names the
# apex and each host devkit.json declares under tenant_hosts, so a derived
# callback is one the provider expects.

# Discovery is off, and the endpoints are written out one by one. The browser
# and the containers reach the provider by different names, so one discovery
# document cannot be right for both. The issuer and the authorize URL are the
# name a browser uses; the token and JWKS URLs are the name a container uses.
# Swapping those two halves is the failure this section exists to prevent.
skip_oidc_discovery = true
oidc_issuer_url = "http://localhost:__PORT_IDP__/realms/__REPO__"
login_url = "http://localhost:__PORT_IDP__/realms/__REPO__/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/__REPO__/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/__REPO__/protocol/openid-connect/certs"
profile_url = "http://keycloak:8080/realms/__REPO__/protocol/openid-connect/userinfo"

# The provider issues one issuer string whichever name it was reached by, and
# the compose fragment pins it with KC_HOSTNAME. That is what lets the value
# above be compared byte for byte.

scope = "openid email profile"
code_challenge_method = "S256"
email_domains = ["*"]

# AU3 keys on a verified address, so an unverified one is refused here as well
# as at the provider's login page.
insecure_oidc_allow_unverified_email = false

# One provider, so the chooser page is a click that decides nothing.
skip_provider_button = true

# A caller's own bearer token is never a session. The cookie is the session,
# and nginx strips any inbound Authorization before this subrequest runs.
skip_jwt_bearer_tokens = false

# AU2: both tokens cross the hop, and one of them is the credential. In
# auth_request mode the relying party answers the subrequest with the access
# token in the X-Auth-Request-Access-Token response header (set_xauthrequest
# together with pass_access_token) and the ID token in its Authorization
# response header (set_authorization_header). nginx reads both with
# auth_request_set: the access token becomes Authorization: Bearer on the
# request it forwards, which is what a backend authenticates on, and the ID
# token becomes X-Forwarded-Id-Token, which a backend refuses as a bearer on
# its typ (RFC 9068 section 4) and reads only where its Conventions say so.
set_authorization_header = true
pass_authorization_header = false
pass_access_token = true
pass_basic_auth = false
pass_user_headers = false
set_xauthrequest = true

# AU5: the absolute session maximum is seven days, and the cookie carries it.
# The refresh window is inside the 300-second token lifespan, so the forwarded
# token is renewed behind an unchanged cookie and the browser sees nothing.
#
# THE COOKIE IS PLAIN AND NOT SECURE, AND THAT IS LOCAL DEVELOPMENT SPEAKING.
# 060 AU7 and 092 TH4 fix the production cookie as __Host-<name>, Secure,
# host-only. This stack is plain HTTP on localhost and *.localhost, where a
# Secure attribute protects nothing, and oauth2-proxy forces https onto every
# derived callback while the cookie is Secure -- which nothing here serves.
# So the local cookie drops both, and nothing about it reaches a deployment.
cookie_name = "__REPO__-session"
cookie_secret = "ZGV2a2l0LWxvY2FsLW9ubHktY29va2llLXNlY3JldCE="
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "604800s"
cookie_refresh = "240s"

# No cookie_domain. The browser scopes the cookie to the exact host that set
# it, so a session on one tenant host is never presented to another (TH4).

# Where a person is sent after the relying party's own redirects: back to the
# edge on whichever host they were on. The leading dot admits every
# *.localhost tenant host.
whitelist_domains = ["localhost:__PORT_EDGE__", ".localhost:__PORT_EDGE__"]
