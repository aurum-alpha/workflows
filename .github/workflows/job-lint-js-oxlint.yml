# Fleet capability: lint for one deployable unit's JS/TS source, oxlint flavour
# (CI_STANDARD Principle 12 — one way per capability, and this is the second
# way, deliberately).
#
# oxlint and eslint are not interchangeable, and the direction of that has
# changed. oxlint is Rust and runs the syntactic rules in about a second; with
# `--type-aware` (oxlint-tsgolint, typescript-go) it also runs the rules that
# need the type checker, and with the JS plugin bridge it runs the eslint
# plugins it has not ported. Measured against the fleet eslint config on
# gofast's client, it reports every finding eslint reports and eight more. It
# is not a subset any more.
#
# It is the fleet's only JS linter now; the eslint job it ran beside is gone.
#
# Callers are warn_only, and the reason is DEBT rather than the tool. That
# distinction used to be the other way round and the old wording is worth not
# repeating: this comment justified warn_only by calling the JS plugin API
# alpha, which made a stabilization window read as distrust of the linter. The
# fleet has run oxlint across every repo for releases and has its own evidence
# — every rule the eslint config configured, matched finding for finding,
# type-aware rules included, and more besides. What holds the gate open is the
# roughly 870 errors and 3,700 warnings already in the tree, which is exactly
# the stabilization window Principle 3 describes: findings visible, gate open,
# flipped when the count comes down. See CI_STANDARD "One linter, after two on
# purpose".
name: job-lint-js-oxlint

on:
  workflow_call:
    inputs:
      workdir:
        description: >-
          Directory holding package.json and .node-version, relative to the
          repo root. Defaults to `.`, the repo root, for a repo whose JS
          project *is* the repo; `client` is the other common shape, a React
          app in its own pnpm project inside a Go or PHP tree. Any other path
          is accepted — the catalog standardises the toolchain, not the tree
          (workflows#252). It must be relative, must not escape the root, and
          must contain a package.json; the job fails naming the path if not.
        type: string
        default: "."
      dir:
        description: >-
          Path to lint, relative to `workdir`. An oxlint path argument and
          nothing more — `client`, `src/client/react`, `server/api`, whatever
          this call should cover.

          It used to accept only `client`, `server` or `shared`. That rule was
          dropped here and in the eslint job this one replaced, for a reason
          that applies to any path input: a repo with more than one client has
          no way to name the second, and `src/` is an ordinary layout rather
          than drift. Layout
          is enforced by CI_STANDARD and check-ci-conformance, which is where it
          belongs; smuggling it into a path argument only meant this job could
          not lint code that plainly needed linting — event-manager's
          `src/client/react` among it.

          One path per call. A repo with several trees to lint calls this
          several times and names each job, which is also how it gets a
          separate check per tree instead of one verdict over all of them.
        type: string
        required: true
      warn_only:
        description: >-
          Report findings without failing the job. This is a documented
          stabilization window (CI_STANDARD Principle 3), not a permanent mode:
          a repo adopting --max-warnings 0 against existing debt runs warn-only
          while the debt burns down, then flips to a hard gate. Findings stay
          visible in the step log and the step is marked failed-but-continued.
          Same contract as job-go-lint's input of the same name.
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # `dir` is an oxlint path argument, so the only things worth rejecting
      # are the two that would misfire rather than fail: an empty value, which
      # makes oxlint lint nothing while exiting 0, and a leading dash, which
      # oxlint would read as a flag. A path that simply does not exist needs no
      # check here — oxlint fails loudly on its own rather than silently
      # passing. Same two cases, same wording, as the eslint job this one
      # replaced — the guard outlived the job it was written for.
      - name: Validate lint path
        env:
          LINT_DIR: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          case "$LINT_DIR" in
            "")  echo "::error::dir is empty. oxlint would lint nothing and" \
                      "exit 0, reporting a pass over no files."; exit 1 ;;
            -*)  echo "::error::dir must be a path, not a flag; got" \
                      "'$LINT_DIR'."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workdir is DEFAULTED, not restricted. `.` is the common shape --
      # the JS project is the repo -- and `client` is the second, its own pnpm
      # project inside a Go or PHP tree. A repo that keeps its UI anywhere else
      # passes that path and the job runs there.
      #
      # This step used to REJECT anything but those two, on the argument that a
      # third path was variance the catalog exists to remove. That was the
      # wrong variance to remove. What the catalog standardises is the RUNNER
      # -- one pnpm, one TypeScript, one set of steps in one order, so a build
      # is reproducible and a version bump is one wave instead of eleven -- and
      # none of that depends on where the code sits. Restricting the path
      # bought uniformity in the dimension that costs nothing to vary, and cost
      # adoption in the dimension that matters: a repo whose layout did not fit
      # could not call the job at all, and therefore got none of the version
      # standardisation either. The toolchain is dictated; the tree is not.
      #
      # What is still checked is that the path is safe and real. It runs AFTER
      # checkout because the second half needs a tree, and it names the path so
      # a typo fails here rather than six steps later inside pnpm.
      - name: Validate workdir
        env:
          WD: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          case "$WD" in
            "") echo "::error::workdir is empty; use '.' for the repo root."
                exit 1 ;;
            /*) echo "::error::workdir must be relative to the repo root;" \
                     "got '$WD'."; exit 1 ;;
            ..|../*|*/../*|*/..)
                echo "::error::workdir must not escape the repo root;" \
                     "got '$WD'."; exit 1 ;;
          esac
          if [ ! -f "$WD/package.json" ]; then
            echo "::error::no package.json at workdir '$WD'." \
                 "The workdir names the directory holding package.json and" \
                 ".node-version, relative to the repo root."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.workdir }}/.node-version
          # Org registry for private @aurum-alpha packages; harmless no-op for
          # repos that don't consume the scope (pnpm 10+ only reads auth from
          # the user-level npmrc this writes).
          registry-url: https://npm.pkg.github.com
          scope: "@aurum-alpha"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.workdir }}/package.json
          # The default dest is ~/setup-pnpm, shared by every job on a
          # persistent self-hosted host; two installing pnpm at once race and
          # one dies on ENOTEMPTY. runner.temp is per-job — the same fix as
          # "Isolate Go caches to runner.temp" in the Go jobs. Kept identical
          # to setup/node-pnpm, which is this prelude's other copy.
          standalone: true
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Get pnpm store directory
        shell: bash
        working-directory: ${{ inputs.workdir }}
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      # oxlint invoked directly, not via a `lint` script whose only content is a
      # path (Phase F2). --deny-warnings because a warning nobody must fix is a
      # warning nobody reads. --type-aware turns on the rules that need the type
      # checker, which the shared .oxlintrc.json enables and which are half of
      # why this job is worth running at all.
      #
      # `dir` goes through the environment and quoted, never interpolated into
      # the script body, and the reason is the input's own history: it is
      # caller-supplied text now rather than one of four fixed words, and
      # ${{ }} inside `run:` is substituted before bash ever sees it.
      - name: Lint ${{ inputs.dir }}
        working-directory: ${{ inputs.workdir }}
        continue-on-error: ${{ inputs.warn_only }}
        env:
          LINT_DIR: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          pnpm exec oxlint "$LINT_DIR" --type-aware --deny-warnings
