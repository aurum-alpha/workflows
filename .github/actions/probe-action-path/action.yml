name: probe-action-path
description: >-
  THROWAWAY. Does a composite action fetched by owner/repo/path@ref bring the
  rest of its repository with it? If yes, the checkers can ride an action pin
  and standard_ref is unnecessary. Delete this action once the answer is known.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "GITHUB_ACTION_PATH=$GITHUB_ACTION_PATH"

        # The action lives at .github/actions/<name>, so the repo root is THREE
        # levels up, not two. The first run of this probe used two and landed on
        # .github/, which showed no tools/ and would have read as a refutation.
        root="$GITHUB_ACTION_PATH/../../.."

        echo "::group::repo root three levels up"
        ls -a "$root" 2>&1 || echo "no repo root"
        echo "::endgroup::"

        for d in tools standards contracts setup config; do
          if [ -e "$root/$d" ]; then
            echo "RESULT: $d/ IS present"
          else
            echo "RESULT: $d/ is NOT present"
          fi
        done

        if [ -x "$root/tools/check-ci-conformance" ]; then
          if "$root/tools/check-ci-conformance" --help >/dev/null 2>&1; then
            echo "RESULT: checker EXECUTES from the action's own tree"
          else
            echo "RESULT: checker present but did not execute"
          fi
        else
          echo "RESULT: checker not executable/absent"
        fi

        echo "RESULT: dependency-versions.json present? $([ -f "$root/dependency-versions.json" ] && echo yes || echo no)"
        echo "RESULT: git metadata present? $([ -e "$root/.git" ] && echo yes || echo no)"

        # No checkout in this job, so anything found above came with the action.
        echo "RESULT: workspace contents = [$(ls -A "$GITHUB_WORKSPACE" 2>/dev/null | tr '\n' ' ')]"
