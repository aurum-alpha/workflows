# The authentication tier for __REPO__: the edge, the relying party, the
# identity provider, and the two one-shots that make the personas usable.
#
# A product's own compose.yaml at the repository root includes this file:
#
#   include:
#     - path: dev/compose/auth.compose.yaml
#
# Relative paths below resolve against this file's directory, which is why the
# devkit tree and the rendered dev/ tree have the same shape.
#
# The product defines the services its routing table names, plus its database.
# devkit/compose/product.example.yaml is a worked example of that, and
# validates this file beside it. The names are the product's: one process or
# several, and this file cannot tell the difference.
#
# Host ports come from the project's block in ports.json, at the offsets
# 016-local-development.md LD4 fixes: the edge at +0, the identity provider at
# +6, its management and health port at +7. No service sets PORT (LD2).

services:
  edge:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "__PORT_EDGE__:80"
    volumes:
      - ../nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      oauth2-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/edge-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0-alpine
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    volumes:
      - ../oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4180/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      # The one credential this file mints, and it reaches nothing that exists
      # anywhere else (032-secrets.md SE9).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # The issuer string the provider stamps into every token, pinned to the
      # name a browser uses. The backchannel setting keeps the container-facing
      # token and JWKS URLs working against the same realm.
      KC_HOSTNAME: http://localhost:__PORT_IDP__
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "__PORT_IDP__:8080"
      - "__PORT_IDP_MGMT__:9000"
    volumes:
      - ../keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The image carries no curl and no wget, so the probe speaks HTTP over
      # the shell's own socket.
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # The two one-shots. Both are idempotent, both exit, and `docker compose up`
  # runs them in order before anything serves (016-local-development.md LD5,
  # LD8). The product supplies the commands: migrate applies the identity
  # tables, seed writes the application-side user and grant rows the realm's
  # personas correspond to.
  #
  # Neither depends on a database here, because this file does not know
  # whether the product has one: a product on SQLite migrates a file. A
  # product with a `db` service adds `depends_on: db` to both in its own
  # compose.yaml, which product.example.yaml shows.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    restart: "no"
    working_dir: /app
    command: ["tools/migrate"]
    volumes:
      # A product whose dev image resolves dependencies at build time mounts
      # its named dependency volume here too (LD7).
      - ../..:/app

  seed:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    restart: "no"
    working_dir: /app
    command: ["tools/seed-personas"]
    volumes:
      - ../..:/app
    depends_on:
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
