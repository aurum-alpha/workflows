# aurum-job: capability=ci-conformance language=- role=policy
name: ci-conformance

# Asserts the calling repo obeys CI_STANDARD, inside that repo's own CI, gated
# by its own ci-ok. This is the difference between a standard and a document:
# every principle it checks was written down first and violated afterwards, in
# a repo whose CI was green the whole time.
#
# It runs every caller-side checker in tools/. They were all written to be run
# from a workstation with eleven clones side by side, which is why none of them
# had ever run in CI and why check-dependency-versions' repo map could go stale for
# two renames without anything noticing. A check that only runs when someone
# remembers to run it is not a gate.
#
# check-catalog-loops and check-version-stamp-shared are deliberately absent:
# they inspect this repo's own shared jobs, so they belong in this repo's CI and
# nowhere else.
#
# The list is described rather than counted on purpose. It used to say "the four
# caller-side checkers" and "the fifth checker", which meant adding one made two
# sentences wrong — a small instance of exactly what this job exists to catch.
#
# Each checker gets its own step, and every step after the first runs even if an
# earlier one failed. A repo adopting this wants all its findings in one run,
# not one finding per push.
#
# No build, no network beyond two checkouts, a few seconds. It is a gate, so it
# belongs in ci-ok like any other.

on:
  workflow_call:
    inputs:
      runner:
        description: Override the runner (Principle 4 escape hatch).
        type: string
        required: false
        default: ""
      warn_only:
        description: >-
          Report findings without failing the job. The stabilization window of
          Principle 3, same contract as job-go-lint's input of the same
          name: a repo adopting conformance against existing debt runs
          warn-only while the debt burns down, then flips to a hard gate.

          It exists because the alternative is worse in both directions. A repo
          with debt either adopts the job and blocks every merge until the debt
          is paid, or does not adopt it and nobody sees the debt at all —
          which is how event-manager and client-manager, the two most
          complicated pipelines in the portfolio, ended up being the two nobody
          checked.

          Findings stay in the step log and the step is marked
          failed-but-continued. Not a mode: a repo that leaves this true while
          its count does not fall is not stabilizing, it is hiding.
        type: boolean
        default: false

jobs:
  ci-conformance:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # check-caller-permissions and check-dependency-versions
      # all address a repo by name under a root holding one clone per repo, so
      # the repo under test is checked out at the path its own name implies
      # rather than at the workspace root. Taken from GITHUB_REPOSITORY, not the
      # event payload, so it does not depend on which event triggered the CI.
      - name: Resolve the repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout the repo under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci-root/${{ steps.repo.outputs.name }}

      # ONE clone of the catalog, at the default branch, for both jobs it does:
      # it carries the CHECKERS this job runs, and it is the CATALOG LISTING
      # those checkers resolve `uses:` lines against.
      #
      # It used to be two clones at two refs. The checkers came from a
      # `standard_ref` input — a 40-hex sha typed into this file by hand — and
      # the listing came from the default branch, on the argument that "which
      # rules apply to me" should be reproducible while "does job-go-build.yml
      # exist" is a question about now.
      #
      # The first half of that argument is retired. A caller references this
      # catalog at @main and gets the current standard, because there is no
      # opt-out from the current standard; rule PIN enforces it. With nothing
      # pinning the rules, the two clones were the same commit twice.
      #
      # What standard_ref cost while it existed: it could never name the commit
      # that set it, so it was permanently at least one commit behind, and every
      # incident in this file's history is that gap. gofast was told a shared
      # job "does not exist" by a checker reading a tree from before it was
      # added. flight-watch was failed for dropping packages the portfolio had
      # already retired. A conformance run went green on a checker whose own
      # change had disabled it, because the declarations it needed were not yet
      # on the branch it read. Third-party actions stay sha-pinned; that is a
      # supply-chain control over code we do not own, and a different argument
      # entirely.
      #
      # aurum-alpha/workflows is public, so this needs no token — which is the
      # whole reason the check can live inside each repo instead of in a
      # portfolio-wide sweep that only ever ran when someone remembered to run it.
      - name: Checkout the catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurum-alpha/workflows
          path: .aurum-catalog
          persist-credentials: false
          # TAGS, and the history behind them, for check-catalog-pin-comments:
          # it resolves each pin's `# vX.Y.Z` comment with `git rev-list -n1`
          # against this clone. The default shallow checkout carries no tags at
          # all, and that checker refuses to run without them rather than
          # passing every repository having resolved nothing -- verified by
          # pointing it at a --depth 1 --no-tags clone, where it exits 2 on a
          # fixture containing four deliberate mismatches.
          #
          # MEASURED BEFORE ADDING, because this runs on every conformance job
          # in eleven repositories: the catalog is 281 commits, and a full
          # clone's .git is 20288 KB against the shallow clone's 20284 KB. Four
          # kilobytes. There is no throughput argument against it.
          fetch-depth: 0
          fetch-tags: true

      # check-caller-permissions is the one checker that parses YAML properly
      # rather than by pattern — it has to resolve job-level blocks against
      # workflow-level ones, and a regex that got that wrong would report the
      # opposite of the truth about a token grant. PyYAML is therefore a real
      # dependency, and the runner image does not carry it.
      #
      # It has no pip either: the first attempt at this installed PyYAML with
      # `python3 -m pip` and got "No module named pip" from the system
      # interpreter. setup-python brings its own Python with pip, which
      # lid-firmware already relies on for exactly this, on these runners.
      - name: A Python with pip
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Verified after installing, not assumed. An install that half-works and
      # a checker that cannot see produce the same silence, and this job exists
      # because checks that could not see had been reporting nothing for months.
      - name: Install the checkers' one dependency
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml
          python -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: ci.yml conforms to CI_STANDARD
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-ci-conformance --repo-root ".ci-root/$REPO"
        continue-on-error: ${{ inputs.warn_only }}


      - name: The caller grants what the shared jobs request
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-caller-permissions --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      - name: Toolchain versions match the portfolio
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-dependency-versions --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # The sibling of the check above, and the division is worth stating.
      # check-dependency-versions asks WHICH VERSION, for the packages the portfolio has
      # converged on. This asks a question about every other dependency too:
      # is it a version at all, or merely a range that permits one?
      #
      # A caret states a constraint; the lockfile records a resolution. Both
      # are authoritative and they answer different questions, which is exactly
      # how they drift. Four repos once declared autoprefixer ^10.4.20 off the
      # same registry and installed four different versions between them, one a
      # full minor ahead, with nothing red anywhere -- each repo was internally
      # consistent, and a lockfile cannot see across repositories.
      - name: Every dependency is pinned exactly
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-exact-pins --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # An override is the one place a version is still decided by somebody
      # else, so it is declared the pnpm way and it says why it exists. The
      # two forbidden keys are forbidden for opposite reasons: npm's
      # `overrides` does nothing under pnpm, and yarn's `resolutions` DOES
      # apply -- both measured, not read off the documentation.
      - name: Every override is sanctioned and explained
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-overrides --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # A shared lint config says, in its own header, that a byte-identity
      # checker fails the build if one repo edits it. No such checker existed;
      # six repos matched by luck and the sentence was decoration. This is it.
      #
      # .oxlintrc.json is the config it covers today, and that file made the
      # case for itself: oxlint's config was one repo's local file, and the
      # portfolio spent a release arguing about oxlint's coverage when it was
      # arguing with that file. A shared config nothing compares is a shared
      # config in name only. The checker's list is a tuple rather than a
      # constant precisely so entries can come and go -- eslint's did.
      - name: The shared lint configs are unedited
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-lint-configs --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # AGENTS.md says there is one source of agent guidance and only one. What
      # it could not say, until this step existed, is what happens when a repo
      # has seven. Nothing happened: the trees sat there agreeing by luck, and
      # the one that had drifted was the one carrying content the others lacked.
      #
      # Every caller is checked the same way. Calling this job IS the adoption,
      # so there is no list of adopting repositories to consult and no repo this
      # step knows by name; standing debt runs under warn_only above, which the
      # caller declares in its own ci.yml.
      - name: One source of agent guidance
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-agent-docs --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}

      # A pin is two halves -- @<sha> and the `# v2.3.4` beside it -- and until
      # this step every checker here read only the first. event-manager#124
      # shipped fourteen pins whose comments said v2.2.14 against SHAs that
      # were v2.3.2, and every gate in the portfolio passed. A human found it
      # two merges later, reading a diff, by chance.
      #
      # The comment is the half a reviewer actually reads: nobody recognises
      # 5d73b58dd264 on sight and everybody recognises v2.3.5. So a pin whose
      # comment lies is worse than a bare SHA -- an absent comment prompts a
      # lookup, a wrong one prevents it.
      #
      # This is the step that needs the catalog clone to carry tags, which is
      # why wave 1 added fetch-depth: 0 and fetch-tags: true a release ahead of
      # this line rather than alongside it.
      - name: Every catalog pin comment names the tag its SHA is
        if: ${{ !cancelled() }}
        env:
          REPO: ${{ steps.repo.outputs.name }}
          AURUM_CATALOG_ROOT: .aurum-catalog
        run: .aurum-catalog/tools/check-catalog-pin-comments --root .ci-root --repo "$REPO"
        continue-on-error: ${{ inputs.warn_only }}
