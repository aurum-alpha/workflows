# Fleet capability: conditionally rebuilt, registry-cached container image
# (CI_STANDARD Principle 12 — one way per capability; C6). Generalizes
# event-manager's create-docker-build-image / create-docker-prod-base-image
# pair: rebuild ghcr.io/<repo>/<image_name> only when files matching
# file_patterns changed (or the image is missing — self-bootstrapping),
# otherwise reuse :latest. Callers own the job id and needs: wiring.
name: job-image-cached

on:
  workflow_call:
    inputs:
      image_name:
        description: Image name under ghcr.io/<repository>/ (e.g. builder)
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        required: true
        type: string
      file_patterns:
        description: grep -E pattern of files whose changes force a rebuild
        required: true
        type: string
      build_args:
        description: Multiline KEY=value build args
        required: false
        default: ""
        type: string
      force_rebuild:
        description: Rebuild even if no changes detected
        required: false
        default: false
        type: boolean
    outputs:
      changed:
        description: Whether the image was rebuilt
        value: ${{ jobs.image.outputs.changed }}
      image:
        description: The image ref for subsequent jobs
        value: ${{ jobs.image.outputs.image }}

jobs:
  image:
    runs-on: ${{ vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.check-changes.outputs.changed || steps.update-flag.outputs.changed }}
      image: ${{ steps.set-image.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for change comparison

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for image-relevant changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "Forced rebuild (dispatch or force_rebuild)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
            HEAD_SHA=$(git rev-parse HEAD)
          fi
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E "${{ inputs.file_patterns }}" || true)
          if [ -n "$CHANGED" ]; then
            echo "Relevant files changed:"; echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant files changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if image exists
        id: check-image
        if: steps.check-changes.outputs.changed != 'true'
        continue-on-error: true
        run: |
          if docker pull "ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Self-bootstrapping: rebuild when the image is missing
      - name: Force rebuild if image missing
        id: update-flag
        if: steps.check-changes.outputs.changed != 'true'
        run: |
          if [ "${{ steps.check-image.outputs.exists }}" != "true" ]; then
            echo "Image missing - forcing rebuild"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.check-changes.outputs.changed == 'true' || steps.update-flag.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ inputs.build_args }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest
          cache-to: type=inline

      - name: Set image ref for jobs
        id: set-image
        run: |
          if [ "${{ steps.check-changes.outputs.changed }}" = "true" ] || [ "${{ steps.update-flag.outputs.changed }}" = "true" ]; then
            IMAGE="ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:${{ github.sha }}"
          else
            IMAGE="ghcr.io/${{ github.repository }}/${{ inputs.image_name }}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Using image: ${IMAGE}"
