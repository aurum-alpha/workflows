# The shared capability jobs live here, so this repo's action pins ARE the
# fleet's pins: a bump lands here once and propagates to every consumer as
# SHA-bump PRs against their `uses:` references.
version: 2
updates:
  - package-ecosystem: github-actions
    # `/` reaches .github/workflows and a root action.yml, and nothing else.
    # setup/node-pnpm/action.yml sat outside it and duly went stale: #123
    # re-pinned all ten inline node preludes and left the composite on
    # pnpm/action-setup v4.3.0 and actions/cache v4.3.0, silently, because no
    # instrument was looking at that path. actionlint does not cover it either
    # -- it lints workflows, not action manifests -- so Dependabot is the only
    # thing that can watch these pins. A composite added anywhere else needs
    # its own entry here on the same day it is added.
    directories:
      - /
      - /setup/node-pnpm
    schedule:
      interval: daily
    # Minor and patch bumps arrive as ONE pull request per run instead of one
    # per action. Majors are deliberately left ungrouped: a major action bump is
    # where breakage lives, so it gets its own review and its own revert.
    # Security updates are ungrouped too -- `applies-to` defaults to
    # version-updates -- so a security fix still lands on its own, immediately.
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
