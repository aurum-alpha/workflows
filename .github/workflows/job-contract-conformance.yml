# aurum-job: capability=contract-conformance language=- role=policy
name: contract-conformance

# Proves every *.schema.json under contracts/ parses as the dialect it names,
# its $id matches its path, and every $ref resolves to a file in the tree.
# Then runs the schema-decided half of every corpus the calling repository
# vendors, as each corpus's judged_by map states it: instances validated against the
# named schema, the runner checks the corpus names applied, and the verdict
# compared with the case's own. It proves decisions.json and entitlements.json
# are fixtures a runner can load; each platform module still executes check()
# itself, and each product that answers for billing still executes
# entitlementsFor() itself. It validates every repository file a schema names
# in x-repository-file. A part judged by running an implementation needs a
# live stack and is the product suite's. A repository that vendors no
# contract passes. --self-test is the catalog's own proof that a broken $ref
# is a finding.

on:
  workflow_call:
    inputs:
      runner:
        description: Override the runner (Principle 4 escape hatch).
        type: string
        required: false
        default: ""

jobs:
  contract-conformance:
    runs-on: ${{ inputs.runner || vars.RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the repo under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout the catalog for the checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurum-alpha/workflows
          path: .aurum-catalog
          persist-credentials: false

      # The runner image has python3 and no pip. `python3 -m pip` is
      # "No module named pip" here, the same finding job-ci-conformance
      # already records. setup-python brings its own interpreter with pip.
      - name: A Python with pip
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install jsonschema
        run: |
          python -m pip install --quiet --disable-pip-version-check jsonschema
          python -c 'import jsonschema; print("jsonschema", jsonschema.__version__)'

      - name: Run every corpus's schema-decided half
        run: |
          if [ -x tools/check-contract-conformance ]; then
            checker=tools/check-contract-conformance
          else
            checker=.aurum-catalog/tools/check-contract-conformance
          fi
          "$checker" --root .
          "$checker" --self-test
